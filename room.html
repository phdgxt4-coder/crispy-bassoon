<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>غرفتي — التفوق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh}
.top{width:100%;max-width:420px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a{color:#94a3b8;text-decoration:none;font-size:14px}
.top h1{font-size:17px;font-weight:800}
.hud{display:flex;gap:14px;font-size:14px;color:#cbd5e1}
canvas{width:min(360px,96vw);height:auto;border-radius:16px;background:#151b2e;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
.bot{width:100%;max-width:420px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.gold{background:linear-gradient(135deg,#E3A81C,#B45309);color:#1a1408}
.btn:active{transform:scale(.97)}
.hint{font-size:12px;color:#94a3b8;text-align:center;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:#1e293b;border-radius:20px;padding:22px;text-align:center;max-width:300px;width:100%}
.panel h2{margin-bottom:6px}
.panel p{color:#94a3b8;margin-bottom:14px}
</style>
</head>
<body>
<div class="top"><a href="./index.html">← المنصة</a><h1>🏠 غرفتي</h1><div class="hud"><span>⭐ <b id="sc">0</b></span><span>🏆 <b id="bs">0</b></span></div></div>
<canvas id="c" width="360" height="520"></canvas>
<div class="bot">
  <button class="btn gold" id="go">ابدأ</button>
  <div class="hint" id="hint">اختار عنصر من الشريط وحطه في الغرفة</div>
</div>
<div class="ov" id="ov"><div class="panel"><h2 id="ot">انتهت</h2><p id="om"></p><button class="btn gold" id="again">العب تاني</button></div></div>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
const ITEMS=[{e:'🛏️',n:'سرير',c:0},{e:'🪑',n:'كرسي',c:10},{e:'🪴',n:'نبتة',c:15},{e:'📺',n:'شاشة',c:25},{e:'📚',n:'كتب',c:12},{e:'🎮',n:'ألعاب',c:20},{e:'🖼️',n:'لوحة',c:18},{e:'💡',n:'لمبة',c:8},{e:'🧸',n:'دبدوب',c:14},{e:'🏆',n:'كأس',c:30}];
let coins=50,placed=[],sel=0,score=0;
try{const s=JSON.parse(localStorage.getItem('mini_room')||'null');if(s){coins=s.coins??50;placed=s.placed||[];score=s.score||0}}catch(_){}
scEl.textContent=score;bsEl.textContent=coins;
function save(){localStorage.setItem('mini_room',JSON.stringify({coins,placed,score}));scEl.textContent=score;bsEl.textContent=coins}
document.getElementById('go').onclick=()=>{coins+=15;save();document.getElementById('hint').textContent='+15 عملة'};
document.getElementById('again').textContent='مسح الغرفة';
document.getElementById('again').onclick=()=>{placed=[];score=0;coins=50;save();document.getElementById('ov').classList.remove('on')};
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*360,y=(e.clientY-r.top)/r.height*520;
  if(y>440){sel=Math.min(ITEMS.length-1,Math.max(0,Math.floor((x)/36)));document.getElementById('hint').textContent=ITEMS[sel].n+' ('+ITEMS[sel].c+'🪙)';return}
  const it=ITEMS[sel];if(it.c>0&&coins<it.c){document.getElementById('hint').textContent='العملات مش كفاية';return}
  coins-=it.c;placed.push({e:it.e,x,y});score+=5;save();document.getElementById('hint').textContent='اتحطّت '+it.n;
});
(function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#1e3a5f';g.fillRect(0,0,360,320);
  g.fillStyle='#334155';g.fillRect(0,320,360,200);
  placed.forEach(p=>{g.font='32px serif';g.fillText(p.e,p.x-16,p.y+10)});
  g.fillStyle='#0f172aee';g.fillRect(0,440,360,80);
  ITEMS.forEach((it,i)=>{g.globalAlpha=i===sel?1:0.45;g.font='22px serif';g.fillText(it.e,8+i*35,472);g.globalAlpha=1});
  g.fillStyle='#e2e8f0';g.font='12px system-ui';g.fillText('🪙'+coins+' · '+ITEMS[sel].n,10,508);
})();

</script>
</body></html>
