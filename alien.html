<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>دفاع الفضائيين — التفوق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh}
.top{width:100%;max-width:420px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a{color:#94a3b8;text-decoration:none;font-size:14px}
.top h1{font-size:17px;font-weight:800}
.hud{display:flex;gap:14px;font-size:14px;color:#cbd5e1}
canvas{width:min(360px,96vw);height:auto;border-radius:16px;background:#151b2e;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
.bot{width:100%;max-width:420px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.gold{background:linear-gradient(135deg,#E3A81C,#B45309);color:#1a1408}
.btn:active{transform:scale(.97)}
.hint{font-size:12px;color:#94a3b8;text-align:center;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:#1e293b;border-radius:20px;padding:22px;text-align:center;max-width:300px;width:100%}
.panel h2{margin-bottom:6px}
.panel p{color:#94a3b8;margin-bottom:14px}
</style>
</head>
<body>
<div class="top"><a href="./index.html">← المنصة</a><h1>👾 دفاع الفضائيين</h1><div class="hud"><span>⭐ <b id="sc">0</b></span><span>🏆 <b id="bs">0</b></span></div></div>
<canvas id="c" width="360" height="520"></canvas>
<div class="bot">
  <button class="btn gold" id="go">ابدأ</button>
  <div class="hint" id="hint">حرّك المدفع · اضغط للإطلاق</div>
</div>
<div class="ov" id="ov"><div class="panel"><h2 id="ot">انتهت</h2><p id="om"></p><button class="btn gold" id="again">العب تاني</button></div></div>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
let score=0,best=+(localStorage.getItem('aln_bs')||0),run=false,hp=100,aliens=[],bullets=[],t=0,mx=180,cool=0;
bsEl.textContent=best;
function end(){run=false;if(score>best){best=score;localStorage.setItem('aln_bs',best);bsEl.textContent=best}
  document.getElementById('ot').textContent='القاعدة سقطت';document.getElementById('om').textContent='نقاط: '+score;document.getElementById('ov').classList.add('on')}
function reset(){score=0;hp=100;aliens=[];bullets=[];t=0;cool=0;mx=180;run=true;scEl.textContent=0;document.getElementById('ov').classList.remove('on')}
document.getElementById('go').onclick=()=>{if(!run)reset();else if(cool<=0){bullets.push({x:mx,y:470});cool=10}};
document.getElementById('again').onclick=()=>{document.getElementById('ov').classList.remove('on');reset()};
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*360});
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(!run){reset();return}if(cool<=0){bullets.push({x:mx,y:470});cool=10}});
(function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#020617';g.fillRect(0,0,360,520);
  g.fillStyle='#166534';g.fillRect(0,500,360,20);g.fillStyle='#22c55e';g.fillRect(0,500,Math.max(0,hp)*3.6,20);
  if(run){t++;if(cool>0)cool--;if(t%32===0)aliens.push({x:25+Math.random()*310,y:10,s:1+Math.random()*1.2+t/2000});
    aliens.forEach(a=>a.y+=a.s);bullets.forEach(b=>b.y-=9);
    aliens.forEach(a=>{bullets.forEach(b=>{if(Math.abs(b.x-a.x)<20&&Math.abs(b.y-a.y)<18){a.y=999;b.y=-9;score+=12;scEl.textContent=score}})});
    aliens.forEach(a=>{if(a.y>495){hp-=12;a.y=999}});
    aliens=aliens.filter(a=>a.y<520);bullets=bullets.filter(b=>b.y>0);
    if(hp<=0)end();
    document.getElementById('hint').textContent='HP '+Math.max(0,Math.floor(hp))}
  g.fillStyle='#818cf8';g.fillRect(mx-22,478,44,18);
  g.fillStyle='#fbbf24';bullets.forEach(b=>g.fillRect(b.x-2,b.y,4,11));
  g.font='22px serif';aliens.forEach(a=>g.fillText('👾',a.x-12,a.y));
})();

</script>
</body></html>
