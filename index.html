<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التفوق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F2;--card:#fff;--ink:#12302D;--mut:#5B726F;--pri:#0B5D57;--pri2:#084a45;--onpri:#fff;--gold:#E3A81C;--ind:#4F46E5;--line:#D5E0DE;--sel:#e3efed;--ok:#157F3B;--bad:#B42318;--gbg:#dcf3e3;--rbg:#fde8e6;--ybg:#fff3cf;--yfg:#7a5700;--sh:0 1px 2px rgba(16,48,45,.06),0 10px 28px rgba(16,48,45,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1716;--card:#142624;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--ind:#8B93FF;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a;--sh:0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0C1716;--card:#142624;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--ind:#8B93FF;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a;--sh:0 10px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%;transition:background-color .35s,color .35s}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.4;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
.bgfx i:nth-child(1){background:radial-gradient(circle,color-mix(in srgb,var(--pri) 38%,transparent),transparent 66%);top:-22vmax;inset-inline-end:-18vmax}
.bgfx i:nth-child(2){background:radial-gradient(circle,color-mix(in srgb,var(--ind) 30%,transparent),transparent 66%);bottom:-28vmax;inset-inline-start:-22vmax;animation-duration:38s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 100px}
.wrap.wide{max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.logo{font-family:'Reem Kufi',sans-serif;font-size:30px;font-weight:700;color:var(--pri);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:9px;user-select:none;-webkit-user-select:none;transition:color .35s}
.tg{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;box-shadow:var(--sh);transition:transform .5s cubic-bezier(.3,1.4,.5,1),background-color .35s,border-color .35s}
.tg.spin{transform:rotate(360deg)}
h1,h2,h3{margin:0 0 8px;line-height:1.4}h2{font-size:20px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);transition:background-color .35s,border-color .25s,transform .25s}
@media (hover:hover){.card.lift:hover{transform:translateY(-5px);border-color:var(--pri)}}
.btn,.subj,.tab{position:relative;overflow:hidden}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:var(--onpri);cursor:pointer;min-height:44px;transition:transform .15s,background-color .2s,box-shadow .25s}
.btn:hover{background:var(--pri2);box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 40%,transparent)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.ghost:hover{background:var(--sel);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:#2b2000}.btn.gold:hover{background:var(--gold);filter:brightness(1.06);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 50%,transparent)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:0;pointer-events:none;animation:rip .55s ease-out}
@keyframes rip{from{transform:scale(0);opacity:.28}to{transform:scale(4);opacity:0}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=datetime-local],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
input.ltr{direction:ltr;text-align:right}
textarea{min-height:320px;line-height:1.8;font-size:15px}
.err{background:var(--rbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.warnbar{display:none;background:var(--rbg);color:var(--bad);border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:600;animation:shake .45s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);transition:background-color .2s,color .2s}
.tab.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.badge{display:inline-block;background:var(--gold);color:#2b2000;border-radius:99px;padding:0 8px;font-size:13px;margin-inline-start:6px;animation:bp 1.8s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.18)}}
.screen{animation:enter .34s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash{display:grid;place-items:center;min-height:80vh;text-align:center}
.splash .logo{font-size:60px;text-decoration:none;display:inline-block;animation:enter .6s ease-out both}
.uline{display:block;height:5px;border-radius:5px;background:var(--gold);width:0;margin:6px auto 0;animation:uline 1s .2s ease-out forwards}
@keyframes uline{to{width:100%}}
.sk{border-radius:14px;min-height:128px;background:linear-gradient(90deg,var(--line),var(--sel),var(--line));background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{border:0;border-radius:20px;padding:16px 14px;color:#fff;text-align:start;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-height:136px;box-shadow:var(--sh);transition:transform .2s,box-shadow .25s}
.subj:active{transform:scale(.95)}
@media (hover:hover){.subj:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.25)}}
.screen .subj{animation:tile .5s cubic-bezier(.3,1.3,.5,1) both}
.screen .subj:nth-child(2){animation-delay:.06s}.screen .subj:nth-child(3){animation-delay:.12s}.screen .subj:nth-child(4){animation-delay:.18s}.screen .subj:nth-child(5){animation-delay:.24s}.screen .subj:nth-child(6){animation-delay:.3s}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}
.subj .g{font-size:36px;font-weight:700;line-height:1.2;direction:ltr;text-align:right;text-shadow:0 3px 8px rgba(0,0,0,.25)}
.subj b{font-size:19px}.subj small{opacity:.95}
.sp{height:6px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:auto;overflow:hidden}
.sp i{display:block;height:100%;width:var(--w);background:#fff;border-radius:99px;animation:grow .9s ease-out .3s both}
@keyframes grow{from{width:0}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sel);color:var(--pri)}
.pill.g{background:var(--gbg);color:var(--ok)}.pill.r{background:var(--rbg);color:var(--bad)}.pill.y{background:var(--ybg);color:var(--yfg)}.pill.i{background:color-mix(in srgb,var(--ind) 18%,transparent);color:var(--ind)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:background-color .35s}
.q.in{animation:qin .42s ease-out both;animation-delay:calc(var(--i)*45ms)}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.q .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:14px;font-weight:600;margin-inline-end:8px}
.q p{margin:0 0 10px;font-weight:500;white-space:pre-wrap}
.opt{display:block;position:relative;margin-top:8px}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
@media (hover:hover){label.opt:hover span{border-color:var(--pri)}}
.opt input:checked+span{border-color:var(--pri);background:var(--sel);font-weight:600;animation:pop .32s ease-out}
.opt input:focus-visible+span{outline:3px solid var(--gold)}
@keyframes pop{50%{transform:scale(1.035)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
div.opt span{cursor:default}
div.opt.right span{border-color:var(--ok);background:var(--gbg)}
div.opt.wrong span{border-color:var(--bad);background:var(--rbg);animation:shake .45s}
.tk{display:inline-block;animation:tkp .5s cubic-bezier(.3,1.7,.5,1) both}.tk.x{color:var(--bad)}.tk:not(.x){color:var(--ok)}
@keyframes tkp{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.timer{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--onpri);border-radius:12px;padding:8px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:600;box-shadow:var(--sh)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ind));border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--gold);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi',sans-serif;font-size:34px;color:var(--pri)}
.stars span{display:inline-block;font-size:34px;color:var(--gold);animation:tkp .6s cubic-bezier(.3,1.7,.5,1) both}
.stars span.off{color:var(--line)}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--sel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:26px;color:var(--pri);line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:5px;height:160px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);min-width:0}
.bars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pri),var(--ind));min-height:3px;animation:rise .7s cubic-bezier(.3,1,.4,1) both;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0)}}
.bars i.f{background:var(--mut)}
.hb{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.hb i{display:block;height:100%;border-radius:99px;animation:grow .9s ease-out both}
.center{text-align:center;padding-top:60px}
.big{font-family:'Reem Kufi',sans-serif;font-size:56px;color:var(--pri);line-height:1.2}
.ann{background:linear-gradient(135deg,color-mix(in srgb,var(--ind) 16%,var(--card)),color-mix(in srgb,var(--gold) 18%,var(--card)));border-color:var(--gold)}
.fab{position:fixed;inset-inline-start:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#2b2000;font-size:30px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:20;transition:transform .2s}
.fab:active{transform:scale(.9)}
nav.bot{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:9}
nav.bot button{font:inherit;font-weight:600;flex:1;max-width:180px;border:0;border-radius:12px;padding:9px 6px;background:transparent;color:var(--mut);cursor:pointer;transition:background-color .2s,color .2s}
nav.bot button.on{background:var(--sel);color:var(--pri)}
#toast{position:fixed;inset-inline:12px;bottom:78px;max-width:460px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transform:translateY(24px) scale(.97);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1)}
#toast.show{opacity:1;transform:none}
#toast.gold{background:var(--gold);color:#2b2000;font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.uline{width:100%}}
</style>
</head>
<body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ إعدادات Firebase ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCo99zGbGOJSw1p-rdy3bk9PSxzsINWkxQ",
  authDomain: "eltafawoq-8b700.firebaseapp.com",
  projectId: "eltafawoq-8b700",
  storageBucket: "eltafawoq-8b700.firebasestorage.app",
  messagingSenderId: "892405720236",
  appId: "1:892405720236:web:734c19429b8ee8e292eb09"
};
/* ========================================== */

const ADMIN_EMAIL = "01061572071@eltafawoq.app";   // لازم يطابق الإيميل في Firebase وفي ملف الـ rules
const DOMAIN = "@eltafawoq.app";
const MAX_ATTEMPTS = 2;
const SUBJECTS = [
  {id:"arabic",name:"عربي",g:"أ ب",c:"#B91C1C",c2:"#C2410C"},
  {id:"science",name:"علوم",g:"H₂O",c:"#155E75",c2:"#0E7490"},
  {id:"history",name:"تاريخ",g:"م",c:"#92400E",c2:"#B45309"},
  {id:"english",name:"إنجليزي",g:"Aa",c:"#1D4ED8",c2:"#4338CA"},
  {id:"philosophy",name:"فلسفة",g:"؟",c:"#6D28D9",c2:"#86198F"},
  {id:"math",name:"رياضيات",g:"π",c:"#166534",c2:"#15803D"}
];
const subName = id => (SUBJECTS.find(s=>s.id===id)||{name:id}).name;
const subColor = id => (SUBJECTS.find(s=>s.id===id)||{c:"#0B5D57"}).c;

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dur = s => s==null?"-":Math.floor(s/60)+":"+pad(s%60);
const pctOf = r => r.total?Math.round(r.score/r.total*100):0;
const gcount = e => e.questions.filter(q=>!q.fun).length;
const norm = s => String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g,"");
const fmt = ts => ts&&ts.toDate ? ts.toDate().toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}) : "";
const tms = r => r.createdAt&&r.createdAt.seconds?r.createdAt.seconds:0;
const pill = (t,c) => `<span class="pill ${c||""}">${t}</span>`;
const passPill = r => r.passMark>0 ? (r.passed?pill("ناجح","g"):pill("راسب","r")) : "";

const S = {starts:[],examsLoaded:false,user:null,isAdmin:false,profile:null,site:{maintenance:false,message:""},exams:[],results:[],students:[],alerts:[],
  myList:[],attempts:{},view:"loading",tab:"dash",subject:null,cur:null,last:null,review:null,studentId:null,editing:null,
  adminLogin:false,mode:"login",error:"",filter:"",unread:0,unreadAlerts:0,registering:false,taps:[]};
const splashUntil=Date.now()+1100;
const vis=e=>!e.publishAt||Date.now()>=e.publishAt;
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const dkey=sec=>{const d=new Date(sec*1000);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const lastDays=n=>{const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push({k:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),l:d.getDate()})}return a};
const device=()=>{const u=navigator.userAgent;const os=/Android/i.test(u)?"Android":/iPhone|iPad|iPod/i.test(u)?"iOS":/Windows/i.test(u)?"Windows":/Mac/i.test(u)?"Mac":/Linux/i.test(u)?"Linux":"?";const br=/Edg\//.test(u)?"Edge":/OPR\//.test(u)?"Opera":/SamsungBrowser/.test(u)?"Samsung":/Chrome\//.test(u)?"Chrome":/Firefox\//.test(u)?"Firefox":/Safari\//.test(u)?"Safari":"?";return os+" · "+br+(/FB_IAB|FBAN|FBAV|Messenger/i.test(u)?" (داخل فيسبوك)":"")};
let myIp=null;
async function getIp(){if(myIp!==null)return myIp;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),4000);const r=await fetch("https://api.ipify.org?format=json",{signal:c.signal});clearTimeout(t);myIp=(await r.json()).ip||""}catch(e){myIp=""}return myIp}
let subs=[],timer=null,hb=null,ansT=null,db,auth,lastLeave=0;

const configured = !firebaseConfig.apiKey.startsWith("PASTE");
if(configured){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}

/* ---------- أدوات ---------- */
function toast(msg,gold){const t=$("#toast");t.textContent=msg;t.className=(gold?"gold ":"")+"show";clearTimeout(toast.h);toast.h=setTimeout(()=>t.className=gold?"gold":"",gold?7000:3500)}
function updTitle(){const n=S.unread+S.unreadAlerts;document.title=(n?`(${n}) `:"")+"التفوق"}
function authErr(e){
  const c=e&&e.code||"";
  if(c.includes("email-already-in-use")) return "الرقم ده مسجل قبل كده. سجّل دخول بدل إنشاء حساب.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")||c.includes("invalid-email")) return "الرقم أو كلمة السر غلط.";
  if(c.includes("weak-password")) return "كلمة السر لازم تبقى 6 حروف أو أرقام على الأقل.";
  if(c.includes("network")) return "مفيش اتصال بالإنترنت. جرّب تاني.";
  if(c.includes("too-many")) return "محاولات كتير. استنى شوية وجرّب تاني.";
  return "حصلت مشكلة. جرّب تاني.";
}
function stopSubs(){subs.forEach(u=>u());subs=[]}

/* ---------- تحويل نص الأسئلة ---------- */
const LET={"أ":0,"ا":0,"a":0,"1":0,"ب":1,"b":1,"2":1,"ج":2,"c":2,"3":2,"د":3,"d":3,"4":3};
const LETTERS=["أ","ب","ج","د"];
function parseQs(t){
  const qs=[],errors=[];
  t.replace(/\r/g,"").trim().split(/\n\s*\n/).filter(b=>b.trim()).forEach((blk,i)=>{
    const lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    const q=[],o=[];let a,fun=false;
    for(const l of lines){
      if(/^\[(?:ترفيه|fun)\]$/i.test(l)){fun=true;continue}
      let m=l.match(/^(?:الإجابة|الاجابة|الجواب|answer|ans)\s*[:：\-]\s*(.+)$/i);
      if(m){a=LET[m[1].trim().toLowerCase().charAt(0)];continue}
      m=l.match(/^([أابجدa-dA-D1-4])\s*[\)\.\-–]\s*(.+)$/);
      if(m&&LET[m[1].toLowerCase()]===o.length){o.push(m[2].trim());continue}
      if(!o.length)q.push(l);else errors.push(`سؤال ${i+1}: سطر مش مفهوم: "${l}"`);
    }
    if(!q.length)errors.push(`سؤال ${i+1}: نص السؤال ناقص`);
    else if(o.length<2||o.length>4)errors.push(`سؤال ${i+1}: لازم من 2 إلى 4 اختيارات (أ ب ج د)`);
    else if(a===undefined||a>=o.length)errors.push(`سؤال ${i+1}: سطر "الإجابة: ب" ناقص أو غلط`);
    else qs.push(fun?{q:q.join("\n"),o,a,fun:true}:{q:q.join("\n"),o,a});
  });
  return {qs,errors};
}
const serialize = qs => qs.map(x=>x.q+"\n"+x.o.map((t,i)=>`${LETTERS[i]}) ${t}`).join("\n")+`\nالإجابة: ${LETTERS[x.a]}`+(x.fun?"\n[ترفيه]":"")).join("\n\n");

/* ---------- ترتيب عشوائي ثابت لكل محاولة ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(e,seed){
  const rnd=mulberry(seed),on=e.shuffle!==false;
  const idx=e.questions.map((_,i)=>i);
  const g=idx.filter(i=>!e.questions[i].fun),f=idx.filter(i=>e.questions[i].fun);
  return (on?shuf(g,rnd):g).concat(f).map(i=>({i,o:on?shuf(e.questions[i].o.map((_,j)=>j),rnd):e.questions[i].o.map((_,j)=>j)}));
}

/* ---------- إحصائيات الأدمن ---------- */
function stats(){
  const R=S.results.filter(r=>r.total>0);
  const avg=a=>a.length?Math.round(a.reduce((s,r)=>s+pctOf(r),0)/a.length):0;
  const wp=R.filter(r=>r.passMark>0);
  const per=S.exams.map(e=>{const rs=R.filter(r=>r.examId===e.id),w=rs.filter(r=>r.passMark>0);
    const ts=rs.filter(r=>r.secs>0);
    return {e,n:rs.length,avg:avg(rs),secs:ts.length?Math.round(ts.reduce((a,r)=>a+r.secs,0)/ts.length):null,pass:w.length?Math.round(w.filter(r=>r.passed).length/w.length*100):null}});
  const qm={};
  R.forEach(r=>{const e=S.exams.find(x=>x.id===r.examId);if(!e||!r.ans)return;
    e.questions.forEach((q,i)=>{if(q.fun)return;const k=e.id+"#"+i;const m=qm[k]||(qm[k]={q:q.q,exam:e.title,n:0,c:0});m.n++;if(r.ans[i]===q.a)m.c++})});
  const ql=Object.values(qm).filter(m=>m.n>=3).map(m=>({...m,p:Math.round(m.c/m.n*100)})).sort((a,b)=>a.p-b.p);
  return {R,avg:avg(R),passRate:wp.length?Math.round(wp.filter(r=>r.passed).length/wp.length*100):null,per,hard:ql.slice(0,3),easy:ql.slice(-3).reverse()};
}

function board(){
  const by={};S.results.forEach(r=>{(by[r.uid]=by[r.uid]||{uid:r.uid,name:r.name,rs:[]}).rs.push(r)});
  const L=Object.values(by).map(x=>{const good=x.rs.filter(r=>pctOf(r)>=50&&r.secs>0);
    return {uid:x.uid,name:x.name,n:x.rs.length,avg:Math.round(x.rs.reduce((a,r)=>a+pctOf(r),0)/x.rs.length),fast:good.length?Math.round(good.reduce((a,r)=>a+r.secs,0)/good.length):null}});
  return {top:L.slice().sort((a,b)=>b.avg-a.avg||b.n-a.n).slice(0,10),act:L.slice().sort((a,b)=>b.n-a.n).slice(0,5),fast:L.filter(x=>x.fast!=null).sort((a,b)=>a.fast-b.fast).slice(0,3)};
}

function groupAttempts(list){
  const m={};list.forEach(r=>{(m[r.examId]=m[r.examId]||[]).push(r)});
  Object.values(m).forEach(a=>a.sort((x,y)=>(x.attempt||1)-(y.attempt||1)));
  return m;
}
async function startSession(u){
  stopSubs();
  S.user=u;S.isAdmin=u.email===ADMIN_EMAIL;S.adminLogin=false;S.error="";
  try{
    if(S.isAdmin){
      S.view="admin";S.tab="dash";
      let f1=true,f2=true,f3=true;
      subs.push(onSnapshot(collection(db,"exams"),s=>{S.exams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"results"),orderBy("createdAt","desc")),s=>{
        if(!f1)s.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().createdAt){const r=c.doc.data();toast(`${r.name} امتحن ${r.examTitle} (محاولة ${r.attempt||1}) وجاب ${r.score}/${r.total}`,true);if(S.tab!=="results"){S.unread++;updTitle()}}});
        f1=false;S.results=s.docs.map(d=>({id:d.id,...d.data()}));render();
      }));
      subs.push(onSnapshot(collection(db,"students"),s=>{S.students=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"alerts"),orderBy("createdAt","desc"),limit(200)),s=>{
        if(!f2)s.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().createdAt){const a=c.doc.data();toast(`⚠ ${a.name} (${a.phone}) خرج من الامتحان: ${a.examTitle}`,true);if(S.tab!=="alerts"){S.unreadAlerts++;updTitle()}}});
        f2=false;S.alerts=s.docs.map(d=>({id:d.id,...d.data()}));render();
      }));
      subs.push(onSnapshot(collection(db,"starts"),s=>{
        if(!f3)s.docChanges().forEach(c=>{if(c.type==="added"){const a=c.doc.data();toast(`🟢 ${a.name||"طالب"} بدأ امتحان ${a.examTitle||""}`,true)}});
        f3=false;S.starts=s.docs.map(d=>({id:d.id,...d.data()}));render();
      }));
      const iv=setInterval(()=>{if(S.view==="admin"&&S.tab==="live")render()},20000);subs.push(()=>clearInterval(iv));
    }else{
      const p=await getDoc(doc(db,"students",u.uid));
      S.profile=p.exists()?p.data():{name:"طالب",phone:""};
      S.view="home";S.examsLoaded=false;
      subs.push(onSnapshot(doc(db,"students",u.uid),s=>{if(s.exists()){S.profile=s.data();render()}}));
      getIp().then(ip=>updateDoc(doc(db,"students",u.uid),{lastLogin:serverTimestamp(),ip:ip||"",device:device()}).catch(()=>{}));
      const iv2=setInterval(()=>{if(S.user&&!S.isAdmin&&(S.view==="home"||S.view==="subject"))render()},60000);subs.push(()=>clearInterval(iv2));
      subs.push(onSnapshot(collection(db,"exams"),s=>{S.examsLoaded=true;S.exams=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.published).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"results"),where("uid","==",u.uid)),s=>{
        S.myList=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(a)-tms(b));S.attempts=groupAttempts(S.myList);render();
      }));
    }
  }catch(e){S.site={maintenance:true,message:"في مشكلة مؤقتة في التحميل. جرّب بعد شوية."}}
  render(true);
}

if(configured){

const app=$("#app");
function render(force){
  if(!force&&(S.view==="exam"||S.view==="editExam"))return;
  if(S.view!=="exam"){clearInterval(timer);clearInterval(hb)}
  let h;
  if(S.view==="loading")h=splash();
  else if(S.site.maintenance&&!S.isAdmin&&!S.adminLogin)h=maintenance();
  else if(!S.user)h=authView();
  else if(S.isAdmin){
    h=S.view==="editExam"?editor():S.view==="studentDetail"?studentDetail():S.view==="review"?reviewView():adminView();
  }else if(S.profile&&S.profile.blocked){h=blockedView()}
  else{
    const m={subject:subjectView,exam:examView,result:resultView,review:reviewView,progress:progressView};
    h=(m[S.view]||homeView)();
  }
  app.innerHTML=h;
  if(force&&app.firstElementChild)app.firstElementChild.classList.add("screen");
  if(S.view==="result"&&!S.isAdmin&&S.user)runResult();
  if(S.view==="editExam")bindEditor();
}

<div class="row" style="margin-top:14px"><button class="btn ${S.site.maintenance?"gold":"danger"}" data-act="toggleMaint">${S.site.maintenance?"إيقاف وضع الصيانة":"تشغيل وضع الصيانة"}</button><button class="btn ghost" data-act="saveMsg">حفظ الرسالة بس</button></div></div>
<div class="card"><h3>📢 إعلان للطلاب</h3>
<p class="mut">بيظهر في الصفحة الرئيسية للطالب أول ما يدخل. مناسب لمواعيد الامتحانات والتنبيهات.</p>
<textarea id="ann" style="min-height:90px" placeholder="مثال: امتحان الفلسفة يوم الخميس الساعة 5">${esc(S.site.announce||"")}</textarea>
<div class="row" style="margin-top:14px"><button class="btn" data-act="saveAnn" data-on="1">نشر الإعلان</button><button class="btn ghost" data-act="saveAnn" data-on="0">إخفاء الإعلان</button></div>
<div class="mut" style="margin-top:6px">${S.site.announceOn&&S.site.announce?"الإعلان ظاهر دلوقتي.":"مفيش إعلان ظاهر."}</div></div>`}
function editor(){
  const e=S.editing.exam||{subject:"arabic",title:"",minutes:30,passMark:0,shuffle:true,published:true,showAnswers:true,questions:[]};
  const has=S.editing.id&&S.results.some(r=>r.examId===S.editing.id);
  return `<div class="wrap wide">${header(`<button class="btn ghost sm" data-act="cancelEdit">إلغاء</button>`)}
<form class="card" data-submit="saveExam"><h2>${S.editing.id?"تعديل الامتحان":"امتحان جديد"}</h2>
${has?`<div class="err" style="margin:0 0 8px">الامتحان ده فيه محاولات سابقة. لو غيّرت الأسئلة أو ترتيب الاختيارات، مراجعة الطلاب القديمة هتبقى غلط. تغيير العنوان والمدة آمن.</div>`:""}
<label class="f" for="esub">المادة</label><select id="esub">${SUBJECTS.map(s=>`<option value="${s.id}" ${e.subject===s.id?"selected":""}>${s.name}</option>`).join("")}</select>
<label class="f" for="etitle">اسم الامتحان</label><input id="etitle" type="text" value="${esc(e.title)}" placeholder="مثال: امتحان الوحدة الأولى" required>
<label class="f" for="emin">المدة بالدقايق (0 = من غير وقت)</label><input id="emin" type="number" min="0" value="${e.minutes}">
<label class="f" for="epass">درجة النجاح: عدد الإجابات الصح المطلوبة (0 = بدون)</label><input id="epass" type="number" min="0" value="${e.passMark||0}">
<label class="f" for="eat">نشر تلقائي في موعد (اختياري)</label><input id="eat" type="datetime-local" value="${e.publishAt?new Date(e.publishAt-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):""}">
<label class="f"><input id="eshuf" type="checkbox" ${e.shuffle!==false?"checked":""}> ترتيب عشوائي للأسئلة والاختيارات لكل طالب</label>
<label class="f" style="margin-top:4px"><input id="epub" type="checkbox" ${e.published?"checked":""}> يظهر للطلاب</label>
<label class="f" style="margin-top:4px"><input id="eshow" type="checkbox" ${e.showAnswers!==false?"checked":""}> يشوف الطالب الإجابات الصحيحة بعد التسليم</label>
<label class="f" for="qtext">الأسئلة</label>
<p class="mut" style="margin:0 0 6px">اكتب كل سؤال وتحته الاختيارات (أ ب ج د) وبعدين سطر "الإجابة: ب". سيب سطر فاضي بين كل سؤال والتاني. لو سؤال للتسلية (مش في الدرجة) ضيف تحته سطر <b>[ترفيه]</b>. لو استخدمت الترتيب العشوائي متكتبش اختيارات زي "كل ما سبق".</p>
<textarea id="qtext" dir="auto">${esc(serialize(e.questions))}</textarea>
<div id="qinfo" class="mut" style="margin:6px 0"></div>
<div class="row" style="margin-top:12px"><button class="btn" id="sv">حفظ الامتحان</button><button type="button" class="btn ghost" data-act="sample">حط مثال</button></div></form></div>`}

/* ---------- الأفعال ---------- */
const A={
  theme(d,el){const t=isDark()?"light":"dark";document.querySelectorAll(".tg").forEach(b=>{b.classList.add("spin");setTimeout(()=>b.classList.remove("spin"),500)});setTheme(t)},
  mode(){S.mode=S.mode==="login"?"register":"login";S.error="";render(true)},
  logoTap(){const n=Date.now();S.taps=S.taps.filter(t=>n-t<2500);S.taps.push(n);if(S.taps.length>=3){S.taps=[];S.adminLogin=true;S.error="";render(true)}},
  studentLink(){S.adminLogin=false;S.error="";render(true)},
  async logout(){await signOut(auth)},
  home(){S.view="home";render(true)},
  progress(){S.view="progress";render(true)},
  openSubject(d){S.subject=d.id;S.view="subject";render(true)},
  reviewMine(d){const r=S.myList.find(x=>x.id===d.id);if(!r)return;S.review={r,back:d.back||"subject"};S.view="review";render(true)},
  reviewLast(){S.review={r:S.last,back:"result"};S.view="review";render(true)},
  reviewAdmin(d){const r=S.results.find(x=>x.id===d.id);if(!r)return;S.review={r,back:d.back||"admin"};S.view="review";render(true)},
  backReview(){S.view=S.review.back;render(true)},
  student(d){S.studentId=d.id;S.view="studentDetail";render(true)},
  backAdmin(){S.view="admin";render(true)},
  async start(d){
    const e=S.exams.find(x=>x.id===d.id),at=S.attempts[d.id]||[];
    if(!e||!vis(e))return;
    if(S.profile&&S.profile.blocked){toast("حسابك موقوف");return}
    if(at.length>=MAX_ATTEMPTS){toast("خلصت محاولاتك على الامتحان ده");return}
    const n=at.length+1,sid=`${S.user.uid}_${e.id}_${n}`;
    let st;
    try{
      const g=await getDoc(doc(db,"starts",sid));
      if(g.exists())st=g.data();
      else{st={uid:S.user.uid,examId:e.id,n,t:Date.now(),seed:Math.floor(Math.random()*2147483647),name:S.profile.name,phone:S.profile.phone,examTitle:e.title,total:gcount(e),answered:0,away:false,seen:Date.now(),device:device(),ip:myIp||""};await setDoc(doc(db,"starts",sid),st)}
    }catch(err){toast("مقدرتش أبدأ الامتحان. اتأكد من النت وجرّب تاني.");return}
    const endAt=e.minutes?st.t+e.minutes*60000:0;
    S.cur={exam:e,n,sid,st,endAt,done:false,busy:false,away:false,tabs:0,answered:0,order:buildOrder(e,st.seed)};
    S.view="exam";render(true);
    clearInterval(timer);clearInterval(hb);
    hb=setInterval(()=>liveUpdate({answered:S.cur?S.cur.answered:0,away:S.cur?S.cur.away:false}),60000);
    liveUpdate({away:false});
    if(endAt){tick();timer=setInterval(tick,1000)}
    if(endAt&&Date.now()>=endAt){toast("وقت الامتحان كان خلص.");submitExam(true)}
  },
  submit(){submitExam(false)},
  tab(d){S.tab=d.id;if(d.id==="results")S.unread=0;if(d.id==="alerts")S.unreadAlerts=0;updTitle();render(true)},
  filter(d,el){S.filter=el.value;render()},
  newExam(){S.editing={id:null,exam:null};S.view="editExam";render(true)},
  editExam(d){S.editing={id:d.id,exam:S.exams.find(e=>e.id===d.id)};S.view="editExam";render(true)},
  cancelEdit(){S.view="admin";render(true)},
  sample(){$("#qtext").value=SAMPLE;checkQs()},
  async saveExam(){
    const {qs,errors}=parseQs($("#qtext").value);
    if(errors.length||!qs.length){toast(errors[0]||"اكتب سؤال واحد على الأقل");return}
    const at=$("#eat").value?new Date($("#eat").value).getTime():null;
    const data={subject:$("#esub").value,title:$("#etitle").value.trim(),publishAt:at,minutes:Math.max(0,+$("#emin").value||0),passMark:Math.max(0,+$("#epass").value||0),shuffle:$("#eshuf").checked,published:$("#epub").checked,showAnswers:$("#eshow").checked,questions:qs};
    if(!data.title){toast("اكتب اسم الامتحان");return}
    if(data.passMark>qs.filter(q=>!q.fun).length){toast("درجة النجاح أكبر من عدد الأسئلة");return}
    $("#sv").disabled=true;
    try{
      if(S.editing.id)await updateDoc(doc(db,"exams",S.editing.id),data);
      else await addDoc(collection(db,"exams"),{...data,createdAt:serverTimestamp()});
      S.view="admin";S.tab="exams";render(true);toast("اتحفظ الامتحان");
    }catch(e){$("#sv").disabled=false;toast("مقدرتش أحفظ. اتأكد من الاتصال والـ rules.")}
  },
  async togglePub(d){const e=S.exams.find(x=>x.id===d.id);await updateDoc(doc(db,"exams",d.id),{published:!e.published})},
  async delExam(d){if(confirm("تمسح الامتحان ده؟ مش هتقدر ترجعه."))await deleteDoc(doc(db,"exams",d.id))},
  async delResult(d){if(confirm("تمسح المحاولة دي؟ الطالب هيرجعله محاولة."))await deleteDoc(doc(db,"results",d.id))},
  csv(){
    const rows=S.results.filter(r=>!S.filter||r.examId===S.filter);
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const csv="\ufeff"+["الاسم,التليفون,المادة,الامتحان,المحاولة,الدرجة,من,النتيجة,الوقت بالثواني,مرات الخروج,التاريخ",
      ...rows.map(r=>[r.name,r.phone,subName(r.subject),r.examTitle,r.attempt||1,r.score,r.total,r.passMark>0?(r.passed?"ناجح":"راسب"):"",r.secs??"",r.tabs||0,fmt(r.createdAt)].map(q).join(","))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="results.csv";a.click();
  },
  async toggleMaint(){
    const on=!S.site.maintenance;
    if(on&&!confirm("تشغّل وضع الصيانة؟ الطلاب مش هيقدروا يدخلوا."))return;
    try{await setDoc(doc(db,"config","site"),{maintenance:on,message:$("#mmsg").value.trim()},{merge:true});toast(on?"وضع الصيانة شغّال":"المنصة رجعت للطلاب")}catch(e){toast("مقدرتش أحفظ")}
  },
  async saveMsg(){try{await setDoc(doc(db,"config","site"),{message:$("#mmsg").value.trim()},{merge:true});toast("اتحفظت الرسالة")}catch(e){toast("مقدرتش أحفظ")}},
  async saveAnn(d){try{await setDoc(doc(db,"config","site"),{announce:$("#ann").value.trim(),announceOn:d.on==="1"&&!!$("#ann").value.trim()},{merge:true});toast(d.on==="1"?"اتنشر الإعلان":"اتخفى الإعلان")}catch(e){toast("مقدرتش أحفظ")}},
  async dupExam(d){const e=S.exams.find(x=>x.id===d.id);if(!e)return;const {id,createdAt,...rest}=e;try{await addDoc(collection(db,"exams"),{...rest,title:e.title+" (نسخة)",published:false,createdAt:serverTimestamp()});toast("اتعملت نسخة مخفية")}catch(err){toast("مقدرتش أنسخ")}},
  async block(d){if(confirm("تحظر الطالب ده؟ مش هيقدر يمتحن."))try{await updateDoc(doc(db,"students",d.id),{blocked:true});toast("اتحظر")}catch(e){toast("مقدرتش أحظر")}},
  async unblock(d){try{await updateDoc(doc(db,"students",d.id),{blocked:false});toast("اتفك الحظر")}catch(e){toast("مقدرتش")}},
  async doLogin(){
    if(!configured){S.error="المنصة تحت التعديل.";render(true);return}
    const idv=norm($("#id").value),pw=$("#pw").value;
    $("#go").disabled=true;S.error="";
    try{await signInWithEmailAndPassword(auth,idv+DOMAIN,pw)}catch(e){S.error=authErr(e);render(true)}
  },
  async doRegister(){
    if(!configured){S.error="المنصة تحت التعديل.";render(true);return}
    const name=$("#nm").value.trim().replace(/\s+/g," "),phone=norm($("#id").value),pw=$("#pw").value;
    if(name.length<3)return fail("اكتب اسمك بالكامل.");
    if(!/^01[0-9]{9}$/.test(phone))return fail("رقم التليفون لازم يبقى 11 رقم ويبدأ بـ 01.");
    if(pw.length<6)return fail("كلمة السر لازم تبقى 6 حروف أو أرقام على الأقل.");
    $("#go").disabled=true;S.error="";S.registering=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,phone+DOMAIN,pw);
      try{await setDoc(doc(db,"students",c.user.uid),{name,phone,createdAt:serverTimestamp()})}catch(_){}
      S.registering=false;await startSession(c.user);
    }catch(e){S.registering=false;S.error=authErr(e);render(true)}
  }
};
function fail(m){S.error=m;render(true)}

/* ---------- الامتحان ---------- */
function tick(){
  const el=$("#timer");if(!el||!S.cur||!S.cur.endAt)return;
  const left=Math.max(0,Math.round((S.cur.endAt-Date.now())/1000));
  el.textContent=dur(left);
  if(left<=0){clearInterval(timer);submitExam(true)}
}
function updProg(){
  const c=S.cur;if(!c)return;
  const g=c.exam.questions.map((q,i)=>q.fun?null:i).filter(i=>i!==null);
  const done=g.filter(i=>document.querySelector(`input[name=q${i}]:checked`)).length;
  const el=$("#pg");if(el)el.style.width=(g.length?done/g.length*100:0)+"%";
  c.answered=done;clearTimeout(ansT);ansT=setTimeout(()=>liveUpdate({answered:done}),6000);
}
function liveUpdate(extra){
  const c=S.cur;if(!c||c.done)return;
  updateDoc(doc(db,"starts",c.sid),{seen:Date.now(),...extra}).catch(()=>{});
}
async function submitExam(auto){
  const c=S.cur;if(!c||c.done)return;
  const e=c.exam;
  const ans=e.questions.map((_,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});
  if(!auto&&ans.some((a,i)=>a===-1&&!e.questions[i].fun)){
    c.busy=true;const ok=confirm("في أسئلة لسه ما جاوبتش عليها. تسلّم برضه؟");setTimeout(()=>{c.busy=false},800);
    if(!ok)return;
  }
  c.done=true;clearInterval(timer);clearInterval(hb);clearTimeout(ansT);
  const score=ans.filter((a,i)=>!e.questions[i].fun&&a===e.questions[i].a).length,total=gcount(e);
  const btn=$("#sub");if(btn)btn.disabled=true;
  const rec={uid:S.user.uid,examId:e.id,examTitle:e.title,subject:e.subject,name:S.profile.name,phone:S.profile.phone,attempt:c.n,
    score,total,passMark:e.passMark||0,passed:e.passMark>0?score>=e.passMark:null,ans,secs:Math.round((Date.now()-c.st.t)/1000),tabs:c.tabs};
  try{
    await setDoc(doc(db,"results",c.sid),{...rec,createdAt:serverTimestamp()});
  }catch(err){c.done=false;if(btn)btn.disabled=false;toast("مقدرتش أسجّل النتيجة. اتأكد من النت ودوس تسليم تاني.");return}
  deleteDoc(doc(db,"starts",c.sid)).catch(()=>{});
  S.attempts[e.id]=(S.attempts[e.id]||[]).concat([{...rec,id:c.sid}]);
  S.last={...rec,id:c.sid};S.cur=null;S.view="result";render(true);
}
function runResult(){
  const r=S.last,fg=$("#fg"),sc=$("#sc");if(!fg||!sc)return;
  fg.style.strokeDashoffset=339.3;sc.textContent="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=339.3*(1-(r.total?r.score/r.total:0))}));
  const t0=performance.now();
  (function step(n){const p=Math.min(1,(n-t0)/1000);sc.textContent=Math.round(r.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
  if(pctOf(r)>=90&&!matchMedia("(prefers-reduced-motion: reduce)").matches)confetti();
}
function confetti(){
  const cols=["#E3A81C","#2FB5A8","#4F46E5","#ef4444","#22c55e","#f97316"];
  const w=document.createElement("div");w.className="conf";
  for(let i=0;i<46;i++){const p=document.createElement("i");p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${2.4+Math.random()*2}s;animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*360}deg)`;w.appendChild(p)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),5200);
}

/* ---------- كشف الخروج من الامتحان ---------- */
function leave(){
  const c=S.cur;if(S.view!=="exam"||!c||c.done||c.busy)return;
  const n=Date.now();if(n-lastLeave<1500)return;lastLeave=n;
  c.tabs++;c.away=true;liveUpdate({away:true,awayAt:Date.now()});
  const w=$("#warn");if(w){w.style.display="block";w.textContent=`⚠ تم تسجيل خروجك من الامتحان (${c.tabs}) وإبلاغ المدرس.`}
  if(c.tabs<=10)addDoc(collection(db,"alerts"),{uid:S.user.uid,name:S.profile.name,phone:S.profile.phone,examId:c.exam.id,examTitle:c.exam.title,attempt:c.n,count:c.tabs,createdAt:serverTimestamp()}).catch(()=>{});
}
function back(){const c=S.cur;if(S.view==="exam"&&c&&!c.done&&c.away){c.away=false;liveUpdate({away:false})}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)leave();else back()});
window.addEventListener("blur",leave);window.addEventListener("focus",back);

/* ---------- المحرر ---------- */
function checkQs(){
  const el=$("#qinfo");if(!el)return;
  const {qs,errors}=parseQs($("#qtext").value);
  const f=qs.filter(q=>q.fun).length;
  el.innerHTML=`${qs.length-f} سؤال سليم${f?` + ${f} للتسلية`:""}`+(errors.length?` <span style="color:var(--bad)">· ${esc(errors[0])}${errors.length>1?` (+${errors.length-1} أخطاء)`:""}</span>`:"");
}
function bindEditor(){const t=$("#qtext");if(t){t.addEventListener("input",checkQs);checkQs()}}

document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.subj,.tab");if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height),x=document.createElement("span");
  x.className="rip";x.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;
  b.appendChild(x);setTimeout(()=>x.remove(),600);
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;e.preventDefault();A[b.dataset.act]?.(b.dataset,b)});
document.addEventListener("change",e=>{
  const c=e.target.dataset&&e.target.dataset.change;if(c)A[c]?.(e.target.dataset,e.target);
  if(e.target.type==="radio"&&S.view==="exam"){updProg();if(navigator.vibrate)navigator.vibrate(8)}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.submit;if(f)A[f]?.()});

if(!configured)render(true);
</script>
