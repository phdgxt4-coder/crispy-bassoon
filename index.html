<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B5D57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التفوق">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>التفوق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F2;--card:#fff;--ink:#12302D;--mut:#5B726F;--pri:#0B5D57;--pri2:#084a45;--onpri:#fff;--gold:#E3A81C;--ind:#4F46E5;--line:#D5E0DE;--sel:#e3efed;--ok:#157F3B;--bad:#B42318;--gbg:#dcf3e3;--rbg:#fde8e6;--ybg:#fff3cf;--yfg:#7a5700;--sh:0 1px 2px rgba(16,48,45,.06),0 10px 28px rgba(16,48,45,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1716;--card:#142624;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--ind:#8B93FF;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a;--sh:0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0C1716;--card:#142624;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--ind:#8B93FF;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a;--sh:0 10px 28px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%;transition:background-color .35s,color .35s}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.4;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
.bgfx i:nth-child(1){background:radial-gradient(circle,color-mix(in srgb,var(--pri) 38%,transparent),transparent 66%);top:-22vmax;inset-inline-end:-18vmax}
.bgfx i:nth-child(2){background:radial-gradient(circle,color-mix(in srgb,var(--ind) 30%,transparent),transparent 66%);bottom:-28vmax;inset-inline-start:-22vmax;animation-duration:38s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 100px}
.wrap.wide{max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.logo{font-family:'Reem Kufi',sans-serif;font-size:30px;font-weight:700;color:var(--pri);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:9px;user-select:none;-webkit-user-select:none;transition:color .35s}
.tg{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;box-shadow:var(--sh);transition:transform .5s cubic-bezier(.3,1.4,.5,1),background-color .35s,border-color .35s}
.tg.spin{transform:rotate(360deg)}
h1,h2,h3{margin:0 0 8px;line-height:1.4}h2{font-size:20px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);transition:background-color .35s,border-color .25s,transform .25s}
@media (hover:hover){.card.lift:hover{transform:translateY(-5px);border-color:var(--pri)}}
.btn,.subj,.tab{position:relative;overflow:hidden}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:var(--onpri);cursor:pointer;min-height:44px;transition:transform .15s,background-color .2s,box-shadow .25s}
.btn:hover{background:var(--pri2);box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 40%,transparent)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.ghost:hover{background:var(--sel);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:#2b2000}.btn.gold:hover{background:var(--gold);filter:brightness(1.06);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 50%,transparent)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:0;pointer-events:none;animation:rip .55s ease-out}
@keyframes rip{from{transform:scale(0);opacity:.28}to{transform:scale(4);opacity:0}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=datetime-local],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
input.ltr{direction:ltr;text-align:right}
textarea{min-height:320px;line-height:1.8;font-size:15px}
.err{background:var(--rbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.qb-chat{margin-top:12px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.qb-chat-log{max-height:180px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.qb-chat-msg{font-size:13px;line-height:1.35}
.qb-chat-msg .who{font-weight:700;color:var(--pri);margin-left:4px}
.qb-chat-msg .when{font-size:10px;opacity:.55;margin-right:4px;margin-inline-start:auto}
.qb-chat-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qb-chat-av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--sel)}
.qb-chat-av.letter{display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:var(--onpri);background:var(--pri)}
.qb-chat-body{margin-inline-start:34px;white-space:pre-wrap}
.qb-chat-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.qb-chat-form input{flex:1;border-radius:10px;border:1.5px solid var(--line);padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.qb-room-theme{border-radius:16px;padding:2px}
.qb-room-theme.t-teal .qb-hero{background:linear-gradient(135deg,#0B5D57,#2FB5A8)}
.qb-room-theme.t-purple .qb-hero{background:linear-gradient(135deg,#4338CA,#7C3AED)}
.qb-room-theme.t-gold .qb-hero{background:linear-gradient(135deg,#B45309,#E3A81C)}
.qb-room-theme.t-rose .qb-hero{background:linear-gradient(135deg,#9F1239,#F43F5E)}
.qb-room-theme.t-blue .qb-hero{background:linear-gradient(135deg,#1D4ED8,#38BDF8)}
/* لون الغرفة يطبّق على عناصر أكتر */
.qb-room-theme.t-teal{--room-accent:#0B5D57;--room-accent2:#2FB5A8}
.qb-room-theme.t-purple{--room-accent:#4338CA;--room-accent2:#7C3AED}
.qb-room-theme.t-gold{--room-accent:#B45309;--room-accent2:#E3A81C}
.qb-room-theme.t-rose{--room-accent:#9F1239;--room-accent2:#F43F5E}
.qb-room-theme.t-blue{--room-accent:#1D4ED8;--room-accent2:#38BDF8}
.qb-room-theme .qb-card{border-color:color-mix(in srgb,var(--room-accent,#0B5D57) 35%,var(--line))}
.qb-room-theme .qb-chip.host,.qb-room-theme .qb-chip.ready{border-color:var(--room-accent2,#2FB5A8)}
.qb-room-theme .btn.gold{background:var(--room-accent2,#E3A81C)}
.qb-room-theme .qb-chat{border-color:color-mix(in srgb,var(--room-accent,#0B5D57) 40%,var(--line))}
.qb-room-theme .qb-hud .qb-player.lead{box-shadow:0 0 0 2px var(--room-accent2)}
.qb-viewers{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer}
.qb-viewers-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;max-height:180px;overflow:auto}
.qb-chip .kick{margin-right:4px;font-size:11px;opacity:.85;cursor:pointer}
.qb-away-badge{font-size:10px;opacity:.75;margin-right:4px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 8px;min-height:160px}
.podium .pod{flex:1;max-width:110px;text-align:center;display:flex;flex-direction:column;align-items:center}
.podium .pod .avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.podium .pod.p1 .avatar{width:64px;height:64px;font-size:28px;background:linear-gradient(145deg,#F5D76E,#E3A81C);border:3px solid #fff3}
.podium .pod.p2 .avatar{background:linear-gradient(145deg,#E8E8E8,#A8A8A8);border:3px solid #fff3}
.podium .pod.p3 .avatar{background:linear-gradient(145deg,#E8B896,#CD7F32);border:3px solid #fff3}
.podium .pod .nm{font-weight:700;font-size:13px;margin-bottom:2px}
.podium .pod .sc{font-size:11px;opacity:.85}
.podium .pod .bar{width:100%;border-radius:10px 10px 4px 4px;margin-top:8px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-weight:800;font-size:18px;color:#fff}
.podium .pod.p1 .bar{height:88px;background:linear-gradient(180deg,#E3A81C,#B8860B)}
.podium .pod.p2 .bar{height:64px;background:linear-gradient(180deg,#C0C0C0,#8a8a8a)}
.podium .pod.p3 .bar{height:48px;background:linear-gradient(180deg,#CD7F32,#8B4513)}
.lb-rest{margin-top:8px}
.lb-rest .row{padding:10px 0;border-bottom:1px solid var(--line)}
.warnbar{display:none;background:var(--rbg);color:var(--bad);border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:600;animation:shake .45s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);transition:background-color .2s,color .2s}
.tab.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.badge{display:inline-block;background:var(--gold);color:#2b2000;border-radius:99px;padding:0 8px;font-size:13px;margin-inline-start:6px;animation:bp 1.8s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.18)}}
.screen{animation:enter .34s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash{display:grid;place-items:center;min-height:80vh;text-align:center}
.splash .logo{font-size:60px;text-decoration:none;display:inline-block;animation:enter .6s ease-out both}
.uline{display:block;height:5px;border-radius:5px;background:var(--gold);width:0;margin:6px auto 0;animation:uline 1s .2s ease-out forwards}
@keyframes uline{to{width:100%}}
.sk{border-radius:14px;min-height:128px;background:linear-gradient(90deg,var(--line),var(--sel),var(--line));background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{border:0;border-radius:20px;padding:16px 14px;color:#fff;text-align:start;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-height:136px;box-shadow:var(--sh);transition:transform .2s,box-shadow .25s}
.subj:active{transform:scale(.95)}
@media (hover:hover){.subj:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(0,0,0,.25)}}
.screen .subj{animation:tile .5s cubic-bezier(.3,1.3,.5,1) both}
.screen .subj:nth-child(2){animation-delay:.06s}.screen .subj:nth-child(3){animation-delay:.12s}.screen .subj:nth-child(4){animation-delay:.18s}.screen .subj:nth-child(5){animation-delay:.24s}.screen .subj:nth-child(6){animation-delay:.3s}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.93)}to{opacity:1;transform:none}}
.subj .g{font-size:36px;font-weight:700;line-height:1.2;direction:ltr;text-align:right;text-shadow:0 3px 8px rgba(0,0,0,.25)}
.subj b{font-size:19px}.subj small{opacity:.95}
.sp{height:6px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:auto;overflow:hidden}
.sp i{display:block;height:100%;width:var(--w);background:#fff;border-radius:99px;animation:grow .9s ease-out .3s both}
@keyframes grow{from{width:0}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sel);color:var(--pri)}
.pill.g{background:var(--gbg);color:var(--ok)}.pill.r{background:var(--rbg);color:var(--bad)}.pill.y{background:var(--ybg);color:var(--yfg)}.pill.i{background:color-mix(in srgb,var(--ind) 18%,transparent);color:var(--ind)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:background-color .35s}
.q.in{animation:qin .42s ease-out both;animation-delay:calc(var(--i)*45ms)}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.q .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:14px;font-weight:600;margin-inline-end:8px}
.q p{margin:0 0 10px;font-weight:500;white-space:pre-wrap}
.opt{display:block;position:relative;margin-top:8px}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
@media (hover:hover){label.opt:hover span{border-color:var(--pri)}}
.opt input:checked+span{border-color:var(--pri);background:var(--sel);font-weight:600;animation:pop .32s ease-out}
.opt input:focus-visible+span{outline:3px solid var(--gold)}
@keyframes pop{50%{transform:scale(1.035)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
div.opt span{cursor:default}
div.opt.right span{border-color:var(--ok);background:var(--gbg)}
div.opt.wrong span{border-color:var(--bad);background:var(--rbg);animation:shake .45s}
.tk{display:inline-block;animation:tkp .5s cubic-bezier(.3,1.7,.5,1) both}.tk.x{color:var(--bad)}.tk:not(.x){color:var(--ok)}
@keyframes tkp{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.timer{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--onpri);border-radius:12px;padding:8px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:600;box-shadow:var(--sh)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ind));border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.ring{width:150px;height:150px;margin:6px auto 4px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--gold);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi',sans-serif;font-size:34px;color:var(--pri)}
.stars span{display:inline-block;font-size:34px;color:var(--gold);animation:tkp .6s cubic-bezier(.3,1.7,.5,1) both}
.stars span.off{color:var(--line)}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--sel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:26px;color:var(--pri);line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:5px;height:160px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut);min-width:0}
.bars i{display:block;width:100%;max-width:30px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pri),var(--ind));min-height:3px;animation:rise .7s cubic-bezier(.3,1,.4,1) both;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0)}}
.bars i.f{background:var(--mut)}
.hb{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.hb i{display:block;height:100%;border-radius:99px;animation:grow .9s ease-out both}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--ind));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
.tl{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.tl span:first-child{flex:none}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.subj.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:16px}
.screen .subj:nth-child(7){animation-delay:.36s}.screen .subj:nth-child(8){animation-delay:.42s}
.asmimg{width:100%;border-radius:10px;display:block;cursor:zoom-in}
.thumb{display:inline-flex;align-items:center;gap:6px;margin:4px;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px}
.thumb img{height:44px;border-radius:6px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);overflow:auto;z-index:70;padding:56px 0 20px;text-align:center}
.lb img{width:100%;display:block;margin:0 auto;cursor:zoom-in}.lb img.z{width:240%;max-width:none;cursor:zoom-out}
.lbx{position:fixed;top:12px;inset-inline-end:12px;z-index:71}
.center{text-align:center;padding-top:60px}
.big{font-family:'Reem Kufi',sans-serif;font-size:56px;color:var(--pri);line-height:1.2}
.ann{background:linear-gradient(135deg,color-mix(in srgb,var(--ind) 16%,var(--card)),color-mix(in srgb,var(--gold) 18%,var(--card)));border-color:var(--gold)}
.fab{position:fixed;inset-inline-start:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#2b2000;font-size:30px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:20;transition:transform .2s}
.fab:active{transform:scale(.9)}
nav.bot{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:9}
nav.bot button{font:inherit;font-weight:600;flex:1;max-width:180px;border:0;border-radius:12px;padding:9px 6px;background:transparent;color:var(--mut);cursor:pointer;transition:background-color .2s,color .2s}
nav.bot button.on{background:var(--sel);color:var(--pri)}
#toast{position:fixed;inset-inline:12px;bottom:78px;max-width:460px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transform:translateY(24px) scale(.97);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1)}
#toast.show{opacity:1;transform:none}
#toast.gold{background:var(--gold);color:#2b2000;font-weight:600}

/* ---------- تحويل نص الأسئلة ---------- */
const LET={"أ":0,"ا":0,"a":0,"1":0,"ب":1,"b":1,"2":1,"ج":2,"c":2,"3":2,"د":3,"d":3,"4":3};
const LETTERS=["أ","ب","ج","د"];
function parseQs(t){
  const qs=[],errors=[];
  t.replace(/\r/g,"").trim().split(/\n\s*\n/).filter(b=>b.trim()).forEach((blk,i)=>{
    const lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    const q=[],o=[];let a,fun=false,essay=false,modelAns="";
    for(const l of lines){
      if(/^\[(?:ترفيه|fun)\]$/i.test(l)){fun=true;continue}
      if(/^\[(?:مقالي|essay)\]$/i.test(l)){essay=true;continue}
      let m=l.match(/^(?:الإجابة|الاجابة|الجواب|answer|ans|الحل)\s*[:：\-]\s*(.+)$/i);
      if(m){
        if(essay){modelAns=m[1].trim();continue}
        a=LET[m[1].trim().toLowerCase().charAt(0)];continue
      }
      if(essay && modelAns && !/^\[/.test(l) && !/^[أابجدa-dA-D1-4]\s*[\)\.\-–]/.test(l)){
        modelAns+=" "+l;continue
      }
      m=l.match(/^([أابجدa-dA-D1-4])\s*[\)\.\-–]\s*(.+)$/);
      if(m&&LET[m[1].toLowerCase()]===o.length){o.push(m[2].trim());continue}
      if(!o.length && !modelAns)q.push(l);
      else if(!essay) errors.push(`سؤال ${i+1}: سطر مش مفهوم: "${l}"`);
    }
    if(!q.length){errors.push(`سؤال ${i+1}: نص السؤال ناقص`);return}
    if(essay){
      if(!modelAns){errors.push(`سؤال ${i+1}: سؤال مقالي لازم فيه سطر "الحل: ..." أو "الإجابة: ..."`);return}
      qs.push({q:q.join("\n"),essay:true,model:modelAns,fun:!!fun});
    }else{
      if(o.length<2||o.length>4)errors.push(`سؤال ${i+1}: لازم من 2 إلى 4 اختيارات (أ ب ج د)`);
      else if(a===undefined||a>=o.length)errors.push(`سؤال ${i+1}: سطر "الإجابة: ب" ناقص أو غلط`);
      else qs.push(fun?{q:q.join("\n"),o,a,fun:true}:{q:q.join("\n"),o,a});
    }
  });
  return {qs,errors};
}
const serialize = qs => qs.map(x=>{
  if(x.essay) return x.q+"\n[مقالي]\nالحل: "+x.model+(x.fun?"\n[ترفيه]":"");
  return x.q+"\n"+x.o.map((t,i)=>`${LETTERS[i]}) ${t}`).join("\n")+`\nالإجابة: ${LETTERS[x.a]}`+(x.fun?"\n[ترفيه]":"");
}).join("\n\n");
function normalizeAr(s){
  return String(s||"").toLowerCase()
    .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/[ًٌٍَُِّْ]/g,"").replace(/[^\u0600-\u06FFa-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function tokenSet(s){return new Set(normalizeAr(s).split(" ").filter(w=>w.length>1))}
function extractNums(s){
  const m=String(s||"").match(/-?\d+(?:[.,]\d+)?/g)||[];
  return m.map(x=>x.replace(",",".")).filter((v,i,a)=>a.indexOf(v)===i);
}
function essayScoreOne(student, model){
  if(!student||!String(student).trim()) return 0;
  const st=normalizeAr(student), md=normalizeAr(model);
  if(!md) return 0;
  if(st===md) return 1;
  if(st.includes(md)||md.includes(st)) return 0.95;
  // final-number match: if model has numbers and student's last/key numbers match → high credit
  const mn=extractNums(model), sn=extractNums(student);
  if(mn.length){
    const lastM=mn[mn.length-1];
    const lastS=sn.length?sn[sn.length-1]:null;
    const allHit=mn.every(n=>sn.includes(n));
    if(lastS===lastM && mn.length<=3) return sn.length<=mn.length+2?0.92:0.85;
    if(allHit && mn.length>=1) return 0.88;
    if(lastS===lastM) return 0.8;
  }
  const ts=tokenSet(student), tm=tokenSet(model);
  if(!tm.size){
    // model is mostly numbers/symbols
    if(mn.length && sn.length && sn[sn.length-1]===mn[mn.length-1]) return 0.9;
    return 0;
  }
  let hit=0; tm.forEach(w=>{if(ts.has(w)) hit++});
  const recall=hit/tm.size, precision=ts.size?hit/ts.size:0;
  const f1=(recall+precision)?(2*recall*precision)/(recall+precision):0;
  const lenRatio=Math.min(st.length,md.length)/Math.max(st.length,md.length||1);
  let score=f1*0.7+lenRatio*0.1+(recall>0.45?0.1:0);
  if(mn.length && sn.length && sn[sn.length-1]===mn[mn.length-1]) score=Math.max(score,0.82);
  if(recall>=0.6) score=Math.max(score,0.7);
  if(recall>=0.8) score=Math.max(score,0.88);
  if(recall>=0.95) score=Math.max(score,1);
  return Math.min(1, Math.round(score*100)/100);
}
function essayScore(student, model){
  if(!student||!String(student).trim()) return 0;
  // multiple accepted solutions separated by ||| or //
  const alts=String(model||"").split(/\|{3}|\n\s*---\s*\n|\n\s*\/\/\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(!alts.length) return 0;
  let best=0;
  for(const alt of alts) best=Math.max(best, essayScoreOne(student, alt));
  return best;
}

/* ---------- ترتيب عشوائي ثابت لكل محاولة ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(e,seed){
  const rnd=mulberry(seed),on=e.shuffle!==false;
  const idx=e.questions.map((_,i)=>i);
  const g=idx.filter(i=>!e.questions[i].fun),f=idx.filter(i=>e.questions[i].fun);
  return (on?shuf(g,rnd):g).concat(f).map(i=>{
    const q=e.questions[i];
    if(q.essay) return {i,o:[]};
    return {i,o:on?shuf(q.o.map((_,j)=>j),rnd):q.o.map((_,j)=>j)};
  });
}

function stats(){
  const R=S.results.filter(r=>r.total>0);
  const avg=a=>a.length?Math.round(a.reduce((s,r)=>s+pctOf(r),0)/a.length):0;
  const wp=R.filter(r=>r.passMark>0);
  const per=S.exams.map(e=>{const rs=R.filter(r=>r.examId===e.id),w=rs.filter(r=>r.passMark>0);
    const ts=rs.filter(r=>r.secs>0);
    return {e,n:rs.length,avg:avg(rs),secs:ts.length?Math.round(ts.reduce((a,r)=>a+r.secs,0)/ts.length):null,pass:w.length?Math.round(w.filter(r=>r.passed).length/w.length*100):null}});
  const qm={};
  R.forEach(r=>{const e=S.exams.find(x=>x.id===r.examId);if(!e||!r.ans)return;
    e.questions.forEach((q,i)=>{if(q.fun)return;const k=e.id+"#"+i;const m=qm[k]||(qm[k]={q:q.q,exam:e.title,n:0,c:0});m.n++;if(r.ans[i]===q.a)m.c++})});
  const ql=Object.values(qm).filter(m=>m.n>=3).map(m=>({...m,p:Math.round(m.c/m.n*100)})).sort((a,b)=>a.p-b.p);
  return {R,avg:avg(R),passRate:wp.length?Math.round(wp.filter(r=>r.passed).length/wp.length*100):null,per,hard:ql.slice(0,3),easy:ql.slice(-3).reverse()};
}

function board(){
  const by={};S.results.forEach(r=>{(by[r.uid]=by[r.uid]||{uid:r.uid,name:r.name,rs:[]}).rs.push(r)});
  const L=Object.values(by).map(x=>{const good=x.rs.filter(r=>pctOf(r)>=50&&r.secs>0);
    return {uid:x.uid,name:x.name,n:x.rs.length,avg:Math.round(x.rs.reduce((a,r)=>a+pctOf(r),0)/x.rs.length),fast:good.length?Math.round(good.reduce((a,r)=>a+r.secs,0)/good.length):null}});
  return {top:L.slice().sort((a,b)=>b.avg-a.avg||b.n-a.n).slice(0,10),act:L.slice().sort((a,b)=>b.n-a.n).slice(0,5),fast:L.filter(x=>x.fast!=null).sort((a,b)=>a.fast-b.fast).slice(0,3)};
}

const XP_TITLES=[
  {min:0,name:"المبتدئ",emoji:"🌱"},
  {min:50,name:"المجتهد",emoji:"📖"},
  {min:150,name:"المثابر",emoji:"🔥"},
  {min:300,name:"العبقري",emoji:"🧠"},
  {min:600,name:"أسطورة التفوق",emoji:"👑"}
];
function xpTitle(xp){
  let t=XP_TITLES[0];
  for(const x of XP_TITLES){if((xp||0)>=x.min)t=x}
  return t;
}
function xpLevel(xp){
  // كل 50 نقطة = لفل
  return Math.floor((xp||0)/50)+1;
}
function xpProgress(xp){
  const v=(xp||0)%50;
  return Math.round(v/50*100);
}
async function addXP(amount, reason){
  if(!S.user||S.isAdmin||!amount)return;
  try{
    const ref=doc(db,"students",S.user.uid);
    const snap=await getDoc(ref);
    const cur=snap.exists()?snap.data():{};
    const xp=(cur.xp||0)+amount;
    const level=xpLevel(xp);
    const title=xpTitle(xp).name;
    const badges=new Set(cur.badges||[]);
    if(xp>=50)badges.add("المجتهد");
    if(xp>=150)badges.add("المثابر");
    if(reason==="exam_full")badges.add("درجة كاملة");
    if(reason==="first_exam")badges.add("أول امتحان");
    if(reason==="game_win")badges.add("فوز لعبة");
    await setDoc(ref,{xp,level,title,badges:[...badges],lastXpAt:serverTimestamp()},{merge:true});
    if(S.profile){S.profile.xp=xp;S.profile.level=level;S.profile.title=title;S.profile.badges=[...badges]}
    toast(`+${amount} XP · ${xpTitle(xp).emoji} ${title}`,true);
  }catch(e){console.warn("xp",e)}
}
async function touchStreak(){
  if(!S.user||S.isAdmin)return;
  try{
    const ref=doc(db,"students",S.user.uid);
    const snap=await getDoc(ref);
    const cur=snap.exists()?snap.data():{};
    const today=new Date();today.setHours(0,0,0,0);
    const key=today.toISOString().slice(0,10);
    if(cur.lastStreakDay===key)return;
    let streak=1;
    if(cur.lastStreakDay){
      const prev=new Date(cur.lastStreakDay+"T00:00:00");
      const diff=Math.round((today-prev)/86400000);
      if(diff===1)streak=(cur.streak||0)+1;
    }
    const badges=new Set(cur.badges||[]);
    if(streak>=7)badges.add("7 أيام متتالية");
    const dailyXp=cur.lastStreakDay===key?0:5;
    const xp=(cur.xp||0)+dailyXp;
    await setDoc(ref,{
      streak,lastStreakDay:key,xp,level:xpLevel(xp),title:xpTitle(xp).name,
      badges:[...badges],lastSeenAt:serverTimestamp()
    },{merge:true});
    if(S.profile){
      S.profile.streak=streak;S.profile.xp=xp;S.profile.level=xpLevel(xp);
      S.profile.title=xpTitle(xp).name;S.profile.badges=[...badges];
    }
    if(dailyXp)toast(`🔥 ستريك ${streak} يوم · +${dailyXp} XP`,true);
  }catch(e){console.warn("streak",e)}
}

function reviewBody(r,e,showAns){

      const sc=ov!=null?ov:essayScore(a,q.model);
      const label=(!a||!String(a).trim())?pill("لم تُجب","y"):sc>=0.85?pill("ممتاز "+Math.round(sc*100)+"%","g"):sc>=0.5?pill("جزئي "+Math.round(sc*100)+"%","y"):pill("ضعيف "+Math.round(sc*100)+"%","r");
      const adj=S.isAdmin?` <button type="button" class="btn ghost sm" data-act="setEssayScore" data-i="${i}" data-cur="${sc}">تعديل الدرجة</button>`:"";

function celebratePerfect(){
  try{if(navigator.vibrate)navigator.vibrate([40,30,40,30,80])}catch(_){}
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const notes=[523,659,784,1046];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;g.gain.value=0.06;
      o.connect(g);g.connect(ctx.destination);
      o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.2);
    });
  }catch(_){}
  const layer=document.createElement("div");layer.className="confetti-layer";
  const colors=["#0B5D57","#F5C542","#E85D4C","#3B82F6","#22C55E","#fff"];
  for(let i=0;i<48;i++){
    const p=document.createElement("i");p.className="confetti-piece";
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.8)+"s";
    p.style.borderRadius=Math.random()>0.5?"50%":"2px";
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),3500);
  toast("🏆 مبروك 100%!",true);
}

function qbPool(subject, maxN){
  const pool=[];
  S.exams.filter(e=>e.published && (!subject||subject==="random"||e.subject===subject)).forEach(e=>{
    (e.questions||[]).forEach(q=>{
      if(q.fun||q.essay||!q.o||q.o.length<2||q.a==null||q.a<0) return;
      pool.push({q:q.q,o:q.o.slice(),a:q.a,sub:e.subject,exam:e.title});
    });
  });
  // shuffle pool with fresh seed
  const rnd=mulberry(Date.now()^(Math.random()*1e9|0));
  const sh=shuf(pool,rnd);
  return sh.slice(0, Math.min(maxN, sh.length));
}
function qbShuffleQ(item, seed){
  const rnd=mulberry(seed);
  const idx=item.o.map((_,i)=>i);
  const order=shuf(idx,rnd);
  const o=order.map(i=>item.o[i]);
  const a=order.indexOf(item.a);
  return {q:item.q,o,a,sub:item.sub,exam:item.exam};
}
function qbCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function qbStopSub(){if(S.qbSub){try{S.qbSub()}catch(_){} S.qbSub=null} qbStopChat()}
function qbBotDelay(diff, correct){
  // easy / medium / hard reaction times + accuracy
  const cfg={easy:{acc:.55,min:1800,max:4500},medium:{acc:.72,min:900,max:2800},hard:{acc:.9,min:400,max:1400}}[diff]||{acc:.7,min:1000,max:2500};
  const willCorrect=Math.random()<cfg.acc;
  const ms=cfg.min+Math.random()*(cfg.max-cfg.min);
  return {ms, willCorrect};
}

function aiLocalReply(q){
  const s=normalizeAr(q);
  const name=(S.profile&&S.profile.name)?S.profile.name.split(" ")[0]:"";
  const hi=name?("يا "+name+"، "):"";

  if(/مين انت|انت مين|من انت|ايه اسمك|عرف نفسك|who are you|ما اسمك/.test(s)||s.trim()==="么")
    return "أنا **么** 🤖\nمساعد ذكي جوّه منصة التفوق.\nبساعد الطلاب يفهموا الدروس، أراجع الامتحانات والإجابات والكتب المرفوعة، وأشرح أي حاجة في المنصة مش واضحة.\nاسأل بحرية.";

  if(/سلام|اهلا|مرحبا|ازيك|صباح|مساء|你好/.test(s))
    return "وعليكم السلام "+hi+"🙂 أنا 么. تحب نوضح درس، نراجع سؤال امتحان، ولا شرح جزء من المنصة؟";

  // —— شرح المنصة ——
  if(/ازاي|كيف|فين|مش فاهم|ايه هو|يعني ايه/.test(s)){
    if(/امتحان|اختبار/.test(s))
      return hi+"**الامتحانات:** من «المواد» اختار المادة → امتحان → ابدأ. في وقت محفوظ، ومحاولتين غالبًا. بعد التسليم تشوف درجتك. لو وقفت في النص: «حفظ وخرج» وترجع تكمل.";
    if(/تقييم|حل|نموذج/.test(s))
      return hi+"**التقييمات:** من الصفحة الرئيسية → التقييمات. فيها نماذج وحلول لما الأدمن يفتح الحل.";
    if(/لعبه|غرف|روبوت/.test(s))
      return hi+"**الألعاب:** تبويب الألعاب تحت. ضد روبوت من اللعبة نفسها، أو غرفة مع أصحابك (إنشاء/انضمام بكود).";
    if(/شات|جروب|تواصل|رسايل/.test(s))
      return hi+"**التواصل:** تبويب تواصل — محادثات خاصة وجروبات. تقدر تبعت نص/صورة/صوت، وفي مكالمة صوت 📞 من الشات.";
    if(/فضي|كتب|xp|نقط|لفل|حسابي|ملف/.test(s))
      return hi+"من **حسابي**: صورتك، XP، الألقاب، الستريك، ومساعد 么.\n**الكتب** من الرئيسية للتحميل.\n**فضايح** لقطات بعد موافقة الأدمن.";
    if(/منصه|التفوق|استخدم|تنزيل|تطبيق|apk/.test(s))
      return hi+"منصة التفوق للامتحانات والتقييمات والألعاب والتواصل. تقدر تثبّتها كتطبيق من زر التحميل أو من قائمة المتصفح.";
  }

  // —— بحث في الامتحانات (أسئلة + إجابات) ——
  const exams=(S.exams||[]).filter(e=>vis(e)||S.isAdmin);
  const qTokens=s.split(/\s+/).filter(w=>w.length>2);
  let examHits=[];
  for(const e of exams){
    const list=Array.isArray(e.questions)?e.questions:[];
    // parse if string bank
    let items=list;
    if(!items.length&&e.raw){
      // skip heavy
    }
    for(let i=0;i<(list.length||0);i++){
      const qq=list[i];
      if(!qq)continue;
      const qt=normalizeAr(qq.q||qq.question||"");
      const opts=(qq.o||qq.options||[]).map(x=>normalizeAr(String(x))).join(" ");
      let score=0;
      for(const w of qTokens){if(qt.includes(w))score+=2;if(opts.includes(w))score+=1}
      if(score>=3){
        const ansIdx=typeof qq.a==="number"?qq.a:(typeof qq.answer==="number"?qq.answer:-1);
        const ansTxt=ansIdx>=0&&(qq.o||qq.options)?(qq.o||qq.options)[ansIdx]:"";
        examHits.push({score,title:e.title,subject:e.subject,q:qq.q||qq.question,ans:ansTxt,i:i+1});
      }
    }
  }
  examHits.sort((a,b)=>b.score-a.score);
  if(examHits.length){
    const top=examHits.slice(0,3);
    let out=hi+"لقيت في امتحانات المنصة:\n\n";
    top.forEach(h=>{
      out+="📝 **"+h.title+"**"+(h.subject?" · "+(typeof subName==="function"?subName(h.subject):h.subject):"")+"\n";
      out+="س"+(h.i)+": "+String(h.q||"").slice(0,180)+"\n";
      if(h.ans)out+="✅ الإجابة: "+h.ans+"\n";
      out+="\n";
    });
    out+="لو مش ده اللي تقصده، صغّر السؤال أو اذكر عنوان الامتحان.";
    return out;
  }

  // —— بحث في الكتب ——
  const books=(S.books||[]).filter(b=>(b.content||"").trim().length>15);
  if(books.length){
    let best=null,bestScore=0,snippet="";
    for(const b of books){
      const c=normalizeAr(b.content), th=normalizeAr(b.title||"");
      let score=0;
      for(const w of qTokens){if(c.includes(w))score++;if(th.includes(w))score+=2}
      if(score>bestScore){
        bestScore=score;best=b;
        const raw=b.content||"";
        let idx=0;
        for(const w of qTokens){const p=normalizeAr(raw).indexOf(w);if(p>=0){idx=Math.max(0,p-50);break}}
        snippet=raw.slice(idx,idx+450).trim();
        if(idx>0)snippet="…"+snippet;
        if(raw.length>idx+450)snippet+="…";
      }
    }
    if(best&&bestScore>=2){
      return hi+"من كتاب **"+best.title+"**:\n\n"+snippet+"\n\nعايز تفصيل أكتر من نفس الكتاب؟";
    }
  }

  // منهج أساسي
  if(/معلق/.test(s))
    return hi+"المعلقات: قصائد طوال من أجود الشعر الجاهلي (امرؤ القيس، زهير، طرفة، لبيد، عنترة، الحارث، عمرو بن كلثوم). تسمية مرتبطة بالتعلق أو التعليق على الكعبة حسب الآراء.";
  if(/جاهل|عصر جاهل/.test(s))
    return hi+"العصر الجاهلي قبل الإسلام ~قرن ونصف. الجهالة = فعل القبيح بعلم، مش الجهل بالقراءة فقط. أدب: شعر ونثر.";
  if(/اذاكر|مذاكر/.test(s))
    return hi+"ذاكر جزء → حل أسئلة عليه من المنصة → راجع الغلط → كرّر تاني يوم. استخدم الامتحانات كاختبار زمني.";

  if(/كتاب|كتب/.test(s)){
    const n=(S.books||[]).length;
    return n?hi+"الكتب المتاحة:\n"+(S.books||[]).map(b=>"• "+b.title).join("\n")+"\nاسأل عن عنوان معيّن لو النص متسجّل عندي.":hi+"لسه مفيش كتب بنص للمراجعة. الأدمن يضيف الكتاب + ملخصه من لوحة الكتب.";
  }

  return hi+"أنا 么 — دورّت في الامتحانات والكتب المتاحة وما لقيتش تطابق قوي.\nجرّب:\n• نص سؤال من امتحان\n• اسم درس أو كتاب\n• «ازاي أبدأ امتحان؟»\nولو المدرس مفعّل الرابط الذكي، الإجابات بتبقى أوسع.";
}

const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const isFile=f=>f.kind==="image"||f.kind==="pdf";
async function loadAsm(id){
  const x=S.asm;if(!x||x.id!==id)return;
  const a=S.asms.find(q=>q.id===id);
  try{
    if(!x.qDone){
      const sn=await getDocs(query(collection(db,"assessments",id,"files"),where("part","==","q")));
      x.q=sn.docs.map(d=>({id:d.id,...d.data()})).filter(isFile).sort(byOrder);x.qDone=true;
    }
    if(a&&a.showSolution&&!x.solDone){
      const sn=await getDocs(query(collection(db,"assessments",id,"files"),where("part","==","s")));
      const all=sn.docs.map(d=>({id:d.id,...d.data()}));
      x.s=all.filter(isFile).sort(byOrder);const t=all.find(f=>f.kind==="text");x.solText=t?t.text:"";x.solDone=true;
    }
  }catch(e){x.err=true;x.qDone=true;if(a&&a.showSolution)x.solDone=true}
  x.loading=false;if(S.view==="asm"&&S.asm===x)render();
}
function ensureSol(){
  const x=S.asm;if(S.view!=="asm"||!x||S.isAdmin)return;
  const a=S.asms.find(q=>q.id===x.id);
  if(a&&a.showSolution&&!x.solDone&&!x.loading){x.loading=true;loadAsm(x.id)}
}
async function wipeFiles(id,part,gid){
  const sn=await getDocs(query(collection(db,"assessments",id,"chunks"),where("part","==",part),where("gid","==",gid)));
  for(const d of sn.docs)await deleteDoc(d.ref);
}

    if(!confirm("هبني لوحة الشرف من كل النتائج القديمة. متابعة؟"))return;
    try{
      const byUid={};
      (S.results||[]).forEach(r=>{
        if(!r.uid||!r.examId)return;
        if(!byUid[r.uid]) byUid[r.uid]={name:r.name,phone:r.phone,exams:{}};
        const prev=byUid[r.uid].exams[r.examId];
        if(!prev||(r.score/Math.max(r.total,1))>(prev.score/Math.max(prev.total,1)))
          byUid[r.uid].exams[r.examId]=r;
      });
      let n=0;
      for(const uid of Object.keys(byUid)){
        const u=byUid[uid], list=Object.values(u.exams);
        const examsDone=list.length, totalScore=list.reduce((s,r)=>s+(r.score||0),0), totalQ=list.reduce((s,r)=>s+(r.total||0),0);

          examsDone,totalScore,totalQ,pct:totalQ?Math.round(totalScore/totalQ*100):0,
          updatedAt:serverTimestamp()
        },{merge:true});
        n++;
      }
      toast("اتبنيت لوحة الشرف لـ "+n+" طالب");
    }catch(e){toast("فشل البناء: "+(e.message||""))}

  async qbLeaveRoom(){
    const inPlay=S.view==="qbPlay"||S.view==="qbResult"||(S.qb&&S.qb.match);
    if(inPlay||(S.qb&&S.qb.roomCode)){
      if(!confirm("متأكد عايز تخرج من الغرفة؟\nلو انت آخر واحد الغرفة هتتقفل.")) return;
    }
    const code=S.qb&&S.qb.roomCode;
    qbStopSub();
    if(code&&S.user){
      try{
        // اقرأ أحدث نسخة من الغرفة
        const snap=await getDoc(doc(db,"qb_rooms",code));
        if(snap.exists()){
          const room=snap.data();
          const players={...(room.players||{})};
          delete players[S.user.uid];
          const left=Object.keys(players).filter(k=>k!=="bot");
          if(left.length===0){
            await deleteDoc(doc(db,"qb_rooms",code));
          } else {
            const patch={[`players.${S.user.uid}`]:deleteField()};
            if(room.host===S.user.uid) patch.host=left[0];
            // لو المباراة شغالة ومفيش حد جاهز — رجّع للوبي لو بقي لاعب واحد بس اختياري
            await updateDoc(doc(db,"qb_rooms",code),patch);
          }

      }catch(e){console.warn("leave room",e)}
    }

  async qbRematchRoom(){
    const code=S.qb&&S.qb.roomCode;if(!code||!S.qb.room)return;
    if(S.qb.room.host!==S.user.uid){toast("المضيف بس يقدر يعيد اللعب في نفس الغرفة");return}
    try{
      const players=S.qb.room.players||{};
      const reset={};
      Object.keys(players).forEach(uid=>{
        const p=players[uid];
        reset[uid]={uid:p.uid,name:p.name,ready:uid===S.user.uid,score:0,correct:0,wrong:0,streak:0,bestStreak:0,ans:null};
      });
      // new questions same settings
      const subject=S.qb.room.subject, n=S.qb.room.qCount||10, sec=S.qb.room.sec||0;
      const raw=qbPool(subject,n);
      if(raw.length<3){toast("مفيش أسئلة كفاية");return}
      const seed=Date.now()^(Math.random()*1e9|0);
      const qs=raw.map((it,i)=>qbShuffleQ(it, seed+i*9973));
      await updateDoc(doc(db,"qb_rooms",code),{status:"lobby",players:reset,qs,seed,idx:0,startedAt:null});
      S.qb.match=null;
      toast("الغرفة جاهزة للجولة الجاية — استنوا الجاهزية");
    }catch(e){toast("مقدرتش أعيد: "+(e.message||""))}
  },

    const b=$("#sva");b.disabled=true;b.textContent="جاري الحفظ والرفع… متقفلش الصفحة";

      if(id)await updateDoc(doc(db,"assessments",id),data);
      else{const r=await addDoc(collection(db,"assessments"),{...data,createdAt:serverTimestamp()});id=r.id}
      for(const r of e.rm){if(r.kind==="pdf")await wipeFiles(id,r.part,r.gid);await deleteDoc(doc(db,"assessments",id,"files",r.id))}

  async setEssayScore(d){
    if(!S.isAdmin||!S.review||!S.review.r)return;
    const r=S.review.r, idx=+d.i, raw=prompt("درجة السؤال من 0 إلى 1 (مثال 0.75):", d.cur||"1");
    if(raw==null)return;
    const v=Math.max(0,Math.min(1,parseFloat(raw)));
    if(isNaN(v)){toast("رقم غير صالح");return}
    try{
      const e=S.exams.find(x=>x.id===r.examId);
      if(!e){toast("الامتحان مش موجود");return}
      // recompute total with override
      const overrides={...(r.essayOverrides||{}),[idx]:v};
      let scoreRaw=0;
      e.questions.forEach((q,i)=>{
        if(q.fun)return;
        if(q.essay){
          if(overrides[i]!=null) scoreRaw+=overrides[i];
          else scoreRaw+=essayScore((r.ans||[])[i], q.model);
        } else if((r.ans||[])[i]===q.a) scoreRaw+=1;
      });
      const score=Math.round(scoreRaw*100)/100;
      const passed=r.passMark>0?score>=r.passMark:null;
      await updateDoc(doc(db,"results",r.id),{score,passed,essayOverrides:overrides});
      r.score=score;r.passed=passed;r.essayOverrides=overrides;
      render(true);toast("اتعدّلت الدرجة → "+score+"/"+r.total);
    }catch(err){toast("مقدرتش أعدّل: "+(err.code||err.message||""))}
  },

async function startVoiceCall(toUid,toName){
  if(!S.user||!toUid)return;
  if(window.__call){toast("في مكالمة شغالة");return}
  toast("جاري الاتصال…");
  const callId=[S.user.uid,toUid].sort().join("_")+ "_"+Date.now().toString(36);
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast("اسمح بالميكروفون للمكالمة");return}
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  stream.getTracks().forEach(tr=>pc.addTrack(tr,stream));
  const remoteAudio=new Audio();remoteAudio.autoplay=true;
  pc.ontrack=ev=>{remoteAudio.srcObject=ev.streams[0]};
  const callRef=doc(db,"calls",callId);
  pc.onicecandidate=e=>{
    if(e.candidate)updateDoc(callRef,{["ice_"+S.user.uid]:e.candidate.toJSON()}).catch(()=>{});
  };
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callRef,{
    from:S.user.uid,fromName:(S.profile.name||"").split(" ")[0],
    to:toUid,toName:toName||"زميل",
    offer:offer,status:"ringing",createdAt:serverTimestamp()
  });
  showCallUI(toName||"زميل",true,()=>endVoiceCall());
  window.__call={pc,stream,callId,remoteAudio,unsub:null};
  window.__call.unsub=onSnapshot(callRef,async snap=>{
    if(!snap.exists()){endVoiceCall();return}
    const d=snap.data();
    if(d.answer&&pc.signalingState!=="closed"){
      try{if(!pc.currentRemoteDescription)await pc.setRemoteDescription(d.answer)}catch(_){}
    }
    if(d.status==="ended")endVoiceCall();
    const iceKey="ice_"+toUid;
    if(d[iceKey]){try{await pc.addIceCandidate(d[iceKey])}catch(_){}}
  });
}

async function endVoiceCall(){
  const c=window.__call;
  if(!c){const b=document.getElementById("callBar");if(b)b.remove();return}
  try{if(c.unsub)c.unsub()}catch(_){}
  try{c.pc.close()}catch(_){}
  try{c.stream.getTracks().forEach(tr=>tr.stop())}catch(_){}
  try{if(c.callId)updateDoc(doc(db,"calls",c.callId),{status:"ended"}).catch(()=>{})}catch(_){}
  window.__call=null;
  const b=document.getElementById("callBar");if(b)b.remove();
  toast("انتهت المكالمة");
}

    snap.docChanges().forEach(async ch=>{
      if(ch.type!=="added")return;

      if(!confirm((d.fromName||"شخص")+" بيتصل بيك — ترد؟")){
        updateDoc(ch.doc.ref,{status:"ended"}).catch(()=>{});return;
      }
      let stream;

      catch(e){toast("الميكروفون مرفوض");updateDoc(ch.doc.ref,{status:"ended"});return}
      const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
      stream.getTracks().forEach(tr=>pc.addTrack(tr,stream));
      const remoteAudio=new Audio();remoteAudio.autoplay=true;
      pc.ontrack=ev=>{remoteAudio.srcObject=ev.streams[0]};
      pc.onicecandidate=e=>{if(e.candidate)updateDoc(ch.doc.ref,{["ice_"+S.user.uid]:e.candidate.toJSON()}).catch(()=>{})};
      await pc.setRemoteDescription(d.offer);

      })};
    });

}

async function recordVoice(onDone){
  if(window.__voiceBusy){toast("في تسجيل شغّال");return}
  if(!window.MediaRecorder){toast("المتصفح مش بيدعم التسجيل");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("المتصفح مش بيدعم الميكروفون");return}
  let stream,rec,chunks=[],timer,sec=0,stopping=false;
  const mimeCandidates=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus",""];
  let mime="";
  for(const m of mimeCandidates){
    if(!m||(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))){mime=m;break}
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    toast("اسمح بالميكروفون من إعدادات المتصفح/الموقع");
    return;
  }
  window.__voiceBusy=true;
  const bar=document.createElement("div");
  bar.className="voice-bar";
  bar.innerHTML=`<div><span class="rec-dot"></span><b id="voiceSec">جاري التسجيل 0 ث</b></div>
    <p class="mut" style="margin:8px 0">اتكلم — بعدين دوس «إيقاف وإرسال»</p>
    <div class="row" style="justify-content:center;gap:10px">
      <button type="button" class="btn danger sm" id="voiceCancel">إلغاء</button>
      <button type="button" class="btn gold sm" id="voiceSend">⏹ إيقاف وإرسال</button>
    </div>`;
  document.body.appendChild(bar);
  function cleanup(){
    window.__voiceBusy=false;
    try{bar.remove()}catch(_){}
    clearInterval(timer);
    try{stream&&stream.getTracks().forEach(tr=>tr.stop())}catch(_){}
  }
  try{
    rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  }catch(_){
    try{rec=new MediaRecorder(stream)}catch(e2){cleanup();toast("فشل بدء التسجيل");return}
  }
  chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
  const finished=new Promise(resolve=>{
    rec.onstop=()=>{
      const type=((rec.mimeType||mime)||"audio/webm").split(";")[0]||"audio/webm";
      resolve(new Blob(chunks,{type}));
    };
    rec.onerror=()=>resolve(new Blob([],{type:"audio/webm"}));
  });
  try{rec.start(250)}catch(e){cleanup();toast("فشل التسجيل");return}
  timer=setInterval(()=>{
    sec++;
    const el=document.getElementById("voiceSec");
    if(el)el.textContent="جاري التسجيل "+sec+" ث";
    if(sec>=40)stop(true);
  },1000);
  async function stop(send){
    if(stopping)return;
    stopping=true;
    if(!rec||rec.state==="inactive"){cleanup();return}
    try{rec.requestData()}catch(_){}
    try{rec.stop()}catch(_){}
    let blob;
    try{blob=await finished}catch(_){blob=null}
    cleanup();
    if(!send)return;
    if(!blob||blob.size<200){toast("التسجيل فاضي — اتكلم أقرب للمايك وجرب تاني");return}
    if(blob.size>700000){toast("التسجيل طويل — سجّل أقل من 30 ثانية");return}
    toast("جاري إرسال التسجيل…");
    try{
      const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
      if(onDone)await onDone(dataUrl);
    }catch(err){
      console.error(err);
      toast("فشل إرسال التسجيل");
    }
  }
  document.getElementById("voiceCancel").onclick=()=>stop(false);
  document.getElementById("voiceSend").onclick=()=>stop(true);
}

function isNearBottom(el,px){
  if(!el)return true;
  return (el.scrollHeight-el.scrollTop-el.clientHeight)<(px||80);
}
function scrollChatBottom(force){
  const el=chatLogEl();
  if(!el)return;
  const go=()=>{el.scrollTop=el.scrollHeight};
  requestAnimationFrame(()=>requestAnimationFrame(go));
  setTimeout(go,50);
  setTimeout(go,200);
  if(force){S.chatStickBottom=true;S.chatNewBelow=0}
}
function bindChatScroll(){
  const el=chatLogEl();
  if(!el||el._chatBound)return;
  el._chatBound=true;
  el.addEventListener("scroll",()=>{
    S.chatStickBottom=isNearBottom(el,100);
    if(S.chatStickBottom){S.chatNewBelow=0;const j=$("#chatJumpBtn");if(j)j.remove()}
  },{passive:true});
}
function showChatJump(n){
  if($("#chatJumpBtn")){
    const b=$("#chatJumpBtn .n");if(b&&n)b.textContent=String(n);
    return;
  }
  const btn=document.createElement("button");
  btn.type="button";btn.id="chatJumpBtn";btn.className="chat-jump";
  btn.innerHTML=`↓ رسائل جديدة${n?` <span class="n">${n}</span>`:""}`;
  btn.onclick=()=>{scrollChatBottom(true);btn.remove()};
  document.body.appendChild(btn);
}
function onChatMsgsUpdate(prevLen,newLen){
  const el=chatLogEl();
  const added=Math.max(0,(newLen||0)-(prevLen||0));
  // أول فتح أو لازق تحت → انزل
  if(S.chatStickBottom!==false || !el || (prevLen||0)===0){
    S.chatStickBottom=true;
    scrollChatBottom(true);
    const j=$("#chatJumpBtn");if(j)j.remove();
    return;
  }
  if(added>0 && !isNearBottom(el,100)){
    S.chatNewBelow=(S.chatNewBelow||0)+added;
    showChatJump(S.chatNewBelow);
  }else{
    scrollChatBottom(false);
  }
}

function packImage(file,maxSide,quality,maxBytes){
  maxSide=maxSide||1200;quality=quality==null?0.85:quality;maxBytes=maxBytes||900000;
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxSide||h>maxSide){const s=Math.min(maxSide/w,maxSide/h);w=Math.round(w*s);h=Math.round(h*s)}
        const c=document.createElement("canvas");c.width=Math.max(1,w);c.height=Math.max(1,h);
        c.getContext("2d").drawImage(img,0,0,w,h);
        let q=quality,data=c.toDataURL("image/jpeg",q);
        // نقلّل الجودة تدريجي بس لو عدّينا الحد (Firestore ~1MB)
        while(data.length>maxBytes&&q>0.4){q-=0.05;data=c.toDataURL("image/jpeg",q)}
        if(data.length>maxBytes){
          // صغّر الأبعاد شوية كمان
          const c2=document.createElement("canvas");
          c2.width=Math.round(w*0.75);c2.height=Math.round(h*0.75);
          c2.getContext("2d").drawImage(c,0,0,c2.width,c2.height);
          data=c2.toDataURL("image/jpeg",Math.max(0.45,q));
        }
        resolve(data);
      };
      img.onerror=()=>reject(new Error("img"));
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
/** صورة بروفايل مصغّرة للغرف (مش بنحط الأصلية عشان متتفخّش وثيقة الغرفة) */
function packTinyAvatar(dataUrl){
  return new Promise(resolve=>{
    if(!dataUrl||typeof dataUrl!=="string"||!dataUrl.startsWith("data:")){resolve("");return}
    const img=new Image();
    img.onload=()=>{
      const side=56;const c=document.createElement("canvas");c.width=side;c.height=side;
      const ctx=c.getContext("2d");
      const s=Math.min(img.width,img.height);const sx=(img.width-s)/2,sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,side,side);
      resolve(c.toDataURL("image/jpeg",0.55));
    };
    img.onerror=()=>resolve("");
    img.src=dataUrl;
  });
}

function qbListenRoom(code){
  qbStopSub();
  qbListenChat(code);
  S.qbSub=onSnapshot(doc(db,"qb_rooms",code),snap=>{
    if(!snap.exists()){toast("الغرفة اتقفلت");S.qb=null;S.view="games";render(true);return}
    const room={...snap.data(),code};
    if(!S.qb)S.qb={mode:"friends"};
    S.qb.room=room;S.qb.roomCode=code;
    // لو مستني موافقة دخول
    if(S.qb.waitingJoin){
      if(room.players&&room.players[S.user.uid]){
        S.qb.waitingJoin=false;
        toast("اتقبلت في الغرفة ✓");
        S.view="qbLobby";render(true);return;
      }
      if(!(room.joinRequests&&room.joinRequests[S.user.uid])){
        S.qb.waitingJoin=false;S.qb=null;S.view="games";
        toast("اترفض طلب الدخول أو الغرفة اتقفلت");
        render(true);return;
      }
      // لسه مستني
      if(S.view!=="games"){S.view="games";render()}
      return;
    }
    // اتعملت طرد؟
    if(room.players&&!room.players[S.user.uid]&&!S.qb.waitingJoin){
      toast("اتطردت من الغرفة أو خرجت");
      qbStopSub();S.qb=null;S.view="games";render(true);return;
    }
    if(room.status==="lobby"){
      if(S.view!=="qbLobby"){S.view="qbLobby";render(true)}
      else render();
      return;
    }
    if(room.status==="done"){
      if(S.qb.match){
        // merge final scores
        const pls=Object.values(room.players||{});
        S.qb.match.players=pls.map(p=>({...p}));
      }
      S.view="qbResult";render(true);qbSaveBattle();
      return;
    }
    if(room.status==="playing"){
      const players=Object.values(room.players||{}).map(p=>({...p}));
      const idx=room.idx||0;
      if(!S.qb.match){
        S.qb.match={qs:room.qs,idx,sec:room.sec,deadline:room.sec?Date.now()+room.sec*1000:0,players,answered:false,pick:null,seed:room.seed};
        S.view="qbPlay";render(true);qbStartRound();
        return;
      }
      // sync scores from peers
      S.qb.match.players=players;
      // advance question if host bumped idx
      if(idx!==S.qb.match.idx){
        S.qb.match.idx=idx;
        S.qb.match.answered=false;
        S.qb.match.pick=null;
        players.forEach(p=>{p.ans=null});
        if(idx>=(room.qs||[]).length){
          S.view="qbResult";render(true);qbSaveBattle();return;
        }
        S.view="qbPlay";render(true);qbStartRound();
        return;
      }
      // just refresh HUD scores; host advances when all answered
      if(S.view==="qbPlay"){
        render();
        if(S.qb.room&&S.qb.room.host===S.user.uid){
          const humans=players.filter(p=>p.uid!=="bot");
          if(humans.length>=2 && humans.every(p=>p.ans!=null)){
            setTimeout(()=>qbTryAdvance(), 400);
          }
        }
      }
    }
  },err=>{console.error(err);toast("انقطع الاتصال بالغرفة — تأكد من قواعد Firebase")});
}
function qbStartRound(){
  clearInterval(window.__qbT);
  const m=S.qb&&S.qb.match;if(!m)return;
  m.answered=false;m.pick=null;
  if(m.sec)m.deadline=Date.now()+m.sec*1000;
  // bot schedules answer
  if(S.qb.mode==="bot"){
    const bot=m.players.find(p=>p.uid==="bot");
    const q=m.qs[m.idx];
    const {ms,willCorrect}=qbBotDelay(S.qb.diff);
    clearTimeout(window.__qbBot);
    window.__qbBot=setTimeout(()=>{
      if(!S.qb||!S.qb.match||S.qb.match.idx!==m.idx||m.answered)return;
      const choice=willCorrect?q.a:shuf(q.o.map((_,i)=>i).filter(i=>i!==q.a),mulberry(Date.now()))[0];
      qbApplyAnswer(bot, choice, false);
      render(true);
    },ms);
  }
  if(m.sec){
    window.__qbT=setInterval(()=>{
      if(!S.qb||!S.qb.match){clearInterval(window.__qbT);return}
      const left=Math.max(0,S.qb.match.deadline-Date.now());
      const el=$("#qbSec"),bar=$("#qbBar");
      if(el)el.textContent=Math.ceil(left/1000)+"ث";
      if(bar){bar.style.width=(left/(S.qb.match.sec*1000)*100)+"%";bar.parentElement.classList.toggle("low",left<=5000)}
      if(left<=0){clearInterval(window.__qbT);qbOnAnswer(-1)}
    },200);
  }
}
function qbOnAnswer(choice){
  const m=S.qb&&S.qb.match;if(!m||m.answered)return;
  const me=m.players.find(p=>p.uid===S.user.uid);if(!me)return;
  m.answered=true;m.pick=choice;
  qbApplyAnswer(me, choice, true);
  // friends mode: push answer to room so peer sees scores
  if(S.qb.mode==="friends"&&S.qb.roomCode){
    const code=S.qb.roomCode;
    const patch={
      [`players.${S.user.uid}.score`]:me.score,
      [`players.${S.user.uid}.correct`]:me.correct,
      [`players.${S.user.uid}.wrong`]:me.wrong,
      [`players.${S.user.uid}.streak`]:me.streak,
      [`players.${S.user.uid}.bestStreak`]:me.bestStreak||0,
      [`players.${S.user.uid}.ans`]:choice,
      [`players.${S.user.uid}.ansAt`]:Date.now()
    };
    updateDoc(doc(db,"qb_rooms",code),patch).catch(()=>{});
  }
  render(true);
  setTimeout(()=>{
    const opts=document.querySelectorAll(".qb-opt");
    const q=m.qs[m.idx];
    opts.forEach((el,j)=>{
      el.disabled=true;
      if(j===q.a)el.classList.add("right");
      else if(j===choice&&choice!==q.a)el.classList.add("wrong");
    });
  },30);
  if(S.qb.mode==="bot"){
    setTimeout(qbNext, choice===m.qs[m.idx].a?900:1200);
  } else {
    // friends: wait for both answers or timer, host advances
    setTimeout(()=>qbTryAdvance(), 600);
  }
}
function qbTryAdvance(){
  const g=S.qb;if(!g||!g.match||g.mode!=="friends")return;
  if(!g.room||g.room.host!==S.user.uid)return;
  const m=g.match;
  const humans=m.players.filter(p=>p.uid!=="bot");
  // need at least 2 players and all have answered this round
  if(humans.length<2)return;
  if(!humans.every(p=>p.ans!=null))return;
  if(m._advancing)return;
  m._advancing=true;
  const code=g.roomCode;
  const clear={idx:(m.idx+1)};
  humans.forEach(p=>{clear[`players.${p.uid}.ans`]=null});
  if(m.idx+1>=m.qs.length)clear.status="done";
  updateDoc(doc(db,"qb_rooms",code),clear)
    .then(()=>{m._advancing=false})
    .catch(e=>{m._advancing=false;toast("تعذر الانتقال للسؤال التالي");console.error(e)});
}
function qbApplyAnswer(player, choice, isHuman){
  const m=S.qb.match,q=m.qs[m.idx];
  const correct=choice===q.a;
  // speed bonus only for human first answer timing
  let pts=0;
  if(correct){
    pts=10;
    if(isHuman&&m.sec&&m.deadline){
      const remain=(m.deadline-Date.now())/(m.sec*1000);
      if(remain>0.66)pts+=3; else if(remain>0.33)pts+=2; else if(remain>0)pts+=1;
    }
    player.streak=(player.streak||0)+1;
    player.bestStreak=Math.max(player.bestStreak||0,player.streak);
    if(player.streak>=10)pts*=5; else if(player.streak>=5)pts*=3; else if(player.streak>=3)pts*=2;
    player.correct=(player.correct||0)+1;
    player.score=(player.score||0)+pts;
    if(isHuman&&navigator.vibrate)navigator.vibrate(12);
  }else{
    player.streak=0;
    player.wrong=(player.wrong||0)+1;
    if(isHuman&&navigator.vibrate)navigator.vibrate([30,40,30]);
  }
}

function examDraftKey(c){return c?("draft_"+c.sid):null}
function examSessionKey(uid){return "exam_session_"+uid}
function persistExamSession(c){
  if(!c||!S.user||c.done)return;
  try{
    localStorage.setItem(examSessionKey(S.user.uid), JSON.stringify({
      sid:c.sid, examId:c.exam.id, n:c.n, endAt:c.endAt||0, seed:c.st.seed, t:c.st.t, tabs:c.tabs||0
    }));
  }catch(_){}
}
function clearExamSession(){
  try{if(S.user)localStorage.removeItem(examSessionKey(S.user.uid))}catch(_){}
}
async function tryResumeExam(){
  if(!S.user||S.isAdmin||S.cur)return;
  let raw;try{raw=localStorage.getItem(examSessionKey(S.user.uid))}catch(_){return}
  if(!raw)return;
  let meta;try{meta=JSON.parse(raw)}catch(_){clearExamSession();return}
  if(!meta||!meta.sid||!meta.examId){clearExamSession();return}
  // already submitted?
  if((S.attempts[meta.examId]||[]).some(r=>(r.attempt||1)===meta.n||r.id===meta.sid)){
    clearExamSession();clearExamDraft({sid:meta.sid});return;
  }
  const e=S.exams.find(x=>x.id===meta.examId);
  if(!e||!vis(e)){clearExamSession();return}
  try{
    const g=await getDoc(doc(db,"starts",meta.sid));
    if(!g.exists()){clearExamSession();clearExamDraft({sid:meta.sid});return}
    const st=g.data();
    // always recompute endAt from original start time so pause doesn't freeze the clock
    const endAt=e.minutes?(st.t+e.minutes*60000):0;
    if(endAt&&Date.now()>=endAt+90000){ // grace 90 sec after official end
      clearExamSession();
      toast("وقت الامتحان خلص وما عادش ينفع استئناف");
      return;
    }
    S.cur={exam:e,n:meta.n,sid:meta.sid,st,endAt,done:false,busy:false,away:false,pausing:false,tabs:meta.tabs||0,answered:st.answered||0,order:buildOrder(e,st.seed||meta.seed)};
    S.view="exam";render(true);
    setTimeout(loadExamDraft, 100);
    clearInterval(timer);clearInterval(hb);timer=null;hb=null;
    hb=setInterval(()=>liveUpdate({answered:S.cur?S.cur.answered:0,away:S.cur?S.cur.away:false}),60000);
    liveUpdate({away:false});
    if(endAt){
      if(Date.now()>=endAt){
        // time already over — auto submit after short moment so draft loads first
        setTimeout(()=>{if(S.cur&&!S.cur.done){toast("خلص الوقت — بنسلّم…");submitExam(true)}},600);
      }else{
        tick();timer=setInterval(tick,1000);
      }
    }
    toast("كمّلنا الامتحان من حيث وقفت ✓");
    persistExamSession(S.cur);
  }catch(err){console.error(err);toast("فشل الاستئناف — جرّب تاني")}
}
function readExamAnsFromDOM(){
  const c=S.cur;if(!c)return[];
  return c.exam.questions.map((q,i)=>{
    if(q.essay){const ta=document.querySelector(`textarea[name=q${i}]`);return ta?ta.value:""}
    const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1;
  });
}
function saveExamDraft(){
  const c=S.cur;if(!c||c.done)return;
  try{
    const ans=readExamAnsFromDOM();
    c.draftAns=ans;
    localStorage.setItem(examDraftKey(c), JSON.stringify({ans,t:Date.now(),examId:c.exam.id,n:c.n}));
    persistExamSession(c);
  }catch(_){}
}
function loadExamDraft(){
  const c=S.cur;if(!c)return;
  try{
    let ans=c.draftAns;
    if(!ans){
      const raw=localStorage.getItem(examDraftKey(c));if(!raw)return;
      const data=JSON.parse(raw);ans=data.ans;
    }
    if(!Array.isArray(ans))return;
    c.draftAns=ans;
    ans.forEach((a,i)=>{
      const q=c.exam.questions[i];if(!q)return;
      if(q.essay){const ta=document.querySelector(`textarea[name=q${i}]`);if(ta&&a)ta.value=a}
      else if(a!=null&&a>=0){const el=document.querySelector(`input[name=q${i}][value="${a}"]`);if(el)el.checked=true}
    });
    updProg();
    toast("تم استرجاع إجاباتك — كمّل من حيث وقفت ✓");
  }catch(_){}
}
function peekExamSession(){
  if(!S.user)return null;
  try{
    const raw=localStorage.getItem(examSessionKey(S.user.uid));if(!raw)return null;
    const meta=JSON.parse(raw);if(!meta||!meta.examId)return null;
    if((S.attempts[meta.examId]||[]).some(r=>(r.attempt||1)===meta.n||r.id===meta.sid))return null;
    return meta;
  }catch(_){return null}
}
function clearExamDraft(c){try{if(c)localStorage.removeItem(examDraftKey(c))}catch(_){}}
function updProg(){
  const c=S.cur;if(!c)return;
  const g=c.exam.questions.map((q,i)=>q.fun?null:i).filter(i=>i!==null);
  const done=g.filter(i=>{
    const q=c.exam.questions[i];
    if(q.essay){const ta=document.querySelector(`textarea[name=q${i}]`);return ta&&ta.value.trim()}
    return !!document.querySelector(`input[name=q${i}]:checked`);
  }).length;
  const el=$("#pg");if(el)el.style.width=(g.length?done/g.length*100:0)+"%";
  c.answered=done;clearTimeout(ansT);ansT=setTimeout(()=>{liveUpdate({answered:done});saveExamDraft()},4000);
  clearTimeout(window.__draftT);window.__draftT=setTimeout(saveExamDraft,1500);
}
function liveUpdate(extra){

async function submitExam(auto){
  const c=S.cur;if(!c||c.done)return;
  const e=c.exam;
  const ans=e.questions.map((q,i)=>{
    if(q.essay){const ta=document.querySelector(`textarea[name=q${i}]`);return ta?ta.value.trim():""}
    const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1
  });
  if(!auto&&ans.some((a,i)=>{
    const q=e.questions[i];if(q.fun)return false;
    if(q.essay)return !a||!String(a).trim();
    return a===-1;
  })){
    c.busy=true;const ok=confirm("في أسئلة لسه ما جاوبتش عليها. تسلّم برضه؟");setTimeout(()=>{c.busy=false},800);
    if(!ok)return;
  }
  c.done=true;clearInterval(timer);clearInterval(hb);clearTimeout(ansT);
  let scoreRaw=0;
  e.questions.forEach((q,i)=>{
    if(q.fun)return;
    if(q.essay) scoreRaw += essayScore(ans[i], q.model);
    else if(ans[i]===q.a) scoreRaw += 1;
  });
  const score=Math.round(scoreRaw*100)/100, total=gcount(e);
  const btn=$("#sub");if(btn)btn.disabled=true;
  const rec={uid:S.user.uid,examId:e.id,examTitle:e.title,subject:e.subject,name:S.profile.name,phone:S.profile.phone,attempt:c.n,
    score,total,passMark:e.passMark||0,passed:e.passMark>0?score>=e.passMark:null,ans,secs:Math.round((Date.now()-c.st.t)/1000),tabs:c.tabs};
  try{
    await setDoc(doc(db,"results",c.sid),{...rec,createdAt:serverTimestamp()});
  }catch(err){
    c.done=false;if(btn)btn.disabled=false;
    console.error("submitExam",err);
    const code=(err&&err.code)||"";
    if(code.includes("permission-denied"))toast("مفيش صلاحية لتسجيل النتيجة — تأكد إن قواعد Firestore محدّثة وإن المحاولة 1 أو 2");
    else if(code.includes("unavailable")||code.includes("network"))toast("مفيش نت كويس — دوس تسليم تاني");
    else toast("مقدرتش أسجّل النتيجة. اتأكد من النت ودوس تسليم تاني.");
    return;
  }
  deleteDoc(doc(db,"starts",c.sid)).catch(()=>{});
  clearExamDraft(c);
  clearExamSession();
  logActivity("exam_submit", (e.title||"")+" · "+score+"/"+total);
  // XP
  (async()=>{
    let amt=20;
    if(total&&score===total)amt+=15;
    else if(total&&score/total>=0.8)amt+=8;
    const first=!(S.attempts[e.id]&&S.attempts[e.id].length);
    await addXP(amt, score===total?"exam_full":(first?"first_exam":"exam"));
  })();
  S.attempts[e.id]=(S.attempts[e.id]||[]).concat([{...rec,id:c.sid}]);
  S.last={...rec,id:c.sid};S.cur=null;S.view="result";render(true);
  try{
    const all=[...Object.values(S.attempts).flat()];
    const byExam={};
    all.forEach(r=>{if(!r.examId)return;const prev=byExam[r.examId];if(!prev||(r.score/Math.max(r.total,1))>(prev.score/Math.max(prev.total,1)))byExam[r.examId]=r});
    const list=Object.values(byExam);
    const examsDone=list.length,totalScore=list.reduce((s,r)=>s+(r.score||0),0),totalQ=list.reduce((s,r)=>s+(r.total||0),0);
    setDoc(doc(db,"leaderboard",S.user.uid),{uid:S.user.uid,name:S.profile.name,phone:S.profile.phone,examsDone,totalScore,totalQ,pct:totalQ?Math.round(totalScore/totalQ*100):0,updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
  }catch(_){}
}
function runResult(){
  const r=S.last,fg=$("#fg"),sc=$("#sc");if(!fg||!sc)return;
  fg.style.strokeDashoffset=339.3;sc.textContent="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=339.3*(1-(r.total?r.score/r.total:0))}));
  const t0=performance.now();
  (function step(n){const p=Math.min(1,(n-t0)/1000);sc.textContent=Math.round(r.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
  if(pctOf(r)>=90&&!matchMedia("(prefers-reduced-motion: reduce)").matches)confetti();
}
function confetti(){
  const cols=["#E3A81C","#2FB5A8","#4F46E5","#ef4444","#22c55e","#f97316"];
  const w=document.createElement("div");w.className="conf";

  document.body.appendChild(w);setTimeout(()=>w.remove(),5200);
}

/* ---------- شاشة الافتتاح ---------- */
(function(){
  const SPLASH_MS = 2400;
  const el = document.getElementById("splash");
  if(!el) return;
  const start = performance.now();
  let done = false;
  function finish(){
    if(done) return; done = true;
    const left = Math.max(0, SPLASH_MS - (performance.now() - start));
    setTimeout(()=>{
      el.classList.add("hide");
      setTimeout(()=>{ try{el.remove()}catch(_){} }, 600);
    }, left);
  }
  setTimeout(finish, SPLASH_MS + 600);
  const appEl = document.getElementById("app");
  if(appEl){
    const mo = new MutationObserver(()=>{
      const t = appEl.textContent || "";
      if(t && !t.includes("جاري التحميل")){
        mo.disconnect();
        const minShow = 1200;
        setTimeout(finish, Math.max(0, minShow - (performance.now() - start)));
      }
    });
    mo.observe(appEl, {childList:true, subtree:true});
  }
})();
