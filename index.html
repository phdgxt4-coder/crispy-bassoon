<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التفوق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F1;--card:#fff;--ink:#12302D;--mut:#5B726F;--pri:#0B5D57;--pri2:#084a45;--onpri:#fff;--gold:#E3A81C;--line:#D5E0DE;--sel:#e3efed;--ok:#157F3B;--bad:#B42318;--gbg:#dcf3e3;--rbg:#fde8e6;--ybg:#fff3cf;--yfg:#7a5700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A19;--card:#152826;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a}}
:root[data-theme="dark"]{--bg:#0E1A19;--card:#152826;--ink:#E6F1EF;--mut:#8FA9A5;--pri:#2FB5A8;--pri2:#4cc7ba;--onpri:#04201D;--gold:#F0B93A;--line:#244240;--sel:#1b3836;--ok:#4cd081;--bad:#ff8a80;--gbg:#183d2a;--rbg:#4a1f1b;--ybg:#3f3210;--yfg:#f0d27a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-text-size-adjust:100%;transition:background-color .35s,color .35s}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 100px}
.wrap.wide{max-width:1000px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.logo{font-family:'Reem Kufi',sans-serif;font-size:30px;font-weight:700;color:var(--pri);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:9px;user-select:none;-webkit-user-select:none;transition:color .35s}
.tg{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;transition:transform .5s cubic-bezier(.3,1.4,.5,1),background-color .35s,border-color .35s}
.tg.spin{transform:rotate(360deg)}
h1,h2,h3{margin:0 0 8px;line-height:1.4}h2{font-size:20px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;transition:background-color .35s,border-color .35s}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--pri);color:var(--onpri);cursor:pointer;min-height:44px;transition:transform .15s,background-color .2s}
.btn:hover{background:var(--pri2)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost:hover{background:var(--sel)}
.btn.danger{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:#2b2000}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=tel],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
input.ltr{direction:ltr;text-align:right}
textarea{min-height:320px;line-height:1.8;font-size:15px}
.err{background:var(--rbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px}
.warnbar{display:none;background:var(--rbg);color:var(--bad);border:1.5px solid var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);transition:background-color .2s}
.tab.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.badge{display:inline-block;background:var(--gold);color:#2b2000;border-radius:99px;padding:0 8px;font-size:13px;margin-inline-start:6px}
.screen{animation:enter .32s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{border:0;border-radius:18px;padding:18px 14px;color:#fff;text-align:start;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-height:128px;transition:transform .15s;animation:tile .45s cubic-bezier(.3,1.3,.5,1) both}
.subj:active{transform:scale(.96)}
.subj:nth-child(2){animation-delay:.06s}.subj:nth-child(3){animation-delay:.12s}.subj:nth-child(4){animation-delay:.18s}.subj:nth-child(5){animation-delay:.24s}.subj:nth-child(6){animation-delay:.3s}
@keyframes tile{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.subj .g{font-size:34px;font-weight:700;line-height:1.2;direction:ltr;text-align:right}
.subj b{font-size:19px}.subj small{opacity:.92}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sel);color:var(--pri)}
.pill.g{background:var(--gbg);color:var(--ok)}.pill.r{background:var(--rbg);color:var(--bad)}.pill.y{background:var(--ybg);color:var(--yfg)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;transition:background-color .35s}
.q .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:14px;font-weight:600;margin-inline-end:8px}
.q p{margin:0 0 10px;font-weight:500;white-space:pre-wrap}
.opt{display:block;position:relative;margin-top:8px}
.opt input{position:absolute;opacity:0}
.opt span{display:block;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .2s,background-color .2s}
.opt input:checked+span{border-color:var(--pri);background:var(--sel);font-weight:600;animation:pop .3s ease-out}
.opt input:focus-visible+span{outline:3px solid var(--gold)}
@keyframes pop{50%{transform:scale(1.03)}}
div.opt.right span{border-color:var(--ok);background:var(--gbg);cursor:default}
div.opt.wrong span{border-color:var(--bad);background:var(--rbg);cursor:default}
div.opt span{cursor:default}
.timer{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--onpri);border-radius:10px;padding:8px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:600}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--gold);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Reem Kufi',sans-serif;font-size:34px;color:var(--pri)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--sel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:26px;color:var(--pri);line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.bars i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--pri);min-height:3px;transition:height .6s cubic-bezier(.3,1,.4,1)}
.bars i.f{background:var(--mut)}
.hb{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.hb i{display:block;height:100%;border-radius:99px}
.center{text-align:center;padding-top:60px}
.big{font-family:'Reem Kufi',sans-serif;font-size:56px;color:var(--pri);line-height:1.2}
nav.bot{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);z-index:9;transition:background-color .35s}
nav.bot button{font:inherit;font-weight:600;flex:1;max-width:180px;border:0;border-radius:10px;padding:9px 6px;background:transparent;color:var(--mut);cursor:pointer;transition:background-color .2s,color .2s}
nav.bot button.on{background:var(--sel);color:var(--pri)}
#toast{position:fixed;inset-inline:12px;bottom:78px;max-width:460px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.gold{background:var(--gold);color:#2b2000;font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,onSnapshot,query,where,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ إعدادات Firebase ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCo99zGbGOJSw1p-rdy3bk9PSxzsINWkxQ",
  authDomain: "eltafawoq-8b700.firebaseapp.com",
  projectId: "eltafawoq-8b700",
  storageBucket: "eltafawoq-8b700.firebasestorage.app",
  messagingSenderId: "892405720236",
  appId: "1:892405720236:web:734c19429b8ee8e292eb09"
};
/* ========================================== */

const ADMIN_EMAIL = "01061572071@eltafawoq.app";   // لازم يطابق الإيميل في Firebase وفي ملف الـ rules
const DOMAIN = "@eltafawoq.app";
const MAX_ATTEMPTS = 2;
const SUBJECTS = [
  {id:"arabic",name:"عربي",g:"أ ب",c:"#B91C1C"},
  {id:"science",name:"علوم",g:"H₂O",c:"#0E7490"},
  {id:"history",name:"تاريخ",g:"م",c:"#A16207"},
  {id:"english",name:"إنجليزي",g:"Aa",c:"#1D4ED8"},
  {id:"philosophy",name:"فلسفة",g:"؟",c:"#6D28D9"},
  {id:"math",name:"رياضيات",g:"π",c:"#15803D"}
];
const subName = id => (SUBJECTS.find(s=>s.id===id)||{name:id}).name;
const subColor = id => (SUBJECTS.find(s=>s.id===id)||{c:"#0B5D57"}).c;

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dur = s => s==null?"-":Math.floor(s/60)+":"+pad(s%60);
const pctOf = r => r.total?Math.round(r.score/r.total*100):0;
const gcount = e => e.questions.filter(q=>!q.fun).length;
const norm = s => String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g,"");
const fmt = ts => ts&&ts.toDate ? ts.toDate().toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}) : "";
const tms = r => r.createdAt&&r.createdAt.seconds?r.createdAt.seconds:0;
const pill = (t,c) => `<span class="pill ${c||""}">${t}</span>`;
const passPill = r => r.passMark>0 ? (r.passed?pill("ناجح","g"):pill("راسب","r")) : "";

const S = {user:null,isAdmin:false,profile:null,site:{maintenance:false,message:""},exams:[],results:[],students:[],alerts:[],
  myList:[],attempts:{},view:"loading",tab:"dash",subject:null,cur:null,last:null,review:null,studentId:null,editing:null,
  adminLogin:false,mode:"login",error:"",filter:"",unread:0,unreadAlerts:0,registering:false,taps:[]};
let subs=[],timer=null,db,auth,lastLeave=0;

const configured = !firebaseConfig.apiKey.startsWith("PASTE");
if(configured){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}

/* ---------- أدوات ---------- */
function toast(msg,gold){const t=$("#toast");t.textContent=msg;t.className=gold?"gold":"";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",gold?7000:3500)}
function updTitle(){const n=S.unread+S.unreadAlerts;document.title=(n?`(${n}) `:"")+"التفوق"}
function authErr(e){
  const c=e&&e.code||"";
  if(c.includes("email-already-in-use")) return "الرقم ده مسجل قبل كده. سجّل دخول بدل إنشاء حساب.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")||c.includes("invalid-email")) return "الرقم أو كلمة السر غلط.";
  if(c.includes("weak-password")) return "كلمة السر لازم تبقى 6 حروف أو أرقام على الأقل.";
  if(c.includes("network")) return "مفيش اتصال بالإنترنت. جرّب تاني.";
  if(c.includes("too-many")) return "محاولات كتير. استنى شوية وجرّب تاني.";
  return "حصلت مشكلة. جرّب تاني.";
}
function stopSubs(){subs.forEach(u=>u());subs=[]}

/* ---------- الوضع الليلي ---------- */
const isDark = () => document.documentElement.dataset.theme==="dark";
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(e){}document.querySelectorAll(".tg").forEach(b=>b.textContent=t==="dark"?"☀":"☾")}
{let sv;try{sv=localStorage.getItem("theme")}catch(e){}
 setTheme(sv||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}
const themeBtn = () => `<button class="tg" data-act="theme" aria-label="تبديل الوضع الليلي">${isDark()?"☀":"☾"}</button>`;

/* ---------- تحويل نص الأسئلة ---------- */
const LET={"أ":0,"ا":0,"a":0,"1":0,"ب":1,"b":1,"2":1,"ج":2,"c":2,"3":2,"د":3,"d":3,"4":3};
const LETTERS=["أ","ب","ج","د"];
function parseQs(t){
  const qs=[],errors=[];
  t.replace(/\r/g,"").trim().split(/\n\s*\n/).filter(b=>b.trim()).forEach((blk,i)=>{
    const lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    const q=[],o=[];let a,fun=false;
    for(const l of lines){
      if(/^\[(?:ترفيه|fun)\]$/i.test(l)){fun=true;continue}
      let m=l.match(/^(?:الإجابة|الاجابة|الجواب|answer|ans)\s*[:：\-]\s*(.+)$/i);
      if(m){a=LET[m[1].trim().toLowerCase().charAt(0)];continue}
      m=l.match(/^([أابجدa-dA-D1-4])\s*[\)\.\-–]\s*(.+)$/);
      if(m&&LET[m[1].toLowerCase()]===o.length){o.push(m[2].trim());continue}
      if(!o.length)q.push(l);else errors.push(`سؤال ${i+1}: سطر مش مفهوم: "${l}"`);
    }
    if(!q.length)errors.push(`سؤال ${i+1}: نص السؤال ناقص`);
    else if(o.length<2||o.length>4)errors.push(`سؤال ${i+1}: لازم من 2 إلى 4 اختيارات (أ ب ج د)`);
    else if(a===undefined||a>=o.length)errors.push(`سؤال ${i+1}: سطر "الإجابة: ب" ناقص أو غلط`);
    else qs.push(fun?{q:q.join("\n"),o,a,fun:true}:{q:q.join("\n"),o,a});
  });
  return {qs,errors};
}
const serialize = qs => qs.map(x=>x.q+"\n"+x.o.map((t,i)=>`${LETTERS[i]}) ${t}`).join("\n")+`\nالإجابة: ${LETTERS[x.a]}`+(x.fun?"\n[ترفيه]":"")).join("\n\n");
const SAMPLE=`عاصمة مصر هي؟
أ) الإسكندرية
ب) القاهرة
ج) أسوان
د) طنطا
الإجابة: ب

ما ناتج 7 × 8؟
أ) 54
ب) 56
ج) 58
د) 64
الإجابة: ب`;

/* ---------- ترتيب عشوائي ثابت لكل محاولة ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildOrder(e,seed){
  const rnd=mulberry(seed),on=e.shuffle!==false;
  const idx=e.questions.map((_,i)=>i);
  const g=idx.filter(i=>!e.questions[i].fun),f=idx.filter(i=>e.questions[i].fun);
  return (on?shuf(g,rnd):g).concat(f).map(i=>({i,o:on?shuf(e.questions[i].o.map((_,j)=>j),rnd):e.questions[i].o.map((_,j)=>j)}));
}

/* ---------- إحصائيات الأدمن ---------- */
function stats(){
  const R=S.results.filter(r=>r.total>0);
  const avg=a=>a.length?Math.round(a.reduce((s,r)=>s+pctOf(r),0)/a.length):0;
  const wp=R.filter(r=>r.passMark>0);
  const per=S.exams.map(e=>{const rs=R.filter(r=>r.examId===e.id),w=rs.filter(r=>r.passMark>0);
    return {e,n:rs.length,avg:avg(rs),pass:w.length?Math.round(w.filter(r=>r.passed).length/w.length*100):null}});
  const qm={};
  R.forEach(r=>{const e=S.exams.find(x=>x.id===r.examId);if(!e||!r.ans)return;
    e.questions.forEach((q,i)=>{if(q.fun)return;const k=e.id+"#"+i;const m=qm[k]||(qm[k]={q:q.q,exam:e.title,n:0,c:0});m.n++;if(r.ans[i]===q.a)m.c++})});
  const ql=Object.values(qm).filter(m=>m.n>=3).map(m=>({...m,p:Math.round(m.c/m.n*100)})).sort((a,b)=>a.p-b.p);
  return {R,avg:avg(R),passRate:wp.length?Math.round(wp.filter(r=>r.passed).length/wp.length*100):null,per,hard:ql.slice(0,3),easy:ql.slice(-3).reverse()};
}

/* ---------- الجلسة والاشتراكات ---------- */
function groupAttempts(list){
  const m={};list.forEach(r=>{(m[r.examId]=m[r.examId]||[]).push(r)});
  Object.values(m).forEach(a=>a.sort((x,y)=>(x.attempt||1)-(y.attempt||1)));
  return m;
}
async function startSession(u){
  stopSubs();
  S.user=u;S.isAdmin=u.email===ADMIN_EMAIL;S.adminLogin=false;S.error="";
  try{
    if(S.isAdmin){
      S.view="admin";S.tab="dash";
      let f1=true,f2=true;
      subs.push(onSnapshot(collection(db,"exams"),s=>{S.exams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"results"),orderBy("createdAt","desc")),s=>{
        if(!f1)s.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().createdAt){const r=c.doc.data();toast(`${r.name} امتحن ${r.examTitle} (محاولة ${r.attempt||1}) وجاب ${r.score}/${r.total}`,true);if(S.tab!=="results"){S.unread++;updTitle()}}});
        f1=false;S.results=s.docs.map(d=>({id:d.id,...d.data()}));render();
      }));
      subs.push(onSnapshot(collection(db,"students"),s=>{S.students=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"alerts"),orderBy("createdAt","desc"),limit(200)),s=>{
        if(!f2)s.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().createdAt){const a=c.doc.data();toast(`⚠ ${a.name} (${a.phone}) خرج من الامتحان: ${a.examTitle}`,true);if(S.tab!=="alerts"){S.unreadAlerts++;updTitle()}}});
        f2=false;S.alerts=s.docs.map(d=>({id:d.id,...d.data()}));render();
      }));
    }else{
      const p=await getDoc(doc(db,"students",u.uid));
      S.profile=p.exists()?p.data():{name:"طالب",phone:""};
      S.view="home";
      subs.push(onSnapshot(collection(db,"exams"),s=>{S.exams=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.published).sort((a,b)=>tms(b)-tms(a));render()}));
      subs.push(onSnapshot(query(collection(db,"results"),where("uid","==",u.uid)),s=>{
        S.myList=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(a)-tms(b));S.attempts=groupAttempts(S.myList);render();
      }));
    }
  }catch(e){S.site={maintenance:true,message:"في مشكلة مؤقتة في التحميل. جرّب بعد شوية."}}
  render(true);
}

if(configured){
  onSnapshot(doc(db,"config","site"),s=>{
    const d=s.exists()?s.data():{};
    const was=S.site.maintenance;
    S.site={maintenance:!!d.maintenance,message:d.message||""};
    if(S.view==="loading")return;
    if(was!==S.site.maintenance||S.view==="admin")render();
  },()=>{S.site={maintenance:true,message:"في مشكلة مؤقتة. جرّب بعد شوية."};render()});
  onAuthStateChanged(auth,u=>{
    if(S.registering)return;
    if(u)startSession(u);
    else{stopSubs();S.user=null;S.isAdmin=false;S.profile=null;S.myList=[];S.attempts={};S.view="auth";render(true)}
  });
}else{S.site={maintenance:true,message:"المنصة تحت التعديل."};S.view="auth"}

const app=$("#app");
function render(force){
  if(!force&&(S.view==="exam"||S.view==="editExam"))return;
  if(S.view!=="exam")clearInterval(timer);
  let h;
  if(S.view==="loading")h=`<div class="center mut">جاري التحميل…</div>`;
  else if(S.site.maintenance&&!S.isAdmin&&!S.adminLogin)h=maintenance();
  else if(!S.user)h=authView();
  else if(S.isAdmin){
    h=S.view==="editExam"?editor():S.view==="studentDetail"?studentDetail():S.view==="review"?reviewView():adminView();
  }else{
    const m={subject:subjectView,exam:examView,result:resultView,review:reviewView,progress:progressView};
    h=(m[S.view]||homeView)();
  }
  app.innerHTML=h;
  if(S.view==="result"&&!S.isAdmin&&S.user)runResult();
  if(S.view==="editExam")bindEditor();
}

<div class="stats"><div class="card stat"><b>${rs.length}</b><span class="mut">محاولة</span></div><div class="card stat"><b>${avg==null?"-":avg+"%"}</b><span class="mut">المتوسط</span></div><div class="card stat"><b>${w.length?w.filter(r=>r.passed).length+"/"+w.length:"-"}</b><span class="mut">نجاح</span></div><div class="card stat"><b>${rs.reduce((a,r)=>a+(r.tabs||0),0)}</b><span class="mut">مرات خروج</span></div></div>
${rs.length?`<div class="tw card" style="padding:0"><table><tr><th>الامتحان</th><th>المادة</th><th>م</th><th>الدرجة</th><th>%</th><th>النتيجة</th><th>الوقت</th><th>خروج</th><th>التاريخ</th><th></th></tr>
${rs.map(r=>`<tr><td>${esc(r.examTitle)}</td><td>${subName(r.subject)}</td><td>${r.attempt||1}</td><td><b>${r.score}/${r.total}</b></td><td>${pctOf(r)}%</td><td>${passPill(r)||"-"}</td><td>${dur(r.secs)}</td><td>${r.tabs?pill(r.tabs,"r"):0}</td><td>${fmt(r.createdAt)}</td><td><button class="btn ghost sm" data-act="reviewAdmin" data-id="${r.id}" data-back="studentDetail">شوف الحل</button></td></tr>`).join("")}</table></div>`:`<div class="card mut">الطالب ده لسه ما امتحنش.</div>`}</div>`}

<button class="btn ghost sm" data-act="csv">تصدير Excel (CSV)</button></div>

<p class="mut">زرار "حذف" بيمسح المحاولة دي ويرجّع للطالب محاولة.</p>`:`<div class="card mut">لسه مفيش حد امتحن.</div>`}`}

${S.alerts.length?`<div class="tw card" style="padding:0"><table><tr><th>الطالب</th><th>التليفون</th><th>الامتحان</th><th>م</th><th>المرة</th><th>الوقت</th></tr>
${S.alerts.map(a=>`<tr><td><a href="#" data-act="student" data-id="${a.uid}" style="color:var(--pri);font-weight:600">${esc(a.name)}</a></td><td dir="ltr">${esc(a.phone)}</td><td>${esc(a.examTitle)}</td><td>${a.attempt||1}</td><td>${pill(a.count,"r")}</td><td>${fmt(a.createdAt)}</td></tr>`).join("")}</table></div>`:`<div class="card mut">مفيش تنبيهات.</div>`}`}

function editor(){
  const e=S.editing.exam||{subject:"arabic",title:"",minutes:30,passMark:0,shuffle:true,published:true,showAnswers:true,questions:[]};
  const has=S.editing.id&&S.results.some(r=>r.examId===S.editing.id);

<label class="f" for="esub">المادة</label><select id="esub">${SUBJECTS.map(s=>`<option value="${s.id}" ${e.subject===s.id?"selected":""}>${s.name}</option>`).join("")}</select>

<label class="f" for="epass">درجة النجاح: عدد الإجابات الصح المطلوبة (0 = بدون)</label><input id="epass" type="number" min="0" value="${e.passMark||0}">
<label class="f"><input id="eshuf" type="checkbox" ${e.shuffle!==false?"checked":""}> ترتيب عشوائي للأسئلة والاختيارات لكل طالب</label>
<label class="f" style="margin-top:4px"><input id="epub" type="checkbox" ${e.published?"checked":""}> يظهر للطلاب</label>
<label class="f" style="margin-top:4px"><input id="eshow" type="checkbox" ${e.showAnswers!==false?"checked":""}> يشوف الطالب الإجابات الصحيحة بعد التسليم</label>
<label class="f" for="qtext">الأسئلة</label>
<p class="mut" style="margin:0 0 6px">اكتب كل سؤال وتحته الاختيارات (أ ب ج د) وبعدين سطر "الإجابة: ب". سيب سطر فاضي بين كل سؤال والتاني. لو سؤال للتسلية (مش في الدرجة) ضيف تحته سطر <b>[ترفيه]</b>. لو استخدمت الترتيب العشوائي متكتبش اختيارات زي "كل ما سبق".</p>
<textarea id="qtext" dir="auto">${esc(serialize(e.questions))}</textarea>
<div id="qinfo" class="mut" style="margin:6px 0"></div>
<div class="row" style="margin-top:12px"><button class="btn" id="sv">حفظ الامتحان</button><button type="button" class="btn ghost" data-act="sample">حط مثال</button></div></form></div>`}

/* ---------- الأفعال ---------- */
const A={
  theme(d,el){const t=isDark()?"light":"dark";document.querySelectorAll(".tg").forEach(b=>{b.classList.add("spin");setTimeout(()=>b.classList.remove("spin"),500)});setTheme(t)},
  mode(){S.mode=S.mode==="login"?"register":"login";S.error="";render(true)},
  logoTap(){const n=Date.now();S.taps=S.taps.filter(t=>n-t<2500);S.taps.push(n);if(S.taps.length>=3){S.taps=[];S.adminLogin=true;S.error="";render(true)}},
  studentLink(){S.adminLogin=false;S.error="";render(true)},
  async logout(){await signOut(auth)},
  home(){S.view="home";render(true)},
  progress(){S.view="progress";render(true)},
  openSubject(d){S.subject=d.id;S.view="subject";render(true)},
  reviewMine(d){const r=S.myList.find(x=>x.id===d.id);if(!r)return;S.review={r,back:d.back||"subject"};S.view="review";render(true)},
  reviewLast(){S.review={r:S.last,back:"result"};S.view="review";render(true)},
  reviewAdmin(d){const r=S.results.find(x=>x.id===d.id);if(!r)return;S.review={r,back:d.back||"admin"};S.view="review";render(true)},
  backReview(){S.view=S.review.back;render(true)},
  student(d){S.studentId=d.id;S.view="studentDetail";render(true)},
  backAdmin(){S.view="admin";render(true)},
  async start(d){
    const e=S.exams.find(x=>x.id===d.id),at=S.attempts[d.id]||[];
    if(!e)return;
    if(at.length>=MAX_ATTEMPTS){toast("خلصت محاولاتك على الامتحان ده");return}
    const n=at.length+1,sid=`${S.user.uid}_${e.id}_${n}`;
    let st;
    try{
      const g=await getDoc(doc(db,"starts",sid));
      if(g.exists())st=g.data();
      else{st={uid:S.user.uid,examId:e.id,n,t:Date.now(),seed:Math.floor(Math.random()*2147483647)};await setDoc(doc(db,"starts",sid),st)}
    }catch(err){toast("مقدرتش أبدأ الامتحان. اتأكد من النت وجرّب تاني.");return}
    const endAt=e.minutes?st.t+e.minutes*60000:0;
    S.cur={exam:e,n,sid,st,endAt,done:false,busy:false,tabs:0,order:buildOrder(e,st.seed)};
    S.view="exam";render(true);
    clearInterval(timer);
    if(endAt){tick();timer=setInterval(tick,1000)}
    if(endAt&&Date.now()>=endAt){toast("وقت الامتحان كان خلص.");submitExam(true)}
  },
  submit(){submitExam(false)},
  tab(d){S.tab=d.id;if(d.id==="results")S.unread=0;if(d.id==="alerts")S.unreadAlerts=0;updTitle();render(true)},
  filter(d,el){S.filter=el.value;render(true)},
  newExam(){S.editing={id:null,exam:null};S.view="editExam";render(true)},
  editExam(d){S.editing={id:d.id,exam:S.exams.find(e=>e.id===d.id)};S.view="editExam";render(true)},
  cancelEdit(){S.view="admin";render(true)},
  sample(){$("#qtext").value=SAMPLE;checkQs()},
  async saveExam(){
    const {qs,errors}=parseQs($("#qtext").value);
    if(errors.length||!qs.length){toast(errors[0]||"اكتب سؤال واحد على الأقل");return}
    const data={subject:$("#esub").value,title:$("#etitle").value.trim(),minutes:Math.max(0,+$("#emin").value||0),passMark:Math.max(0,+$("#epass").value||0),shuffle:$("#eshuf").checked,published:$("#epub").checked,showAnswers:$("#eshow").checked,questions:qs};
    if(!data.title){toast("اكتب اسم الامتحان");return}
    if(data.passMark>qs.filter(q=>!q.fun).length){toast("درجة النجاح أكبر من عدد الأسئلة");return}
    $("#sv").disabled=true;
    try{
      if(S.editing.id)await updateDoc(doc(db,"exams",S.editing.id),data);
      else await addDoc(collection(db,"exams"),{...data,createdAt:serverTimestamp()});
      S.view="admin";S.tab="exams";render(true);toast("اتحفظ الامتحان");
    }catch(e){$("#sv").disabled=false;toast("مقدرتش أحفظ. اتأكد من الاتصال والـ rules.")}
  },
  async togglePub(d){const e=S.exams.find(x=>x.id===d.id);await updateDoc(doc(db,"exams",d.id),{published:!e.published})},
  async delExam(d){if(confirm("تمسح الامتحان ده؟ مش هتقدر ترجعه."))await deleteDoc(doc(db,"exams",d.id))},
  async delResult(d){if(confirm("تمسح المحاولة دي؟ الطالب هيرجعله محاولة."))await deleteDoc(doc(db,"results",d.id))},
  csv(){
    const rows=S.results.filter(r=>!S.filter||r.examId===S.filter);
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const csv="\ufeff"+["الاسم,التليفون,المادة,الامتحان,المحاولة,الدرجة,من,النتيجة,الوقت بالثواني,مرات الخروج,التاريخ",
      ...rows.map(r=>[r.name,r.phone,subName(r.subject),r.examTitle,r.attempt||1,r.score,r.total,r.passMark>0?(r.passed?"ناجح":"راسب"):"",r.secs??"",r.tabs||0,fmt(r.createdAt)].map(q).join(","))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="results.csv";a.click();
  },
  async toggleMaint(){
    const on=!S.site.maintenance;
    if(on&&!confirm("تشغّل وضع الصيانة؟ الطلاب مش هيقدروا يدخلوا."))return;
    try{await setDoc(doc(db,"config","site"),{maintenance:on,message:$("#mmsg").value.trim()});toast(on?"وضع الصيانة شغّال":"المنصة رجعت للطلاب")}catch(e){toast("مقدرتش أحفظ")}
  },
  async saveMsg(){try{await setDoc(doc(db,"config","site"),{maintenance:S.site.maintenance,message:$("#mmsg").value.trim()});toast("اتحفظت الرسالة")}catch(e){toast("مقدرتش أحفظ")}},
  async doLogin(){
    if(!configured){S.error="المنصة تحت التعديل.";render(true);return}
    const idv=norm($("#id").value),pw=$("#pw").value;
    $("#go").disabled=true;S.error="";
    try{await signInWithEmailAndPassword(auth,idv+DOMAIN,pw)}catch(e){S.error=authErr(e);render(true)}
  },
  async doRegister(){
    if(!configured){S.error="المنصة تحت التعديل.";render(true);return}
    const name=$("#nm").value.trim().replace(/\s+/g," "),phone=norm($("#id").value),pw=$("#pw").value;
    if(name.length<3)return fail("اكتب اسمك بالكامل.");
    if(!/^01[0-9]{9}$/.test(phone))return fail("رقم التليفون لازم يبقى 11 رقم ويبدأ بـ 01.");
    if(pw.length<6)return fail("كلمة السر لازم تبقى 6 حروف أو أرقام على الأقل.");
    $("#go").disabled=true;S.error="";S.registering=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,phone+DOMAIN,pw);
      try{await setDoc(doc(db,"students",c.user.uid),{name,phone,createdAt:serverTimestamp()})}catch(_){}
      S.registering=false;await startSession(c.user);
    }catch(e){S.registering=false;S.error=authErr(e);render(true)}
  }
};
function fail(m){S.error=m;render(true)}

/* ---------- الامتحان ---------- */
function tick(){
  const el=$("#timer");if(!el||!S.cur||!S.cur.endAt)return;
  const left=Math.max(0,Math.round((S.cur.endAt-Date.now())/1000));
  el.textContent=dur(left);
  if(left<=0){clearInterval(timer);submitExam(true)}
}
function updProg(){
  const c=S.cur;if(!c)return;
  const g=c.exam.questions.map((q,i)=>q.fun?null:i).filter(i=>i!==null);
  const done=g.filter(i=>document.querySelector(`input[name=q${i}]:checked`)).length;
  const el=$("#pg");if(el)el.style.width=(g.length?done/g.length*100:0)+"%";
}
async function submitExam(auto){
  const c=S.cur;if(!c||c.done)return;
  const e=c.exam;
  const ans=e.questions.map((_,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});
  if(!auto&&ans.some((a,i)=>a===-1&&!e.questions[i].fun)){
    c.busy=true;const ok=confirm("في أسئلة لسه ما جاوبتش عليها. تسلّم برضه؟");setTimeout(()=>{c.busy=false},800);
    if(!ok)return;
  }
  c.done=true;clearInterval(timer);
  const score=ans.filter((a,i)=>!e.questions[i].fun&&a===e.questions[i].a).length,total=gcount(e);
  const btn=$("#sub");if(btn)btn.disabled=true;
  const rec={uid:S.user.uid,examId:e.id,examTitle:e.title,subject:e.subject,name:S.profile.name,phone:S.profile.phone,attempt:c.n,
    score,total,passMark:e.passMark||0,passed:e.passMark>0?score>=e.passMark:null,ans,secs:Math.round((Date.now()-c.st.t)/1000),tabs:c.tabs};
  try{
    await setDoc(doc(db,"results",c.sid),{...rec,createdAt:serverTimestamp()});
  }catch(err){c.done=false;if(btn)btn.disabled=false;toast("مقدرتش أسجّل النتيجة. اتأكد من النت ودوس تسليم تاني.");return}
  deleteDoc(doc(db,"starts",c.sid)).catch(()=>{});
  S.attempts[e.id]=(S.attempts[e.id]||[]).concat([{...rec,id:c.sid}]);
  S.last={...rec,id:c.sid};S.cur=null;S.view="result";render(true);
}
function runResult(){
  const r=S.last,fg=$("#fg"),sc=$("#sc");if(!fg||!sc)return;
  fg.style.strokeDashoffset=339.3;sc.textContent="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fg.style.strokeDashoffset=339.3*(1-(r.total?r.score/r.total:0))}));
  const t0=performance.now();
  (function step(n){const p=Math.min(1,(n-t0)/1000);sc.textContent=Math.round(r.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})(t0);
}

/* ---------- كشف الخروج من الامتحان ---------- */
function leave(){
  const c=S.cur;if(S.view!=="exam"||!c||c.done||c.busy)return;
  const n=Date.now();if(n-lastLeave<1500)return;lastLeave=n;
  c.tabs++;
  const w=$("#warn");if(w){w.style.display="block";w.textContent=`⚠ تم تسجيل خروجك من الامتحان (${c.tabs}) وإبلاغ المدرس.`}
  if(c.tabs<=10)addDoc(collection(db,"alerts"),{uid:S.user.uid,name:S.profile.name,phone:S.profile.phone,examId:c.exam.id,examTitle:c.exam.title,attempt:c.n,count:c.tabs,createdAt:serverTimestamp()}).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)leave()});
window.addEventListener("blur",leave);

/* ---------- المحرر ---------- */
function checkQs(){
  const el=$("#qinfo");if(!el)return;
  const {qs,errors}=parseQs($("#qtext").value);
  const f=qs.filter(q=>q.fun).length;
  el.innerHTML=`${qs.length-f} سؤال سليم${f?` + ${f} للتسلية`:""}`+(errors.length?` <span style="color:var(--bad)">· ${esc(errors[0])}${errors.length>1?` (+${errors.length-1} أخطاء)`:""}</span>`:"");
}
function bindEditor(){const t=$("#qtext");if(t){t.addEventListener("input",checkQs);checkQs()}}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;e.preventDefault();A[b.dataset.act]?.(b.dataset,b)});
document.addEventListener("change",e=>{
  const c=e.target.dataset&&e.target.dataset.change;if(c)A[c]?.(e.target.dataset,e.target);
  if(e.target.type==="radio"&&S.view==="exam")updProg();
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.submit;if(f)A[f]?.()});

if(!configured)render(true);
</script>
