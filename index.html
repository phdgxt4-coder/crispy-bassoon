async function tryResumeExam(){
  if(!S.user||S.isAdmin||S.cur)return;
  let raw;try{raw=localStorage.getItem(examSessionKey(S.user.uid))}catch(_){return}
  if(!raw)return;
  let meta;try{meta=JSON.parse(raw)}catch(_){clearExamSession();return}
  if(!meta||!meta.sid||!meta.examId){clearExamSession();return}
  // already submitted?
  if((S.attempts[meta.examId]||[]).some(r=>(r.attempt||1)===meta.n||r.id===meta.sid)){
    clearExamSession();clearExamDraft({sid:meta.sid});return;
  }
  const e=S.exams.find(x=>x.id===meta.examId);
  if(!e||!vis(e)){clearExamSession();return}
  try{
    const g=await getDoc(doc(db,"starts",meta.sid));
    if(!g.exists()){clearExamSession();clearExamDraft({sid:meta.sid});return}
    const st=g.data();
    // always recompute endAt from original start time so pause doesn't freeze the clock
    const endAt=e.minutes?(st.t+e.minutes*60000):0;
    if(endAt&&Date.now()>=endAt+90000){ // grace 90 sec after official end
      clearExamSession();
      toast("وقت الامتحان خلص وما عادش ينفع استئناف");
      return;
    }
    S.cur={exam:e,n:meta.n,sid:meta.sid,st,endAt,done:false,busy:false,away:false,pausing:false,tabs:meta.tabs||0,answered:st.answered||0,order:buildOrder(e,st.seed||meta.seed)};
    S.view="exam";render(true);
    setTimeout(loadExamDraft, 100);
    clearInterval(timer);clearInterval(hb);timer=null;hb=null;
    hb=setInterval(()=>liveUpdate({answered:S.cur?S.cur.answered:0,away:S.cur?S.cur.away:false}),60000);
    liveUpdate({away:false});
    if(endAt){
      if(Date.now()>=endAt){
        // time already over — auto submit after short moment so draft loads first
        setTimeout(()=>{if(S.cur&&!S.cur.done){toast("خلص الوقت — بنسلّم…");submitExam(true)}},600);
      }else{
        tick();timer=setInterval(tick,1000);
      }
    }

  }catch(err){console.error(err);toast("فشل الاستئناف — جرّب تاني")}
}

async function submitExam(auto){
  const c=S.cur;if(!c||c.done)return;
  const e=c.exam;
  const ans=e.questions.map((q,i)=>{
    if(q.essay){const ta=document.querySelector(`textarea[name=q${i}]`);return ta?ta.value.trim():""}
    const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1
  });
  if(!auto&&ans.some((a,i)=>{

  })){
    c.busy=true;const ok=await uiConfirm("في أسئلة لسه ما جاوبتش عليها. تسلّم برضه؟",{title:"تسليم الامتحان",ok:"سلّم",cancel:"كمّل امتحان",danger:false,icon:"📝"});c.busy=false;
    if(!ok)return;

  const rec={uid:S.user.uid,examId:e.id,examTitle:e.title,subject:e.subject,name:S.profile.name,phone:S.profile.phone,attempt:c.n,

  try{

(function(){
  const SPLASH_MS = 2400; // brand duration
  const el = document.getElementById("splash");
  if(!el) return;
  const start = performance.now();
  let done = false;
  function finish(){
    if(done) return; done = true;
    const left = Math.max(0, SPLASH_MS - (performance.now() - start));
    setTimeout(()=>{
      el.classList.add("hide");
      setTimeout(()=>{ try{el.remove()}catch(_){} }, 600);
    }, left);
  }
  setTimeout(finish, SPLASH_MS + 400);
  const appEl = document.getElementById("app");
  if(appEl){
    const mo = new MutationObserver(()=>{
      const t = appEl.textContent || "";
      if(t && !t.includes("جاري التحميل")){
        mo.disconnect();
        const minShow = 2400;
        setTimeout(finish, Math.max(0, minShow - (performance.now() - start)));
      }
    });
    mo.observe(appEl, {childList:true, subtree:true});
  }
})();

const C3_PS={Hill:{w:.95,y:.35},HillSand:{w:.95,y:.35},MountainFar:{w:1.05,y:.33},Mountain:{w:.75,y:.33},Cliff:{w:.5,y:.33},Cloud:{w:.26},TreeHigh:{h:.68},TreeMed:{h:.54},TreeLow:{h:.4},Bush:{h:.16},Reed:{h:.25},Rock:{h:.12},Grass:{h:.085}};

function c3dPropNew(el){

}

function c3dProps(room,t,dt){

(function(){

  try{window.toast&&window.toast('تم تثبيت تطبيق التفوق ✓',true)}catch(e){}
});

/* ===== v42: زر الرجوع في الموبايل/التطبيق: حفظ تلقائي للامتحان + رجوع منطقي + تأكيد الخروج ===== */
(function(){
  try{history.replaceState({r:1},"");history.pushState({a:1},"")}catch(_){return}
  let leaving=false,asking=false;
  window.addEventListener("popstate",async()=>{
    if(leaving)return;
    try{history.pushState({a:1},"")}catch(_){}
    const dlg=document.querySelector(".dlg-ov");
    if(dlg){const no=dlg.querySelector('[data-k="no"]');if(no)no.click();return}
    const pk=document.getElementById("reactPicker");if(pk){pk.remove();return}
    if(S.view==="exam"&&S.cur&&!S.cur.done){pauseExamNow(true);return}
    if(!S.user)return;
    const btn=[...document.querySelectorAll(".wrap button[data-act],.top button[data-act]")].find(b=>b.textContent.trim()==="رجوع");
    if(btn){btn.click();return}
    if(asking)return;
    asking=true;
    const ok=await uiDialog({title:"الخروج من المنصة",icon:"👋",msg:"عايز تخرج من التطبيق؟",ok:"خروج"});
    asking=false;
    if(ok){leaving=true;try{history.go(-2)}catch(_){}setTimeout(()=>{try{window.close()}catch(_){}},300)}
  });
})();
</script>
<script>
/* v53: invisible auto-quality + haptics + keyboard lift. No UI, no settings. */
(function(){
  try{
    var H=document.documentElement,N=navigator,C=N.connection||{};
    var cached=null;try{cached=JSON.parse(localStorage.getItem("fx_tier")||"null")}catch(_){}
    var fresh=!!(cached&&cached.t&&Date.now()-cached.at<6048e5);
    var weak=(N.deviceMemory&&N.deviceMemory<=3)||(N.hardwareConcurrency&&N.hardwareConcurrency<=4)||C.saveData===true||/(^|-)2g$/.test(C.effectiveType||"");
    H.setAttribute("data-fx","full");try{localStorage.removeItem("fx_tier");localStorage.removeItem("c3d_off")}catch(_){}
    function save(t){H.setAttribute("data-fx",t);try{localStorage.setItem("fx_tier",JSON.stringify({t:t,at:Date.now()}))}catch(_){}}
    function probe(ms,cb){
      var n=0,t0=0,hid=false;
      function f(t){
        if(document.hidden)hid=true;
        if(!t0)t0=t;else n++;
        if(t-t0<ms)requestAnimationFrame(f);else cb(hid?null:n/((t-t0)/1000));
      }
      requestAnimationFrame(f);
    }
    function start(){
      if(!fresh)setTimeout(function(){probe(1500,function(fps){
        if(fps===null)return;
        save("full");
      })},3500);
      setTimeout(function(){
        if(H.getAttribute("data-fx")!=="full")return;
        probe(2000,function(fps){if(fps!==null&&fps<28)save("lite")});
      },18000);
    }
    if(document.readyState==="complete")start();else window.addEventListener("load",start,{once:true});

    document.addEventListener("visibilitychange",function(){H.classList.toggle("fx-hidden",document.hidden)});

    var vv=window.visualViewport;
    if(vv){
      var raf=0;
      var kb=function(){
        cancelAnimationFrame(raf);
        raf=requestAnimationFrame(function(){
          var k=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
          H.style.setProperty("--kb",(k>80?k:0)+"px");
        });
      };
      vv.addEventListener("resize",kb);vv.addEventListener("scroll",kb);
    }

    document.addEventListener("submit",function(e){
      var f=e.target;
      if(f&&f.classList&&f.classList.contains("tk-compose")){
        try{N.vibrate&&N.vibrate(8)}catch(_){}
        var b=f.querySelector("button[type=submit]");
        if(b){b.classList.remove("v53-sent");void b.offsetWidth;b.classList.add("v53-sent")}
      }
    },true);
  }catch(_){}
})();
</script>
