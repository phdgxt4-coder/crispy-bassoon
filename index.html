<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>التفوق</title>
<script>window.APP_BUILD="v95";</script>
</head><body style="margin:0;background:#0C1716;color:#fff;font-family:sans-serif">
<div id="boot" style="padding:40px;text-align:center">جاري تحميل منصة التفوق v95…</div>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
(async function(){
  const PARTS = ["c0.txt","c1.txt","c2.txt","c3.txt","c4.txt","c5.txt","c6.txt","c7.txt","c8.txt","c9.txt","c10.txt","c11.txt","c12.txt","c13.txt","c14.txt"];
  try {
    let b64 = "";
    for (const p of PARTS) {
      const r = await fetch(p + "?v=95c");
      if (!r.ok) throw new Error(p + " " + r.status);
      b64 += (await r.text()).replace(/\s/g,"");
    }
    const compressed = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const html = pako.inflate(compressed, { to: "string" });
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("boot").innerHTML = "<h2>فشل التحميل</h2><pre dir=ltr>"+e+"</pre><button onclick=location.reload()>إعادة</button>";
  }
})();
</script>
</body></html>
