<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B5D57">
<title>التفوق</title>
<script>window.APP_BUILD="v95";</script>
</head><body style="margin:0;background:#0C1716;color:#fff;font-family:sans-serif">
<div id="boot" style="padding:48px 24px;text-align:center">
  <div style="font-size:28px;font-weight:700;margin-bottom:12px">التفوق</div>
  <div id="st">جاري تحميل v95…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
(async function(){
  const PARTS = ['p0.txt', 'p1.txt', 'p2.txt', 'p3.txt', 'p4.txt', 'p5.txt', 'p6.txt', 'p7.txt', 'p8.txt', 'p9.txt', 'p10.txt', 'p11.txt', 'p12.txt', 'p13.txt', 'p14.txt', 'p15.txt', 'p16.txt', 'p17.txt', 'p18.txt', 'p19.txt', 'p20.txt', 'p21.txt', 'p22.txt', 'p23.txt', 'p24.txt', 'p25.txt', 'p26.txt', 'p27.txt', 'p28.txt', 'p29.txt', 'p30.txt', 'p31.txt', 'p32.txt', 'p33.txt', 'p34.txt', 'p35.txt', 'p36.txt', 'p37.txt'];
  const st = document.getElementById("st");
  try {
    let b64 = "";
    for (let i = 0; i < PARTS.length; i++) {
      st.textContent = "تحميل " + (i+1) + "/" + PARTS.length;
      const r = await fetch(PARTS[i] + "?v=95p2");
      if (!r.ok) throw new Error(PARTS[i] + " HTTP " + r.status);
      b64 += (await r.text()).replace(/\s+/g, "");
    }
    st.textContent = "فك الضغط…";
    const compressed = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const html = pako.inflate(compressed, { to: "string" });
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.innerHTML = "<b>فشل التحميل</b><br><pre dir=ltr style='text-align:left;font-size:12px'>" + e + "</pre><button onclick=location.reload() style='margin-top:12px;padding:10px 18px;border:0;border-radius:10px;background:#0B5D57;color:#fff'>إعادة</button>";
  }
})();
</script>
</body></html>
