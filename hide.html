<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اختباء وبحث — التفوق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh}
.top{width:100%;max-width:420px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a{color:#94a3b8;text-decoration:none;font-size:14px}
.top h1{font-size:17px;font-weight:800}
.hud{display:flex;gap:14px;font-size:14px;color:#cbd5e1}
canvas{width:min(360px,96vw);height:auto;border-radius:16px;background:#151b2e;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
.bot{width:100%;max-width:420px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.gold{background:linear-gradient(135deg,#E3A81C,#B45309);color:#1a1408}
.btn:active{transform:scale(.97)}
.hint{font-size:12px;color:#94a3b8;text-align:center;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:#1e293b;border-radius:20px;padding:22px;text-align:center;max-width:300px;width:100%}
.panel h2{margin-bottom:6px}
.panel p{color:#94a3b8;margin-bottom:14px}
</style>
</head>
<body>
<div class="top"><a href="./index.html">← المنصة</a><h1>🎭 اختباء وبحث</h1><div class="hud"><span>⭐ <b id="sc">0</b></span><span>🏆 <b id="bs">0</b></span></div></div>
<canvas id="c" width="360" height="520"></canvas>
<div class="bot">
  <button class="btn gold" id="go">ابدأ</button>
  <div class="hint" id="hint">حرّك شخصيتك</div>
</div>
<div class="ov" id="ov"><div class="panel"><h2 id="ot">انتهت</h2><p id="om"></p><button class="btn gold" id="again">العب تاني</button></div></div>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
let mode='hide',px=180,py=260,hiders=[],seeker={x:40,y:40},run=false,t=0,found=0,score=0,map=[],best=+(localStorage.getItem('hid_bs')||0);
bsEl.textContent=best;
function gen(){map=[];for(let i=0;i<10;i++)map.push({x:20+Math.random()*300,y:40+Math.random()*400,w:36+Math.random()*55,h:28+Math.random()*40})}
function end(title,msg){run=false;if(score>best){best=score;localStorage.setItem('hid_bs',best);bsEl.textContent=best}
  document.getElementById('ot').textContent=title;document.getElementById('om').textContent=msg;document.getElementById('ov').classList.add('on')}
function reset(){mode=Math.random()>0.45?'hide':'seek';gen();t=0;found=0;score=0;run=true;seeker={x:40,y:40};px=180;py=280;
  hiders=Array.from({length:5},()=>({x:40+Math.random()*280,y:60+Math.random()*380,vx:(Math.random()-.5)*2.2,vy:(Math.random()-.5)*2.2,found:false}));
  scEl.textContent=0;document.getElementById('ov').classList.remove('on');
  document.getElementById('hint').textContent=mode==='hide'?'اختبئ من الباحث الأحمر!':'دور على النقاط الزرقاء';requestAnimationFrame(loop)}
document.getElementById('go').onclick=()=>{if(!run)reset()};
document.getElementById('again').onclick=()=>{document.getElementById('ov').classList.remove('on');reset()};
cv.addEventListener('pointermove',e=>{if(!run)return;const r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width*360;py=(e.clientY-r.top)/r.height*520});
cv.addEventListener('pointerdown',e=>{if(!run)reset()});
function loop(){
  g.fillStyle='#14532d';g.fillRect(0,0,360,520);
  map.forEach(m=>{g.fillStyle='#166534';g.fillRect(m.x,m.y,m.w,m.h)});
  if(run){t++;
    if(mode==='hide'){const dx=px-seeker.x,dy=py-seeker.y,d=Math.hypot(dx,dy)||1;seeker.x+=dx/d*2.1;seeker.y+=dy/d*2.1;
      if(d<20)end('اتمسكت!','صمدت '+Math.floor(t/60)+' ث');
      if(t>60*25){score=50;scEl.textContent=score;end('نجوت!','+50 نقطة')}}
    else{hiders.forEach(h=>{if(h.found)return;h.x+=h.vx;h.y+=h.vy;if(h.x<15||h.x>345)h.vx*=-1;if(h.y<15||h.y>505)h.vy*=-1;
      if(Math.hypot(h.x-px,h.y-py)<18){h.found=true;found++;score+=20;scEl.textContent=score}});
      if(found>=hiders.length)end('لقيت الكل!','نقاط: '+score)}
  }
  if(mode==='hide'){g.fillStyle='#fbbf24';g.beginPath();g.arc(px,py,12,0,Math.PI*2);g.fill();g.fillStyle='#ef4444';g.beginPath();g.arc(seeker.x,seeker.y,13,0,Math.PI*2);g.fill()}
  else{hiders.forEach(h=>{if(!h.found){g.fillStyle='#38bdf8';g.beginPath();g.arc(h.x,h.y,10,0,Math.PI*2);g.fill()}});g.fillStyle='#fbbf24';g.beginPath();g.arc(px,py,12,0,Math.PI*2);g.fill()}
  if(run)requestAnimationFrame(loop);
}
loop();

</script>
</body></html>
