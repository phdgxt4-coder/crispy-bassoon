<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Doodle Jump — التفوق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh}
.top{width:100%;max-width:420px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a{color:#94a3b8;text-decoration:none;font-size:14px}
.top h1{font-size:17px;font-weight:800}
.hud{display:flex;gap:14px;font-size:14px;color:#cbd5e1}
canvas{width:min(360px,96vw);height:auto;border-radius:16px;background:#151b2e;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
.bot{width:100%;max-width:420px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.gold{background:linear-gradient(135deg,#E3A81C,#B45309);color:#1a1408}
.btn:active{transform:scale(.97)}
.hint{font-size:12px;color:#94a3b8;text-align:center;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:#1e293b;border-radius:20px;padding:22px;text-align:center;max-width:300px;width:100%}
.panel h2{margin-bottom:6px}
.panel p{color:#94a3b8;margin-bottom:14px}
</style>
</head>
<body>
<div class="top"><a href="./index.html">← المنصة</a><h1>🪂 Doodle Jump</h1><div class="hud"><span>⭐ <b id="sc">0</b></span><span>🏆 <b id="bs">0</b></span></div></div>
<canvas id="c" width="360" height="520"></canvas>
<div class="bot">
  <button class="btn gold" id="go">ابدأ</button>
  <div class="hint" id="hint">حرّك يمين ويسار</div>
</div>
<div class="ov" id="ov"><div class="panel"><h2 id="ot">انتهت</h2><p id="om"></p><button class="btn gold" id="again">العب تاني</button></div></div>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
let score=0,best=+(localStorage.getItem('doo_bs')||0),run=false;
let px=180,py=400,vx=0,vy=0,plats=[],cam=0;
bsEl.textContent=best;
function mkPlats(){plats=[];for(let i=0;i<9;i++)plats.push({x:20+Math.random()*260,y:480-i*60,w:70})}
function end(){run=false;if(score>best){best=score;localStorage.setItem('doo_bs',best);bsEl.textContent=best}
  document.getElementById('ot').textContent='سقطت!';document.getElementById('om').textContent='ارتفاع: '+score;document.getElementById('ov').classList.add('on')}
function reset(){score=0;px=180;py=400;vx=0;vy=-11;cam=0;mkPlats();run=true;scEl.textContent=0;document.getElementById('ov').classList.remove('on')}
document.getElementById('go').onclick=()=>{if(!run)reset()};
document.getElementById('again').onclick=()=>{document.getElementById('ov').classList.remove('on');reset()};
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const tx=(e.clientX-r.left)/r.width*360;vx=(tx-px)*0.12});
cv.addEventListener('pointerdown',e=>{if(!run)reset()});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')vx=-4;if(e.key==='ArrowRight')vx=4});
(function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#0f172a';g.fillRect(0,0,360,520);
  if(run){
    vy+=0.35;px+=vx;vx*=0.92;py+=vy;
    if(px<0)px=360;if(px>360)px=0;
    if(vy>0){for(const p of plats){if(px>p.x&&px<p.x+p.w&&py+16>p.y&&py+16<p.y+12&&py<p.y+20){vy=-10}}}
    if(py<220){const d=220-py;py=220;cam+=d;plats.forEach(p=>p.y+=d);score=Math.floor(cam/10);scEl.textContent=score}
    plats.forEach(p=>{if(p.y>520){p.y-=560;p.x=20+Math.random()*260}});
    if(py>530)end();
  }
  g.fillStyle='#22c55e';plats.forEach(p=>g.fillRect(p.x,p.y,p.w,10));
  g.fillStyle='#fbbf24';g.beginPath();g.arc(px,py,14,0,Math.PI*2);g.fill();
})();

</script>
</body></html>
