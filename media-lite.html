<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d18">
<title>مشغّل المنصة</title>
<style>
:root{--bg:#0b0d18;--card:#151829;--line:rgba(255,255,255,.09);--tx:#f3f5ff;--mu:rgba(243,245,255,.55);--ac:#8b7bff;--ac2:#ffb020}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px}
.tabs{flex:1;display:flex;background:var(--card);border-radius:14px;padding:3px}
.tabs button{flex:1;padding:9px 0;border-radius:11px;font-weight:700;color:var(--mu)}
.tabs button.on{background:var(--ac);color:#fff}
.pill{height:38px;padding:0 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.pill.gold{background:linear-gradient(135deg,#ffb020,#ff6a3d);color:#201000;border:0;display:none}
.adm .pill.gold{display:block}
.stage{flex:none;padding:6px 16px 4px;text-align:center}
.cover{width:min(52vw,230px);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;background:linear-gradient(135deg,#3a2f8f,#14b8a6);background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative;overflow:hidden}
.cover.sp{animation:sp 14s linear infinite;animation-play-state:paused}
.playing .cover.sp{animation-play-state:running}
.cover:after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--bg);opacity:.85}
@keyframes sp{to{transform:rotate(360deg)}}
.vwrap{display:none;width:100%;aspect-ratio:16/9;max-height:34vh;background:#000;border-radius:16px;overflow:hidden;margin:6px 0 8px;position:relative}
.vmode .vwrap{display:block}.vmode .cover{display:none}
.vwrap video,.vwrap iframe{width:100%;height:100%;border:0;background:#000;display:block}
h2{font-size:17px;line-height:1.4;min-height:24px}.sub{color:var(--mu);font-size:12.5px;min-height:18px}
.lyr{margin:8px auto 0;max-width:520px;max-height:84px;overflow:auto;font-size:15px;line-height:1.9;color:var(--mu);display:none;scrollbar-width:none}
.lyr.has{display:block}.lyr .l.on{color:var(--tx);font-weight:800}
.bar{padding:6px 18px 0}
.vmode .bar,.vmode .ctl{display:none}
input[type=range]{width:100%;accent-color:var(--ac);height:22px}
.tm{display:flex;justify-content:space-between;color:var(--mu);font-size:11.5px;direction:ltr}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;padding:4px 0 8px}
.ctl button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:18px;display:grid;place-items:center}
.ctl button.on{color:var(--ac2)}
.ctl .pp{width:62px;height:62px;background:var(--ac);font-size:24px;color:#fff}
.list{flex:1;overflow:auto;padding:4px 12px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;cursor:pointer}
.row.on{background:rgba(139,123,255,.16)}
.ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:16px}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mu);font-size:11.5px}
.ed{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);display:none}.adm .ed{display:block}
.emp{padding:34px 10px;text-align:center;color:var(--mu);font-size:14px}
.ld{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:3}
.busy .ld{display:grid}.sp2{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222642;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;z-index:9;max-width:90%;text-align:center}
</style></head><body>
<div id="app"><div class="top">
<button class="pill" id="back" style="display:none">‹ المنصة</button>
<div class="tabs"><button id="tS" class="on">🎵 أغاني</button><button id="tV">🎬 فيديوهات</button></div>
<button class="pill gold" id="up">⬆ رفع</button></div>
<div class="stage"><div class="cover sp" id="cv"></div>
<div class="vwrap" id="vw"><div class="ld"><div class="sp2"></div></div><video id="vid" controls playsinline webkit-playsinline preload="metadata"></video></div>
<h2 id="tt"></h2><div class="sub" id="sb"></div><div class="lyr" id="ly"></div></div>
<div class="bar"><input type="range" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="ct">0:00</span><span id="dt">0:00</span></div></div>
<div class="ctl"><button id="sh" title="عشوائي">🔀</button><button id="pv">⏮</button><button class="pp" id="pp">▶</button><button id="nx">⏭</button><button id="rp" title="تكرار">🔁</button></div>
<div class="list" id="ls"></div></div>
<audio id="aud" preload="auto"></audio>
<script>
(function(){
var B=null;try{B=window.parent!==window?window.parent.__auraBridge:null}catch(e){}
var $=function(i){return document.getElementById(i)},aud=$('aud'),vid=$('vid'),app=$('app');
var mode='song',songs=[],vids=[],cur=-1,tok=0,shuf=false,rep=0,lyr=[],lyi=-1,hist=[];
var T=function(m){if(B&&B.toast)try{B.toast(m)}catch(e){};var d=document.createElement('div');d.className='tst';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)};
var adm=function(){try{return !!B.admin()}catch(e){return false}};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(t){if(!isFinite(t)||t<0)t=0;var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
function parseLRC(raw){
 raw=String(raw||'').trim();if(!raw)return[];var out=[],timed=false;
 raw.split(/\r?\n/).forEach(function(ln){
  var m=ln.match(/^\s*((?:\[\d+:\d+(?:[.:]\d+)?\])+)(.*)$/);
  if(m){timed=true;var tx=m[2].trim();m[1].replace(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g,function(_,a,b,c){out.push({t:+a*60+ +b+(c?+('0.'+c):0),x:tx})})}
  else if(ln.trim()&&!/^\s*\[[a-z]+:/i.test(ln))out.push({t:-1,x:ln.trim()});
 });
 if(timed)out=out.filter(function(l){return l.t>=0&&l.x}).sort(function(a,b){return a.t-b.t});
 return out;
}
function dispV(v,n){return(!B.hideTitles()&&v.title)?v.title:('فيديو '+n)}
function load(){
 try{songs=(B.songs()||[]).map(function(s){return{id:s.id,t:s.title||'أغنية',a:s.artist||'',c:s.cover||'',l:s.lyrics||''}})}catch(e){songs=[]}
 try{vids=(B.videos()||[]).map(function(v,i){return{id:v.id,raw:v.title||'',t:dispV(v,i+1),c:v.cover||''}})}catch(e){vids=[]}
 var L=mode==='song'?songs:vids;
 if(cur>=L.length)cur=-1;
 render();
}
function render(){
 var L=mode==='song'?songs:vids,h='';
 app.classList.toggle('adm',adm());app.classList.toggle('vmode',mode==='video');
 $('tS').classList.toggle('on',mode==='song');$('tV').classList.toggle('on',mode==='video');
 if(!L.length){h='<div class="emp">'+(mode==='song'?(B.signedIn()?'مفيش أغاني لسه':'سجّل دخول عشان تسمع أغاني المنصة'):'مفيش فيديوهات لسه')+'</div>'}
 else L.forEach(function(x,i){h+='<div class="row'+(i===cur?' on':'')+'" data-i="'+i+'"><div class="ic">'+(i===cur?'🔊':(mode==='song'?'🎵':'🎬'))+'</div><div class="nm"><b>'+esc(x.t)+'</b>'+(x.a?'<small>'+esc(x.a)+'</small>':'')+'</div>'+(mode==='video'?'<button class="ed" data-e="'+i+'">✎</button>':'')+'</div>'});
 $('ls').innerHTML=h;
}
function setLyr(raw){
 lyr=parseLRC(raw);lyi=-1;var box=$('ly');
 if(!lyr.length){box.className='lyr';box.innerHTML='';return}
 box.className='lyr has';box.innerHTML=lyr.map(function(l,i){return'<div class="l" data-i="'+i+'">'+esc(l.x)+'</div>'}).join('');
}
function showMeta(x){$('tt').textContent=x?x.t:'';$('sb').textContent=x?(mode==='song'?(x.a||'صوت'):''):'';
 var cv=$('cv');cv.style.backgroundImage=(x&&x.c&&mode==='song')?'url("'+x.c.replace(/"/g,'%22')+'")':'';
 try{if(x&&navigator.mediaSession)navigator.mediaSession.metadata=new MediaMetadata({title:x.t,artist:x.a||'منصة التفوق',artwork:x.c&&/^(https?:|data:)/.test(x.c)?[{src:x.c,sizes:'512x512'}]:[]})}catch(e){}}
function stopAll(){tok++;try{aud.pause()}catch(e){}try{vid.pause()}catch(e){}var e=$('vw').querySelector('iframe');if(e)e.remove();app.classList.remove('playing','busy')}
function play(i){
 var L=mode==='song'?songs:vids,x=L[i];if(!x)return;
 stopAll();var my=++tok;cur=i;render();showMeta(x);app.classList.add('busy');
 if(mode==='song')setLyr(x.l);else setLyr('');
 if(B.stopPlatform)try{B.stopPlatform()}catch(e){}
 B.resolve(mode,x.id).then(function(r){
  if(my!==tok)return;
  if(r.kind==='yt'||r.kind==='vimeo'){
   var f=document.createElement('iframe');f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';f.setAttribute('allowfullscreen','');
   f.src=r.kind==='yt'?'https://www.youtube-nocookie.com/embed/'+r.id+'?autoplay=1&playsinline=1&rel=0&modestbranding=1':'https://player.vimeo.com/video/'+r.id+'?autoplay=1&playsinline=1';
   $('vw').appendChild(f);app.classList.remove('busy');return}
  var el=mode==='song'?aud:vid;
  try{el.setAttribute('referrerpolicy','no-referrer')}catch(e){}
  if(r.kind==='hls'&&!el.canPlayType('application/vnd.apple.mpegurl')){
   var go=function(){var h=new Hls();h.loadSource(r.url);h.attachMedia(el);el.play().catch(function(){})};
   if(window.Hls)go();else{var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';s.onload=go;document.head.appendChild(s)}
  }else{el.src=r.url;var p=el.play();if(p&&p.catch)p.catch(function(e){if(my===tok){app.classList.remove('busy');if(e&&e.name==='NotAllowedError')T('اضغط ▶ للتشغيل')}})}
 }).catch(function(e){if(my!==tok)return;app.classList.remove('busy');T((e&&e.message)||'تعذّر تشغيل الملف')});
}
function next(auto){
 var L=mode==='song'?songs:vids;if(!L.length)return;var i;
 if(shuf&&L.length>1){do{i=Math.floor(Math.random()*L.length)}while(i===cur)}
 else{i=cur+1;if(i>=L.length){if(rep===1||!auto)i=0;else return}}
 play(i);
}
function prev(){var L=mode==='song'?songs:vids;if(!L.length)return;if(aud.currentTime>4){aud.currentTime=0;return}play((cur-1+L.length)%L.length)}
function toggle(){
 if(cur<0){if(mode==='song'&&songs.length)play(0);return}
 var el=mode==='song'?aud:vid;if(el.paused){var p=el.play();if(p&&p.catch)p.catch(function(){})}else el.pause();
}
aud.addEventListener('play',function(){if(mode==='song'){app.classList.add('playing');app.classList.remove('busy');$('pp').textContent='⏸'}});
aud.addEventListener('pause',function(){app.classList.remove('playing');$('pp').textContent='▶'});
aud.addEventListener('playing',function(){app.classList.remove('busy')});
aud.addEventListener('waiting',function(){app.classList.add('busy')});
aud.addEventListener('error',function(){if(!aud.getAttribute('src'))return;app.classList.remove('busy');T('الأغنية مش بتشتغل — جرّب غيرها');});
aud.addEventListener('ended',function(){if(rep===2){aud.currentTime=0;aud.play();return}next(true)});
vid.addEventListener('playing',function(){app.classList.remove('busy')});
vid.addEventListener('waiting',function(){app.classList.add('busy')});
vid.addEventListener('error',function(){if(!vid.getAttribute('src'))return;app.classList.remove('busy');T('الفيديو مش بيتحمّل — اتأكد من الرابط')});
vid.addEventListener('ended',function(){if(rep!==0)next(true)});
vid.addEventListener('play',function(){if(B.stopPlatform)try{B.stopPlatform()}catch(e){}});
var seeking=false;
aud.addEventListener('timeupdate',function(){
 var d=aud.duration,t=aud.currentTime;
 if(!seeking&&d&&isFinite(d))$('sk').value=Math.round(t/d*1000);
 $('ct').textContent=fmt(t);$('dt').textContent=fmt(d);
 if(lyr.length&&lyr[0].t>=0){var k=-1;for(var j=0;j<lyr.length;j++){if(lyr[j].t<=t)k=j;else break}
  if(k!==lyi){lyi=k;var ls=$('ly').children;for(var n=0;n<ls.length;n++)ls[n].classList.toggle('on',n===k);if(k>=0&&ls[k])$('ly').scrollTop=ls[k].offsetTop-30}}
});
$('sk').addEventListener('input',function(){seeking=true;$('ct').textContent=fmt(aud.duration*this.value/1000)});
$('sk').addEventListener('change',function(){if(aud.duration)aud.currentTime=aud.duration*this.value/1000;seeking=false});
$('pp').onclick=toggle;$('nx').onclick=function(){next(false)};$('pv').onclick=prev;
$('sh').onclick=function(){shuf=!shuf;this.classList.toggle('on',shuf)};
$('rp').onclick=function(){rep=(rep+1)%3;this.classList.toggle('on',rep>0);this.textContent=rep===2?'🔂':'🔁'};
$('tS').onclick=function(){if(mode==='song')return;stopAll();mode='song';cur=-1;showMeta(null);setLyr('');load()};
$('tV').onclick=function(){if(mode==='video')return;stopAll();mode='video';cur=-1;showMeta(null);setLyr('');load()};
$('ls').addEventListener('click',function(e){
 var ed=e.target.closest('.ed');
 if(ed){e.stopPropagation();var v=vids[+ed.dataset.e];if(!v||!adm())return;
  B.ask('اسم الفيديو',v.raw).then(function(n){if(n==null)return;n=String(n).trim();if(!n){T('اكتب اسم، أو فعّل «إخفاء أسماء الفيديوهات» من الإعدادات');return}
   B.renameVideo(v.id,n).then(function(){T('✓ اتغيّر الاسم');load()},function(){T('فشل تغيير الاسم')})});return}
 var r=e.target.closest('.row');if(r)play(+r.dataset.i);
});
$('back').onclick=function(){try{B.close()}catch(e){}};
$('up').onclick=function(){try{B.openUpload(mode==='song'?'audio':'video')}catch(e){}};
try{var h=function(a,f){navigator.mediaSession.setActionHandler(a,f)};h('play',toggle);h('pause',toggle);h('nexttrack',function(){next(false)});h('previoustrack',prev)}catch(e){}
window.__auraRefresh=load;window.__auraAdmin=function(){app.classList.toggle('adm',adm())};
window.__auraPause=function(){try{aud.pause();vid.pause()}catch(e){}};
if(!B){document.body.innerHTML='<div class="emp">يفتح من داخل المنصة فقط</div>';return}
try{if(B.canBack())$('back').style.display='block'}catch(e){}
load();setInterval(function(){app.classList.toggle('adm',adm())},4000);
})();
</script></body></html>
