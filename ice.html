<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تزحلق الجليد — التفوق</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1020;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh}
.top{width:100%;max-width:420px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top a{color:#94a3b8;text-decoration:none;font-size:14px}
.top h1{font-size:17px;font-weight:800}
.hud{display:flex;gap:14px;font-size:14px;color:#cbd5e1}
canvas{width:min(360px,96vw);height:auto;border-radius:16px;background:#151b2e;box-shadow:0 10px 40px #0008;touch-action:none;display:block}
.bot{width:100%;max-width:420px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.gold{background:linear-gradient(135deg,#E3A81C,#B45309);color:#1a1408}
.btn:active{transform:scale(.97)}
.hint{font-size:12px;color:#94a3b8;text-align:center;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:#1e293b;border-radius:20px;padding:22px;text-align:center;max-width:300px;width:100%}
.panel h2{margin-bottom:6px}
.panel p{color:#94a3b8;margin-bottom:14px}
</style>
</head>
<body>
<div class="top"><a href="./index.html">← المنصة</a><h1>🧊 تزحلق الجليد</h1><div class="hud"><span>⭐ <b id="sc">0</b></span><span>🏆 <b id="bs">0</b></span></div></div>
<canvas id="c" width="360" height="520"></canvas>
<div class="bot">
  <button class="btn gold" id="go">ابدأ</button>
  <div class="hint" id="hint">حرّك إصبعك للتفادي</div>
</div>
<div class="ov" id="ov"><div class="panel"><h2 id="ot">انتهت</h2><p id="om"></p><button class="btn gold" id="again">العب تاني</button></div></div>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs');
let score=0,best=+(localStorage.getItem('ice_bs')||0),run=false,px=180,py=450,vx=0,vy=0,obs=[],t=0;
bsEl.textContent=best;
function end(){run=false;if(score>best){best=score;localStorage.setItem('ice_bs',best);bsEl.textContent=best}
  document.getElementById('ot').textContent='اصطدمت!';document.getElementById('om').textContent='مسافة: '+score;document.getElementById('ov').classList.add('on')}
function reset(){score=0;px=180;py=450;vx=vy=0;obs=[];t=0;run=true;scEl.textContent=0;document.getElementById('ov').classList.remove('on')}
document.getElementById('go').onclick=()=>{if(!run)reset()};
document.getElementById('again').onclick=()=>{document.getElementById('ov').classList.remove('on');reset()};
cv.addEventListener('pointermove',e=>{if(!run)return;const r=cv.getBoundingClientRect();const tx=(e.clientX-r.left)/r.width*360,ty=(e.clientY-r.top)/r.height*520;vx=(tx-px)*0.1;vy=(ty-py)*0.1});
cv.addEventListener('pointerdown',e=>{if(!run)reset()});
(function loop(){
  requestAnimationFrame(loop);
  g.fillStyle='#0c4a6e';g.fillRect(0,0,360,520);
  g.strokeStyle='#38bdf822';for(let y=(t%40);y<520;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(360,y);g.stroke()}
  if(run){t++;if(t%32===0)obs.push({x:30+Math.random()*280,y:-20,w:36+Math.random()*50,h:14,s:2.2+Math.random()*2+t/800});
    px+=vx;py+=vy;vx*=0.9;vy*=0.9;px=Math.max(18,Math.min(342,px));py=Math.max(18,Math.min(502,py));
    obs.forEach(o=>o.y+=o.s);
    for(const o of obs){if(px>o.x&&px<o.x+o.w&&py>o.y&&py<o.y+o.h){end();break}}
    obs=obs.filter(o=>o.y<540);score++;if(score%5===0)scEl.textContent=score}
  g.fillStyle='#94a3b8';obs.forEach(o=>g.fillRect(o.x,o.y,o.w,o.h));
  g.fillStyle='#fbbf24';g.beginPath();g.arc(px,py,13,0,Math.PI*2);g.fill();
})();

</script>
</body></html>
