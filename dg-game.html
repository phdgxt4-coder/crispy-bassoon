<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07051A">
<title>منصة التفوق — جاري التحويل…</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="mark.png">
<script>
/* dg-game.html — مدخل قديم (Legacy) للعبة ارسم وخمّن.
   المنصة الحقيقية كلها في index.html — نحوّل فورًا مع فتح اللعبة مباشرة. */
(function () {
  try { localStorage.setItem("dgAutoOpen", "1"); } catch (_) {}
  location.replace("./?game=dg");
})();
</script>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0B5D57 0%,#084a45 45%,#12302D 100%);
       font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff}
  .box{text-align:center}
  .spin{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
        border:4px solid rgba(255,216,101,.25);border-top-color:#FFD865;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{opacity:.85;font-size:14px;margin:0}
</style>
</head>
<body>
  <div class="box"><div class="spin"></div><p>جاري فتح ارسم وخمّن 🎨 …</p></div>
</body>
</html>
