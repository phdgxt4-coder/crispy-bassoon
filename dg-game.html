<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>ارسم وخمّن — التفوق</title>
<style>
:root{--bg:#070b14;--card:rgba(18,28,48,.72);--stroke:rgba(120,160,255,.14);--gold:#f5c542;--gold2:#e8a91a;--blue:#4f8cff;--blue2:#2f6df6;--green:#2ecc71;--mut:#8b9bb8;--txt:#eef3ff;--soft:#c5d0e6;--r:18px;--sh:0 12px 40px rgba(0,0,0,.45);--font:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 80% -10%,#1a2744 0%,var(--bg) 55%);color:var(--txt);font-family:var(--font);overflow:hidden}
button{font:inherit;cursor:pointer;border:0}input,select{font:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.glass{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;transition:.18s transform}.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1400}.btn-blue{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--stroke)}.btn-block{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.mut{color:var(--mut);font-size:.9rem}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);font-size:.82rem}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px}.topbar h1{margin:0;font-size:1.05rem;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt);display:grid;place-items:center}
.screen{flex:1;overflow:auto;padding:12px 14px 24px;display:none}.screen.on{display:block}
.hero{text-align:center;padding:18px 8px 8px}.hero .logo{width:72px;height:72px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(145deg,#2a3f6d,#152038);display:grid;place-items:center;font-size:2rem;border:1px solid var(--stroke);box-shadow:var(--sh)}
.hero h2{margin:0 0 6px;font-size:1.45rem}
.field{margin:10px 0}.field label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--txt);outline:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.players{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.player{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a5080,#1e2c4a);display:grid;place-items:center;font-weight:800;color:#cfe0ff;flex-shrink:0}
.av.host{box-shadow:0 0 0 2px var(--gold)}.player .meta{flex:1;min-width:0}.player .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.72rem;padding:3px 8px;border-radius:999px;background:rgba(245,197,66,.15);color:var(--gold);border:1px solid rgba(245,197,66,.3)}
.badge.ready{background:rgba(46,204,113,.12);color:var(--green);border-color:rgba(46,204,113,.3)}
.scoreboard{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.scoreboard::-webkit-scrollbar{display:none}
.sc{min-width:72px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);text-align:center}.sc .n{font-weight:800;font-size:.95rem}.sc .s{color:var(--gold);font-weight:700}
.timer-wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.15rem;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--stroke)}
.timer.warn{color:#ffb347}.timer.danger{color:#ff6b7a;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.7}}
.word-box{text-align:center;padding:10px;border-radius:14px;background:rgba(79,140,255,.08);border:1px dashed rgba(79,140,255,.35);margin-bottom:10px;font-weight:800}
.word-box .hint{letter-spacing:3px;font-size:1.2rem}
.canvas-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--stroke);background:#fff;aspect-ratio:4/3;touch-action:none}
#c{width:100%;height:100%;display:block;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.size-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt);font-size:.75rem;font-weight:700}.size-btn.on{background:rgba(79,140,255,.2);border-color:var(--blue)}
.guess-bar{display:flex;gap:8px;margin-top:10px}.guess-bar input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--txt)}
.chat{max-height:140px;overflow:auto;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--stroke);margin-top:10px;font-size:.88rem}.chat .sys{color:var(--green);font-weight:600}
.pick-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}.pick-grid .btn{padding:16px;font-size:1.05rem}
.overlay{position:absolute;inset:0;background:rgba(5,10,20,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.overlay.on{display:flex}
.modal{width:100%;max-width:360px;padding:22px;text-align:center}.modal h3{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(20,30,50,.95);border:1px solid var(--stroke);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center;font-weight:600}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{border-color:rgba(255,92,108,.4);background:rgba(40,15,20,.95)}
.splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:12px}.splash.hide{opacity:0;pointer-events:none;transition:.4s}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer-note{text-align:center;margin-top:18px;font-size:.75rem;color:var(--mut)}
.seat-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.seat{width:56px;text-align:center}.seat .av{margin:0 auto 4px;width:48px;height:48px}.seat .nm{font-size:.72rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-seat{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.15);margin:0 auto 4px;display:grid;place-items:center;color:var(--mut)}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="spinner"></div><div class="mut">جاري تجهيز اللعبة…</div></div>
<div id="app">
  <div class="topbar">
    <button class="icon-btn" id="btnBack" title="رجوع">→</button>
    <h1 id="title">ارسم وخمّن</h1>
    <button class="icon-btn" id="btnMute" title="صوت">🔊</button>
  </div>
  <div class="screen on" id="sc-home">
    <div class="hero"><div class="logo">🎨</div><h2>ارسم وخمّن</h2><p class="mut">ارسم الكلمة — صحابك يخمنوا — اجمع نقاط التفوق</p></div>
    <div class="glass" style="padding:16px;margin-top:8px">
      <button class="btn btn-gold btn-block" id="btnCreate">إنشاء غرفة</button>
      <div style="text-align:center;margin:12px 0;color:var(--mut);font-size:.85rem">أو انضم بكود</div>
      <div class="row">
        <input id="joinCode" maxlength="6" placeholder="الكود" style="text-transform:uppercase;text-align:center;letter-spacing:2px;padding:12px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--txt)">
        <button class="btn btn-blue" id="btnJoin" style="min-width:100px">انضم</button>
      </div>
    </div>
    <div class="glass" style="padding:14px;margin-top:12px">
      <div class="mut" style="margin-bottom:8px">إعدادات الغرفة</div>
      <div class="row">
        <div class="field"><label>الجولات</label><select id="cfgRounds"><option>3</option><option selected>5</option><option>7</option></select></div>
        <div class="field"><label>ثواني الرسم</label><select id="cfgSecs"><option>45</option><option selected>60</option><option>75</option><option>90</option></select></div>
      </div>
    </div>
    <div class="footer-note">جزء من منصة <b>التفوق</b> · v2</div>
  </div>
  <div class="screen" id="sc-lobby">
    <div class="glass" style="padding:16px;text-align:center">
      <div class="mut">كود الغرفة</div>
      <div style="font-size:2rem;font-weight:900;letter-spacing:4px;color:var(--gold);margin:4px 0" id="lobbyCode">-----</div>
      <button class="btn btn-ghost" id="btnCopy" style="margin-top:6px">نسخ الكود</button>
      <div class="mut" style="margin-top:8px" id="lobbyCount">0 لاعبين</div>
    </div>
    <div class="seat-row" id="seatRow"></div>
    <div class="players" id="lobbyPlayers"></div>
    <button class="btn btn-gold btn-block" id="btnReady" style="margin-top:8px">أنا جاهز ✓</button>
    <button class="btn btn-blue btn-block" id="btnStart" style="margin-top:8px;display:none">ابدأ اللعب</button>
    <button class="btn btn-ghost btn-block" id="btnLeaveLobby" style="margin-top:8px">خروج</button>
  </div>
  <div class="screen" id="sc-pick">
    <div class="hero"><h2>اختار كلمة</h2><p class="mut">الكلمة سرية — باقي اللاعبين مش هيشوفوها</p></div>
    <div class="pick-grid" id="pickGrid"></div>
  </div>
  <div class="screen" id="sc-play">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="timer-wrap">
      <div class="chip" id="roundChip">جولة 1</div>
      <div class="timer" id="timer">60</div>
      <div class="chip" id="roleChip">—</div>
    </div>
    <div class="word-box" id="wordBox"><span class="hint">_ _ _</span></div>
    <div class="canvas-wrap"><canvas id="c"></canvas></div>
    <div class="tools" id="tools" style="display:none">
      <button class="size-btn on" data-w="3">س</button>
      <button class="size-btn" data-w="7">م</button>
      <button class="size-btn" data-w="14">ك</button>
      <span class="swatch on" data-c="#111111" style="background:#111"></span>
      <span class="swatch" data-c="#e74c3c" style="background:#e74c3c"></span>
      <span class="swatch" data-c="#3498db" style="background:#3498db"></span>
      <span class="swatch" data-c="#2ecc71" style="background:#2ecc71"></span>
      <span class="swatch" data-c="#f1c40f" style="background:#f1c40f"></span>
      <span class="swatch" data-c="#9b59b6" style="background:#9b59b6"></span>
      <span class="swatch" data-c="#ffffff" style="background:#fff;border-color:#ccc"></span>
      <button class="btn btn-ghost" id="btnClear" style="padding:8px 10px">مسح</button>
    </div>
    <div class="guess-bar" id="guessBar">
      <input id="guessIn" placeholder="اكتب تخمينك…" autocomplete="off">
      <button class="btn btn-gold" id="btnGuess">تخمين</button>
    </div>
    <div class="chat" id="chat"></div>
  </div>
  <div class="screen" id="sc-reveal">
    <div class="glass modal" style="margin:40px auto;max-width:100%">
      <div style="font-size:2.5rem;margin-bottom:8px">✨</div>
      <h3 id="revealTitle">انتهت الجولة</h3>
      <p class="mut" id="revealWord"></p>
      <div id="revealScores" style="margin:14px 0"></div>
      <button class="btn btn-gold btn-block" id="btnNext">التالي</button>
    </div>
  </div>
  <div class="screen" id="sc-win">
    <div class="glass modal" style="margin:40px auto;max-width:100%">
      <div style="font-size:3rem">🏆</div>
      <h3 id="winTitle">الفائز</h3>
      <p class="mut" id="winSub"></p>
      <div id="winBoard" style="margin:14px 0;text-align:right"></div>
      <button class="btn btn-gold btn-block" id="btnHome">الغرف</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

(function(){
"use strict";
const FB={apiKey:"AIzaSyCo99zGbGOJSw1p-rdy3bk9PSxzsINWkxQ",authDomain:"eltafawoq-8b700.firebaseapp.com",projectId:"eltafawoq-8b700",messagingSenderId:"892405720236",appId:"1:892405720236:web:734c19429b8ee8e292eb09"};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp,DEL=firebase.firestore.FieldValue.delete;
const WORDS="قطة كلب أسد نمر فيل زرافة قرد دب ثعلب ذئب حصان جمل بقرة خروف ماعز دجاجة بطة سمكة قرش حوت فراشة نحلة نملة بعوضة عقرب ثعبان تمساح بطريق ببغاء حمامة أرنب فأر سلحفاة شمس قمر نجمة سحابة مطر ثلج رعد برق بحر نهر جبل صحراء غابة جزيرة بيت باب شباك سرير كرسي طاولة مصباح مفتاح كتاب قلم حقيبة مدرسة تفاح موز برتقال عنب فراولة بطيخ خبز جبن بيض حليب شاي قهوة سيارة قطار طائرة سفينة دراجة طبيب مهندس طيار طباخ كرة مرمى ملعب تليفون لابتوب قلب عين يد قدم تاج سيف قلعة كنز خريطة تنين هدية بالون كعكة نظارة قبعة حذاء".split(" ");
const ST={uid:null,me:{name:"لاعب"},code:null,room:null,unsub:null,unsubMsg:null,view:"home",brush:{c:"#111111",w:3},secretWord:null,mute:false,timerIv:null,endsAt:0,localGuessed:false,_gUnsub:null,_sUnsub:null};
let AC=null;
function beep(f,d,t,v){if(ST.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.12));o.stop(AC.currentTime+(d||.12)+.02)}catch(_){}}
const SFX={click(){beep(600,.06,"triangle",.04)},ok(){beep(520,.08);setTimeout(()=>beep(780,.12),70)},fail(){beep(220,.15,"sawtooth",.05)},tick(){beep(880,.03,"square",.03)},start(){beep(440,.1);setTimeout(()=>beep(660,.12),100);setTimeout(()=>beep(880,.15),200)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*120))}};
const $=id=>document.getElementById(id);
function toast(msg,err){const t=$("toast");t.textContent=msg;t.className="toast on"+(err?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="toast",2600)}
function show(v){ST.view=v;["home","lobby","pick","play","reveal","win"].forEach(x=>{const el=$("sc-"+x);if(el)el.classList.toggle("on",x===v)});$("title").textContent=({home:"ارسم وخمّن",lobby:"اللوبي",pick:"اختيار الكلمة",play:"الجولة",reveal:"النتيجة",win:"النهاية"})[v]||"ارسم وخمّن"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function avatarLetter(n){return String(n||"?").trim().slice(0,1)||"؟"}
function makeCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function norm(s){return String(s||"").normalize("NFKC").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g,"").toLowerCase()}
function mePlayer(){return{uid:ST.uid,name:String(ST.me.name).slice(0,80),joinedAt:Date.now(),lastSeen:Date.now(),away:false,seen:true,ready:false}}

function boot(){
  auth.onAuthStateChanged(async u=>{
    if(!u){try{await auth.signInAnonymously()}catch(e){$("splash").innerHTML='<div class="mut" style="padding:20px;text-align:center">سجّل دخولك من منصة التفوق أولاً</div>';return}}
    ST.uid=auth.currentUser.uid;
    try{const snap=await db.collection("students").doc(ST.uid).get();if(snap.exists){const d=snap.data()||{};ST.me.name=d.chatName||d.name||"لاعب"}}catch(_){}
    const code=(new URLSearchParams(location.search).get("code")||"").toUpperCase();
    $("splash").classList.add("hide");setTimeout(()=>{try{$("splash").remove()}catch(_){}},400);
    if(code){$("joinCode").value=code;joinRoom(code)}else show("home");
  });
}

async function createRoom(){
  if(!ST.uid){toast("سجّل الدخول",true);return}SFX.click();
  const code=makeCode(),rounds=parseInt($("cfgRounds").value,10)||5,secs=parseInt($("cfgSecs").value,10)||60;
  const players={};players[ST.uid]=mePlayer();
  const room={host:ST.uid,hostName:String(ST.me.name).slice(0,80),status:"lobby",settings:{mode:"rounds",rounds,target:100,drawSecs:secs,hints:true,order:"join"},players,order:[ST.uid],turnIdx:0,round:0,guessed:{},createdAt:TS(),updatedAt:TS()};
  try{await db.collection("dgRooms").doc(code).set(room);ST.code=code;listen(code);show("lobby");toast("تم إنشاء الغرفة "+code);SFX.ok()}
  catch(e){const c=String(e&&e.code||e&&e.message||e);toast(c.includes("permission")?"فشل الإنشاء: انشر قواعد Firestore v142":("فشل: "+c),true)}
}

async function joinRoom(code){
  code=String(code||"").trim().toUpperCase();if(!code){toast("اكتب الكود");return}SFX.click();
  try{
    const ref=db.collection("dgRooms").doc(code);const snap=await ref.get();
    if(!snap.exists){toast("الغرفة مش موجودة",true);SFX.fail();return}
    const d=snap.data()||{};if(d.status==="ended"){toast("الغرفة خلصت",true);return}
    const players=Object.assign({},d.players||{});
    if(!players[ST.uid]){if(Object.keys(players).length>=8){toast("الغرفة ممتلئة",true);return}players[ST.uid]=mePlayer();const order=(d.order||[]).slice();if(!order.includes(ST.uid))order.push(ST.uid);await ref.update({players,order,updatedAt:TS()})}
    ST.code=code;listen(code);show("lobby");SFX.ok();
  }catch(e){toast("فشل الانضمام",true);console.warn(e)}
}

function stopListen(){try{ST.unsub&&ST.unsub()}catch(_){}try{ST.unsubMsg&&ST.unsubMsg()}catch(_){}try{ST._gUnsub&&ST._gUnsub()}catch(_){}try{ST._sUnsub&&ST._sUnsub()}catch(_){}ST.unsub=ST.unsubMsg=ST._gUnsub=ST._sUnsub=null;clearInterval(ST.timerIv);ST.timerIv=null}

function listen(code){
  stopListen();
  ST.unsub=db.collection("dgRooms").doc(code).onSnapshot(snap=>{if(!snap.exists){toast("الغرفة اتقفلت",true);leave();return}ST.room=Object.assign({code:snap.id},snap.data());onRoom()},err=>{console.warn(err);toast("انقطع الاتصال",true)});
  ST.unsubMsg=db.collection("dgRooms").doc(code).collection("msgs").orderBy("ts","asc").limit(40).onSnapshot(s=>{const box=$("chat");if(!box)return;box.innerHTML=s.docs.map(d=>{const m=d.data();const cls=m.kind==="correct"||m.kind==="system"?"sys":"";return `<div class="${cls}"><b>${esc(m.name||"?")}</b>: ${esc(m.text||"")}</div>`}).join("")||'<div class="mut">التخمينات هنا…</div>';box.scrollTop=box.scrollHeight});
}

function onRoom(){
  const r=ST.room;if(!r)return;
  if(r.status==="lobby"){renderLobby();if(ST.view!=="lobby")show("lobby")}
  else if(r.status==="choosing"){handleChoosing()}
  else if(r.status==="drawing"){handleDrawing()}
  else if(r.status==="reveal"){renderReveal()}
  else if(r.status==="ended"){renderWin()}
}

function renderLobby(){
  const r=ST.room;$("lobbyCode").textContent=r.code;
  const ids=r.order&&r.order.length?r.order:Object.keys(r.players||{});
  $("lobbyCount").textContent=ids.length+" لاعب"+(ids.length>=2?"ين":"");
  $("seatRow").innerHTML="";
  for(let i=0;i<Math.max(4,ids.length);i++){const id=ids[i],p=id&&r.players[id],div=document.createElement("div");div.className="seat";div.innerHTML=p?`<div class="av ${id===r.host?"host":""}">${esc(avatarLetter(p.name))}</div><div class="nm">${esc(p.name)}</div>`:`<div class="empty-seat">+</div><div class="nm mut">فارغ</div>`;$("seatRow").appendChild(div)}
  $("lobbyPlayers").innerHTML=ids.map(id=>{const p=r.players[id]||{},ready=!!p.ready;return `<div class="player"><div class="av ${id===r.host?"host":""}">${esc(avatarLetter(p.name))}</div><div class="meta"><div class="name">${esc(p.name||"?")}${id===ST.uid?" (أنت)":""}</div></div>${id===r.host?'<span class="badge">مضيف</span>':""}${ready?'<span class="badge ready">جاهز</span>':""}</div>`}).join("");
  const me=r.players[ST.uid]||{};$("btnReady").textContent=me.ready?"إلغاء الاستعداد":"أنا جاهز ✓";$("btnStart").style.display=r.host===ST.uid?"block":"none";
}

async function toggleReady(){const r=ST.room;if(!r)return;const cur=!!(r.players[ST.uid]&&r.players[ST.uid].ready);try{await db.collection("dgRooms").doc(r.code).update({["players."+ST.uid+".ready"]:!cur,["players."+ST.uid+".lastSeen"]:Date.now(),updatedAt:TS()});SFX.click()}catch(e){toast("مقدرتش أغيّر الحالة",true)}}

async function startGame(){
  const r=ST.room;if(!r||r.host!==ST.uid)return;const ids=Object.keys(r.players||{});if(ids.length<2){toast("محتاج لاعبين على الأقل",true);return}SFX.start();
  try{await db.collection("dgRooms").doc(r.code).update({status:"choosing",turnIdx:0,round:1,guessed:{},turn:{drawerUid:ids[0],endsAt:Date.now()+20000,phase:"choose"},order:ids,updatedAt:TS()})}catch(e){toast("فشل البدء",true);console.warn(e)}
}

function handleChoosing(){const r=ST.room,drawer=r.turn&&r.turn.drawerUid;if(drawer===ST.uid){if(ST.view!=="pick"){showPick();show("pick")}}else{if(ST.view!=="play"){show("play");$("wordBox").innerHTML='<span class="mut">الرسام بيختار كلمة…</span>';$("tools").style.display="none";$("guessBar").style.display="none"}}}

function showPick(){const pool=WORDS.slice(),picks=[];for(let i=0;i<3&&pool.length;i++){const j=Math.floor(Math.random()*pool.length);picks.push(pool.splice(j,1)[0])}$("pickGrid").innerHTML=picks.map(w=>`<button class="btn btn-blue" data-word="${esc(w)}">${esc(w)}</button>`).join("");$("pickGrid").onclick=async e=>{const b=e.target.closest("[data-word]");if(!b)return;await chooseWord(b.getAttribute("data-word"))}}

async function chooseWord(word){
  const r=ST.room;if(!r)return;SFX.ok();const secs=(r.settings&&r.settings.drawSecs)||60,ends=Date.now()+secs*1000;
  try{
    await db.collection("dgRooms").doc(r.code).collection("word").doc("state").set({drawerUid:ST.uid,options:[],word,updatedAt:TS()});
    await db.collection("dgRooms").doc(r.code).update({status:"drawing",turn:{drawerUid:ST.uid,endsAt:ends,phase:"draw",wordLen:word.length},hint:"_ ".repeat(word.length).trim(),guessed:{},updatedAt:TS()});
    const st=await db.collection("dgRooms").doc(r.code).collection("strokes").limit(40).get();const batch=db.batch();st.docs.forEach(d=>batch.delete(d.ref));await batch.commit().catch(()=>{});
    ST.secretWord=word;
  }catch(e){toast("فشل اختيار الكلمة — راجع القواعد",true);console.warn(e)}
}

function handleDrawing(){
  const r=ST.room,drawer=r.turn&&r.turn.drawerUid,isDrawer=drawer===ST.uid;
  if(ST.view!=="play")show("play");renderScores();
  $("roundChip").textContent="جولة "+(r.round||1);$("roleChip").textContent=isDrawer?"أنت بترسم":"خمّن";
  $("tools").style.display=isDrawer?"flex":"none";$("guessBar").style.display=isDrawer?"none":"flex";
  if(isDrawer){if(!ST.secretWord){db.collection("dgRooms").doc(r.code).collection("word").doc("state").get().then(s=>{if(s.exists){ST.secretWord=s.data().word;$("wordBox").innerHTML="كلمة: <b>"+esc(ST.secretWord)+"</b>"}})}else $("wordBox").innerHTML="كلمة: <b>"+esc(ST.secretWord)+"</b>";listenGuesses()}
  else{ST.secretWord=null;$("wordBox").innerHTML='<span class="hint">'+(r.hint||"_ _ _")+"</span>"}
  startTimer(r.turn&&r.turn.endsAt);setupCanvas();listenStrokes();
}

function renderScores(){const r=ST.room,ids=r.order||Object.keys(r.players||{});$("scoreboard").innerHTML=ids.map(id=>{const p=r.players[id]||{},sc=(r.stats&&r.stats[id]&&r.stats[id].score)||0;return `<div class="sc"><div class="n">${esc((p.name||"?").slice(0,8))}</div><div class="s">${sc}</div></div>`}).join("")}

function startTimer(endsAt){clearInterval(ST.timerIv);ST.endsAt=endsAt||0;const tick=()=>{const left=Math.max(0,Math.ceil((ST.endsAt-Date.now())/1000));const el=$("timer");el.textContent=left;el.className="timer"+(left<=10?" danger":left<=20?" warn":"");if(left<=5&&left>0)SFX.tick();if(left<=0){clearInterval(ST.timerIv);if(ST.room&&ST.room.host===ST.uid)endTurn(false)}};tick();ST.timerIv=setInterval(tick,250)}

async function endTurn(){const r=ST.room;if(!r)return;try{await db.collection("dgRooms").doc(r.code).update({status:"reveal",reveal:{word:ST.secretWord||"(انتهى الوقت)",solved:false,at:Date.now()},updatedAt:TS()})}catch(e){console.warn(e)}}

function renderReveal(){show("reveal");const r=ST.room;$("revealTitle").textContent=(r.reveal&&r.reveal.solved)?"تم التخمين!":"انتهى الوقت";$("revealWord").textContent="الكلمة: "+((r.reveal&&r.reveal.word)||"—");const ids=r.order||Object.keys(r.players||{});$("revealScores").innerHTML=ids.map(id=>{const p=r.players[id]||{},sc=(r.stats&&r.stats[id]&&r.stats[id].score)||0;return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--stroke)"><span>${esc(p.name)}</span><b style="color:var(--gold)">${sc}</b></div>`}).join("");$("btnNext").style.display=r.host===ST.uid?"block":"none"}

async function nextRound(){
  const r=ST.room;if(!r||r.host!==ST.uid)return;const ids=r.order||Object.keys(r.players||{});let idx=(r.turnIdx||0)+1,round=r.round||1;if(idx>=ids.length){idx=0;round++}const maxR=(r.settings&&r.settings.rounds)||5;
  if(round>maxR){await db.collection("dgRooms").doc(r.code).update({status:"ended",endedAt:TS(),updatedAt:TS()});return}
  ST.secretWord=null;ST.localGuessed=false;
  await db.collection("dgRooms").doc(r.code).update({status:"choosing",turnIdx:idx,round,turn:{drawerUid:ids[idx],endsAt:Date.now()+20000,phase:"choose"},guessed:{},hint:"",updatedAt:TS()});
}

function renderWin(){show("win");SFX.win();const r=ST.room;const ids=r.order||Object.keys(r.players||{});const ranked=ids.map(id=>({id,name:(r.players[id]||{}).name||"?",sc:(r.stats&&r.stats[id]&&r.stats[id].score)||0})).sort((a,b)=>b.sc-a.sc);$("winTitle").textContent=ranked[0]?("الفائز: "+ranked[0].name):"انتهت اللعبة";$("winSub").textContent="أحسنتم — جولة جديدة من التفوق";$("winBoard").innerHTML=ranked.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0">${i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"."} ${esc(x.name)}<b style="color:var(--gold)">${x.sc}</b></div>`).join("")}

async function leave(){stopListen();const r=ST.room;if(r&&ST.uid){try{await db.collection("dgRooms").doc(r.code).update({["players."+ST.uid]:DEL(),updatedAt:TS()})}catch(_){}}ST.room=null;ST.code=null;ST.secretWord=null;show("home")}

async function submitGuess(){
  const r=ST.room;if(!r||ST.localGuessed)return;if(r.turn&&r.turn.drawerUid===ST.uid)return;
  const text=($("guessIn").value||"").trim();if(!text)return;$("guessIn").value="";SFX.click();
  try{await db.collection("dgRooms").doc(r.code).collection("guesses").add({uid:ST.uid,name:String(ST.me.name).slice(0,60),text:text.slice(0,60),at:Date.now(),result:null})}catch(e){console.warn(e)}
}

function listenGuesses(){
  if(ST._gUnsub)try{ST._gUnsub()}catch(_){}
  if(!ST.room)return;
  ST._gUnsub=db.collection("dgRooms").doc(ST.room.code).collection("guesses").orderBy("at","desc").limit(20).onSnapshot(async snap=>{
    const r=ST.room;if(!r)return;if(r.turn&&r.turn.drawerUid!==ST.uid)return;if(!ST.secretWord)return;
    for(const d of snap.docs){const g=d.data();if(g.result!=null)continue;if(norm(g.text)===norm(ST.secretWord)){try{await d.ref.update({result:"correct"});await awardCorrect(g.uid,g.name)}catch(e){console.warn(e)}break}else{try{await d.ref.update({result:"wrong"})}catch(_){}}}
  });
}

async function awardCorrect(uid,name){
  const r=ST.room;if(!r)return;ST.localGuessed=true;const stats=Object.assign({},r.stats||{});if(!stats[uid])stats[uid]={score:0};if(!stats[r.turn.drawerUid])stats[r.turn.drawerUid]={score:0};stats[uid].score=(stats[uid].score||0)+10;stats[r.turn.drawerUid].score=(stats[r.turn.drawerUid].score||0)+5;const guessed=Object.assign({},r.guessed||{});guessed[uid]=true;
  try{await db.collection("dgRooms").doc(r.code).collection("msgs").add({uid:ST.uid,name:String(ST.me.name).slice(0,60),kind:"correct",text:("✔ "+(name||"لاعب")+" خمن الكلمة").slice(0,80),ts:TS()});await db.collection("dgRooms").doc(r.code).update({stats,guessed,status:"reveal",reveal:{word:ST.secretWord,solved:true,solver:uid,at:Date.now()},updatedAt:TS()});SFX.ok()}catch(e){console.warn(e)}
}

function setupCanvas(){const c=$("c");if(!c)return;const dpr=Math.min(window.devicePixelRatio||1,2);const rect=c.getBoundingClientRect();c.width=Math.floor(rect.width*dpr);c.height=Math.floor(rect.height*dpr);const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap="round";ctx.lineJoin="round";c._ctx=ctx}

function listenStrokes(){
  if(ST._sUnsub)try{ST._sUnsub()}catch(_){}
  if(!ST.room)return;const c=$("c");if(!c||!c._ctx)setupCanvas();
  ST._sUnsub=db.collection("dgRooms").doc(ST.room.code).collection("strokes").orderBy("at","asc").limitToLast(80).onSnapshot(snap=>{
    const c=$("c");if(!c||!c._ctx)return;const ctx=c._ctx;ctx.clearRect(0,0,c.width,c.height);
    snap.docs.forEach(d=>{const s=d.data();if(!s.pts||s.pts.length<2)return;ctx.strokeStyle=s.c||"#111";ctx.lineWidth=s.w||3;ctx.beginPath();ctx.moveTo(s.pts[0][0]*c.clientWidth,s.pts[0][1]*c.clientHeight);for(let i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i][0]*c.clientWidth,s.pts[i][1]*c.clientHeight);ctx.stroke()});
  });
}

function bindCanvas(){
  const c=$("c");let drawing=false,pts=[];
  function pos(e){const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)/r.width,(t.clientY-r.top)/r.height]}
  function drawLocal(a,b){const ctx=c._ctx;if(!ctx)return;ctx.strokeStyle=ST.brush.c;ctx.lineWidth=ST.brush.c==="#ffffff"?14:ST.brush.w;ctx.beginPath();ctx.moveTo(a[0]*c.clientWidth,a[1]*c.clientHeight);ctx.lineTo(b[0]*c.clientWidth,b[1]*c.clientHeight);ctx.stroke()}
  c.addEventListener("pointerdown",e=>{if(ST.view!=="play")return;const r=ST.room;if(!r||!r.turn||r.turn.drawerUid!==ST.uid)return;e.preventDefault();drawing=true;pts=[pos(e)];try{c.setPointerCapture(e.pointerId)}catch(_){}});
  c.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const p=pos(e);const a=pts[pts.length-1];pts.push(p);drawLocal(a,p)});
  async function end(){if(!drawing)return;drawing=false;if(pts.length<2){pts=[];return}const seg={c:ST.brush.c,w:ST.brush.c==="#ffffff"?14:ST.brush.w,pts:pts.slice(0,60),at:Date.now()};pts=[];try{await db.collection("dgRooms").doc(ST.room.code).collection("strokes").add({c:seg.c,w:seg.w,pts:seg.pts,at:seg.at,tool:"pen"})}catch(err){console.warn(err)}}
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);c.addEventListener("pointerleave",end);
}

async function clearCanvas(){const r=ST.room;if(!r||!r.turn||r.turn.drawerUid!==ST.uid)return;SFX.click();try{const st=await db.collection("dgRooms").doc(r.code).collection("strokes").limit(80).get();const batch=db.batch();st.docs.forEach(d=>batch.delete(d.ref));await batch.commit()}catch(e){toast("فشل المسح",true)}}

$("btnCreate").onclick=()=>createRoom();
$("btnJoin").onclick=()=>joinRoom($("joinCode").value);
$("joinCode").addEventListener("keydown",e=>{if(e.key==="Enter")joinRoom($("joinCode").value)});
$("btnCopy").onclick=()=>{try{navigator.clipboard.writeText(ST.code||"");toast("تم نسخ "+ST.code)}catch(_){toast(ST.code||"")}};
$("btnReady").onclick=()=>toggleReady();
$("btnStart").onclick=()=>startGame();
$("btnLeaveLobby").onclick=()=>leave();
$("btnBack").onclick=()=>{if(ST.view==="home"){try{history.back()}catch(_){}}else leave()};
$("btnMute").onclick=()=>{ST.mute=!ST.mute;$("btnMute").textContent=ST.mute?"🔇":"🔊"};
$("btnGuess").onclick=()=>submitGuess();
$("guessIn").addEventListener("keydown",e=>{if(e.key==="Enter")submitGuess()});
$("btnClear").onclick=()=>clearCanvas();
$("btnNext").onclick=()=>nextRound();
$("btnHome").onclick=()=>leave();
document.querySelectorAll(".swatch").forEach(el=>{el.onclick=()=>{document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("on"));el.classList.add("on");ST.brush.c=el.getAttribute("data-c");SFX.click()}});
document.querySelectorAll(".size-btn").forEach(el=>{el.onclick=()=>{document.querySelectorAll(".size-btn").forEach(x=>x.classList.remove("on"));el.classList.add("on");ST.brush.w=parseInt(el.getAttribute("data-w"),10);SFX.click()}});
bindCanvas();window.addEventListener("resize",()=>{if(ST.view==="play")setupCanvas()});boot();
})();

</script>
</body>
</html>
